[workspace]
resolver = "2"
# Bloch Protocol — the ownerless protocol / main blockchain. Node + the
# protocol crates only. The Postern Labs products (wallets, messenger, OS)
# live in their own repo and depend on this one as a git dependency.
#
# This is a VIRTUAL manifest: the repo root is not itself a package. It used
# to be — the root package was `bloch`, the Genesis-3 proof-of-work node — so
# a bare `cargo build` at the root built the retired chain's binary and
# presented it as the repo's default output. Genesis-4 (proof of stake) went
# live on 2026-08-13 and Genesis-3 stopped at height 39,918; the layout now
# says so. The PoW node is a normal member at legacy/genesis3-node.
members = [
    # ── Genesis-4, proof of stake. THE LIVE CHAIN. ──
    "crates/bloch-pos-committee",  # frozen consensus math (pure, sha3-only)
    "crates/bloch-pos-node",       # the `bloch-pos` binary the fleet runs
    "tools/genesis4-ceremony",     # assembled the live genesis block

    # ── Shared protocol crates. Used by BOTH eras; not PoW-only. ──
    # bloch-crypto is on the Genesis-4 consensus path (hybrid ML-DSA-65 ‖
    # Falcon-1024), and it pulls bloch-sis-pow + coherence-core, which is why
    # those two stay here rather than moving under legacy/.
    "crates/bloch-crypto",
    "crates/bloch-sis-pow", "crates/coherence-core", "crates/pqcrypto-internals",
    "crates/bloch-btc-wallet",
    "crates/bloch-pq-vault",   # non-custodial PQ-shield vault (P2WSH commit-delay-reveal + PQ clawback anchor)
    "crates/bloch-withdraw",   # reference exchange withdrawal client (idempotent, double-payment-safe)

    # ── Genesis-3, proof of work. CLOSED — kept buildable for audit. ──
    "legacy/genesis3-node",    # the `bloch` binary; ran mainnet to h39,918
    "crates/bloch-euvm", "crates/bloch-ffg",  # eUTXO VM + FFG committee (Genesis-3, behind its `euvm` feature)
]
# coherence-prover (SP1 guest/script/service) + fuzz use heavy/nightly-only
# toolchains; keep them out of the everyday workspace build.
#
# NOTHING ELSE IS EXCLUDED, AND NOTHING IS SILENTLY DROPPED. A crate that
# carries its own `[workspace]` table is invisible to `cargo build/test
# --workspace`, so the first command a reviewer runs would skip it. That is
# how the entire PoS consensus once went untested at the root. If you add a
# crate, add it to `members` — do not give it a private workspace.
exclude = ["crates/coherence-prover", "fuzz"]

[profile.release]
opt-level      = 3
lto            = true
codegen-units  = 1
# MANDATORY for any consensus build (bloch-euvm audit F3, 2026-07): without this,
# release builds WRAP on integer overflow while debug/test builds PANIC — a
# validator set on mixed profiles can diverge (crash vs. wrapped value) on the same
# input = a consensus split. `overflow-checks = true` makes every profile fail-closed
# identically (checked arithmetic in-source turns these into deterministic Err/VmError;
# any remaining unchecked overflow panics rather than silently wrapping). Do NOT remove
# this from a consensus build profile.
overflow-checks = true

# pqcrypto-internals fork VENDORED at crates/pqcrypto-internals (was a private
# git dep that no clean build — Docker, Akash, CI — could fetch). It is a
# drop-in modification of pqcrypto-internals 0.2.11 adding thread-local
# seeded-RNG support (`with_seeded_rng`) for deterministic ML-DSA-65 / Falcon
# keygen, enabling Wallet::from_seed(). Vendoring makes the workspace
# self-contained and reproducible.
# Keccak is the hot path of every state-root and reveal-chain test in the
# workspace: unoptimized, `bloch-pos-committee`'s suite spends minutes inside
# the permutation alone. Optimize ONLY these two dependencies under dev. This
# leaves every workspace crate's own code at full debug, and inherits
# `overflow-checks` from the dev profile untouched — `opt-level` cannot change
# overflow behaviour, so the consensus guarantee stated above is unaffected.
# Measured on tests/state_root_carryover_scale.rs: 239.55s -> 33.84s (7.1x).
[profile.dev.package.sha3]
opt-level = 3

[profile.dev.package.keccak]
opt-level = 3

[patch.crates-io]
pqcrypto-internals = { path = "crates/pqcrypto-internals" }
