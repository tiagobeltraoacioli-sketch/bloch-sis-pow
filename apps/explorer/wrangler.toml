name = "bloch-explorer"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Cloudflare Pages project for blochl1.com (live domain; the old
# explorer.posternlabs.com name is retired).
# The /rpc Function no longer forwards to one node. It reads from the two
# keyless archival observers, corroborates against a fleet validator on a
# schedule, caches on immutability and caps its own upstream call rate; see
# functions/rpc.js and edge/.
#
# It is set HERE, in git, rather than only in the dashboard. The earlier note
# said not to hardcode a node address; that was written before there was a
# permanent one, and the dashboard-only setting is what broke the site: it was
# pointing at g2rpc.blochl1.com — a proxied cfargotunnel hostname — so /rpc
# returned 1003 for a day and nobody could see the value that caused it. An
# address in the repo is reviewable, diffable and deployed atomically with the
# code that reads it. The archival node's IP is a public fact about a
# read-only public RPC; there is nothing here to keep secret.
#
# Deploy (production → blochl1.com):
#   npm run build
#   CLOUDFLARE_ACCOUNT_ID=CLOUDFLARE_ACCOUNT_ID \
#     npx wrangler pages deploy dist --project-name bloch-explorer --branch main --commit-dirty=true

[vars]
# ─────────────────────────────────────────────────────────────────────────────
# THE TWO POOLS. They are not interchangeable; see edge/pool.js.
# ─────────────────────────────────────────────────────────────────────────────
#
# EXPLORER_ARCHIVALS — the DATA PLANE. Both are keyless observers: no
# validator.key, started in the node's observer mode, zero blocks proposed.
# That is the property that matters. A node that cannot propose cannot
# manufacture a branch, so the worst it can do to a reader is be behind or be
# down — and both are detectable, which lying would not be. EVERY read this
# explorer serves comes from here.
#
# EXPLORER_FLEET — the WITNESS PLANE. Validators. Asked ONE question,
# getchaininfo, at most once per 20 s across the whole isolate however much
# traffic arrives, for one purpose: to certify that the lineage the archivals
# answered from is the lineage the validator set is building on. Never used to
# serve a read.
#
# WHY THE SPLIT. Two archivals agreeing is not corroboration — they are the
# same population, same role, same operator, same provisioning, and (measured
# 2026-09-01) the same binary generation, which is older than this repo's: all
# nine deployed upstreams answer -32601 to `getcapabilities`, a method frozen
# into the node's RPC_SURFACE at surface version 4.1.0. Two nodes built from
# one stale artefact fail identically. The site's own proxy learned this and
# made a fleet box mandatory in wave 1 (functions/g4rpc.js in the site repo);
# what it does not do is bound the cost, because it pays a fleet round trip per
# uncached call. Here the fleet is consulted on a schedule, so public traffic
# cannot become validator load.
#
# WHY IN GIT AND NOT ONLY IN THE DASHBOARD. Unchanged from the Genesis-3 note
# below: for Pages, this file's [vars] OVERRIDES the dashboard setting on every
# `wrangler pages deploy`, so editing the dashboard alone does nothing if a
# deploy follows. That was measured the hard way. These are public IPs of a
# read-only public RPC; there is nothing here to keep secret.
#
# WHY IP.nip.io AND NOT A BARE IP. Measured 2026-08-12: a Pages Function is a
# Worker, and a Worker fetch() to a bare IP literal is answered by Cloudflare
# itself with 403 "error code: 1003" — it never reaches the origin. A
# Cloudflare-PROXIED hostname trips the same 1003 from the other direction. The
# upstream must be a hostname that resolves DNS-only to the origin, which is
# what the nip.io wildcard does. Same form the site's g4rpc proxy uses.
EXPLORER_ARCHIVALS = "http://139.180.166.5.nip.io:8080/ http://139.180.173.231.nip.io:8080/"
EXPLORER_FLEET = "http://139.84.201.52.nip.io:8080/ http://139.84.202.139.nip.io:8080/ http://139.84.204.46.nip.io:8080/ http://139.84.205.54.nip.io:8080/ http://149.28.180.128.nip.io:8080/ http://67.219.108.230.nip.io:8080/ http://67.219.108.96.nip.io:8080/"

# ─────────────────────────────────────────────────────────────────────────────
# RETIRED: BLOCH_RPC_URL
# ─────────────────────────────────────────────────────────────────────────────
#
# It pointed at `http://136-244-82-226.sslip.io/` — node4, the Genesis-3
# archival. Genesis-3 stopped at height 39,918 on 2026-08-13 and Genesis-4
# replaced it. The variable is gone rather than repointed, because /rpc no
# longer has a single upstream to point anywhere: it has two pools with
# different roles, and one variable could not express that without hiding it.
#
# The comment that used to live here — the 1003 measurement and the
# dashboard-overrides-on-deploy warning — is preserved above, because both
# facts are still true and both were learned expensively.
