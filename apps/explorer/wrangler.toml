name = "bloch-explorer"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Cloudflare Pages project for explorer.posternlabs.com.
# The /rpc Function forwards to a reachable read-only Genesis-2 node RPC.
# Set BLOCH_RPC_URL in the Pages project (Settings → Environment variables),
# e.g. https://g2-rpc.posternlabs.com/  — do NOT hardcode a node IP here.
#
# Deploy (production → explorer.posternlabs.com once DNS is wired):
#   npm run build
#   CLOUDFLARE_ACCOUNT_ID=4e44d592d0229f8faa3fdb2f139c611c \
#     npx wrangler pages deploy dist --project-name bloch-explorer --branch main --commit-dirty=true
