name = "posternlabs-holding"
main = "worker.js"
compatibility_date = "2026-10-06"
# Other paths are fetched from the existing Pages site on the same zone, not from this Worker again.
compatibility_flags = ["global_fetch_private_origin"]
workers_dev = false
preview_urls = false

# Every path is routed so query-string requests for the home page are covered too;
# the Worker passes all non-home paths through untouched.
routes = [
  { pattern = "posternlabs.com/*", zone_name = "posternlabs.com" }
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
