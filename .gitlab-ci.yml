# Bloch-SIS Protocol — GitLab CI
#
# Runs on a self-hosted shell runner (tag: bloch-mac) using the host's Rust
# toolchain + clang/cmake (rocksdb bindgen, blst, pqcrypto/PQClean build needs
# a C toolchain). GitLab.com shared runners require identity verification, so
# this project uses its own runner instead.

stages:
  - check
  - test
  - nix

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

default:
  # Self-hosted aarch64 Linux runner (Graviton), shell executor running as the
  # `ubuntu` user (has the Rust toolchain + clang/cmake for rocksdb/blst/PQClean).
  # The macOS `bloch-mac` runner is offline; this brings CI online on Linux.
  tags:
    - bloch-linux-aarch64
  before_script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustc --version && cargo --version
    - clang --version | head -1 || true
    - cmake --version | head -1 || true

# Formatting — informational (does not block; the fork is not yet rustfmt-clean).
fmt:
  stage: check
  script:
    - rustup component add rustfmt || true
    - cargo fmt --all -- --check
  allow_failure: true

# Lint — informational.
clippy:
  stage: check
  script:
    - rustup component add clippy || true
    - cargo clippy --all-targets
  allow_failure: true

# Hardened Clippy — BLOCKING, scoped to CONSENSUS-CRITICAL code only.
# Denies panics (unwrap/expect) and unchecked arithmetic in consensus, emission
# and tokenomics paths — a panic reachable from an untrusted block/tx is a DoS,
# and an arithmetic overflow in emission is an inflation bug. See
# scripts/hardened-clippy.sh for the exact scope + why --no-deps is required.
clippy-hardened:
  stage: check
  script:
    - rustup component add clippy || true
    - bash scripts/hardened-clippy.sh

# Property-based consensus invariants — determinism / parent-order independence
# of GhostDAG colouring, emission monotonicity + value conservation, founder
# vesting cap. Part of the workspace test run, called out here for visibility.
consensus-proptest:
  stage: test
  script:
    - cargo test -p bloch ghostdag_proptest
    - cargo test -p bloch-crypto --lib tokenomics

# Miri — UB / provenance / uninit-read check on the pure-Rust consensus + emission
# unit tests. NOT the whole workspace: the node pulls in C FFI (PQClean, rocksdb,
# blst) that Miri cannot execute, so Miri is scoped to the FFI-free crates/tests.
# `cargo miri setup` needs the rust-src component (network); mark non-blocking.
miri-consensus:
  stage: test
  allow_failure: true
  script:
    - rustup toolchain install nightly --component miri --component rust-src || true
    - cargo +nightly miri test -p bloch-crypto --lib tokenomics
    # Local command (documented, may need `cargo +nightly miri setup` first):
    #   cargo +nightly miri test -p bloch-crypto --lib tokenomics
  when: manual

# Trademark + attestation-bleed gate (roadmap risk R1, CRITICAL).
# BLOCKING: fails the pipeline on any occurrence of the Class-9 registered mark
# (ship as Yagabona / Izbushka) OR any affirmative unearned earned-word claim. It
# does NOT flag the bare words attested/audited/reproducible (legitimate Nix attrs
# + the SEV-SNP subsystem) or honest disclaimers. The banned patterns live only in
# scripts/ci-banned-words.sh (which self-excludes from its own scan); this comment
# stays clear of the literal strings so the gate does not flag itself. Pure
# git-grep, no Rust toolchain — override the default before_script.
trademark-gate:
  stage: check
  before_script: []
  script:
    - bash scripts/ci-banned-words.sh

# Supply-chain — RUSTSEC advisories, permissive-license + no-git-dep policy.
# BLOCKING: a supply-chain violation must fail the pipeline; see deny.toml.
# S5: flipped from informational to blocking. The old comment's precondition
# ("verified green on the new Linux runner") is a CI-run verification, not an
# external gate: run `cargo deny check advisories bans licenses sources` once
# on the runner before merging this flip. If the first blocking run surfaces a
# pre-existing advisory, fix it or add an `ignore` entry to deny.toml WITH a
# written rationale — do not re-flip to allow_failure.
supply-chain:
  stage: check
  script:
    - cargo install cargo-deny --locked 2>/dev/null || true
    - cargo deny check advisories bans licenses sources
  allow_failure: false

# cargo-audit — narrower RUSTSEC-only backstop to cargo-deny: an independent
# implementation of the advisory check, so a cargo-deny regression or a
# deny.toml misconfiguration cannot silently disable advisory scanning.
# BLOCKING, same posture as supply-chain. `--deny warnings` also fails on
# unmaintained/unsound informational advisories.
cargo-audit:
  stage: check
  script:
    - cargo install cargo-audit --locked 2>/dev/null || true
    - cargo audit --deny warnings
  allow_failure: false

# osv-scanner — supplementary advisory scan against the OSV.dev DB (RustSec +
# GHSA). Catches GHSA-only advisories that cargo-audit's RustSec-only feed does
# NOT carry (e.g. yamux GHSA-vxx9-2994-q338, the plonky3 p3-* crates). Kept
# NON-BLOCKING: it needs network for the OSV DB and its GHSA set overlaps but is
# not identical to the deny.toml/audit.toml ignore policy, so it is an early-
# warning surface, not a hard gate. Findings are triaged in SECURITY_TOOLING.md
# §Advisory-posture. Local run: osv-scanner --lockfile=Cargo.lock
osv-scanner:
  stage: check
  before_script: []
  script:
    - |
      if ! command -v osv-scanner >/dev/null; then
        echo "osv-scanner not installed on this runner — install:"
        echo "  go install github.com/google/osv-scanner/cmd/osv-scanner@latest"
        echo "skipping (informational)."
        exit 0
      fi
    - osv-scanner --lockfile=Cargo.lock
  allow_failure: true

# Secret scanning — catch committed credentials (e.g. a leaked token) before they
# reach history. Best practice given the project's own PAT-rotation lesson.
secret-scan:
  stage: check
  before_script: []
  script:
    - |
      if ! command -v gitleaks >/dev/null; then
        echo "gitleaks not installed on this runner — skipping (informational)."
        exit 0
      fi
    - gitleaks detect --source . --no-banner --redact
  allow_failure: true

# Build + full test suite (the gate).
build-and-test:
  stage: test
  script:
    - cargo build --all-targets
    - cargo test --workspace
  # Memory-hard (Argon2) wallet tests + a testnet Module-SIS mining test.
  timeout: 60m

# Lean mobile-facing build — the crypto/address/tx/wallet subset must compile
# WITHOUT the node's heavy deps (rocksdb/libp2p, gated by the `node` feature), so
# the Android/iOS cross-compile stays possible.
lean-build:
  stage: test
  script:
    - cargo build --no-default-features --lib
    - "! cargo tree --no-default-features -e no-dev -i rocksdb >/dev/null 2>&1 && echo 'ok: no rocksdb in lean graph'"
    - "! cargo tree --no-default-features -e no-dev -i libp2p  >/dev/null 2>&1 && echo 'ok: no libp2p in lean graph'"
  allow_failure: true   # informational until verified on the new Linux runner

# Postern Wallet core (separate build root) — golden byte-compat + UniFFI wrapper.
mobile-core:
  stage: test
  script:
    - '[ -d mobile/core ] || { echo "mobile/core lives in bloch-protocol, not here — skipping."; exit 0; }'
    - cd mobile/core && cargo test --lib
  allow_failure: true   # informational until verified on the new Linux runner

# PoW parameter screen (pure Python, no Sage) — trivial-regime + feasibility.
pow-screen:
  stage: check
  before_script: []
  script:
    - python3 deploy/pow-estimator/screen.py
  allow_failure: true

# PoW hardness estimate (S1) — manual, heavy: builds the SageMath +
# lattice-estimator container and prints the parameter hardness table.
# See docs/specs/POW-HARDNESS.md + deploy/pow-estimator/.
pow-estimator:
  stage: check
  before_script: []
  script:
    - docker build -t bloch-pow-estimator -f deploy/pow-estimator/Dockerfile .
    - docker run --rm bloch-pow-estimator
  rules:
    - when: manual
  allow_failure: true
  timeout: 60m

# ── Nix stage (roadmap #2 pin-inputs, #9 determinism) ─────────────────────────
# These jobs need a Linux host with Nix + flakes enabled — NOT the macOS
# `bloch-mac` shell runner. They target a self-hosted aarch64 Linux runner
# (tag: bloch-nix-aarch64) so the node crate is repro-checked NATIVELY, without
# binfmt qemu emulation. Override the default before_script (it exports the Rust
# toolchain and runs rustc/cargo, which is irrelevant here).
#
# NOTE (permissive-license discipline): diffoscope is GPL-3.0 and Nix/CI helpers
# vary. They run only as ephemeral CI/dev tools, are never linked into or shipped
# in the image, and so do NOT touch the permissive image closure. The no-AGPL
# rule bars AGPL anywhere (even as a network service); it does not ban GPL dev
# tooling. See REPRO.md.

# flake.lock drift gate (roadmap #2 — pin all Nix inputs).
# Asserts the lock is COMMITTED and CURRENT: `nix flake lock --no-update-lock-file`
# errors if the lock would need updating, and `git diff --exit-code flake.lock`
# fails on any drift. Needs Nix (aarch64 Linux runner), so it lives in the `nix`
# stage on the same tag as `repro`.
#
# allow_failure: TRUE for now, because flake.lock is not yet committed (it is
# generated by the human on the aarch64 host via scripts/flake-lock.sh — agents do
# not run Nix). The guard step below fails SOFT with an explicit message until the
# lock lands. Once flake.lock is committed, remove the guard block AND flip
# allow_failure -> false to make drift BLOCKING.
flake-lock-drift:
  stage: nix
  tags:
    - bloch-nix-aarch64
  before_script: []
  script:
    # GUARD (remove once flake.lock is committed): keep this job green-by-design
    # until the lock exists, rather than red on a file that is not there yet.
    - |
      if [ ! -f flake.lock ]; then
        echo "flake.lock not committed yet — generate it on the aarch64 host with"
        echo "scripts/flake-lock.sh, commit it, then flip this job to BLOCKING."
        exit 1
      fi
    - nix flake lock --no-update-lock-file
    - git diff --exit-code flake.lock
  allow_failure: true   # TODO: flip to false once flake.lock is committed (remove the guard above).

# Single-host reproducibility self-check: `--rebuild --check` forces a local
# rebuild and fails if the output differs from what is already in the store
# (Nix's native determinism check). Native aarch64 = the cheapest, honest first
# measurement (bundled RocksDB 8.10 C++ is the #1 nondeterminism risk).
#
# INFORMATIONAL for now (allow_failure): a clean single-host check is necessary
# but NOT sufficient for the word "reproducible" — that is earned only by the
# two-builder bit-for-bit compare (repro-manifest.sh + repro-compare.sh across
# two independent hosts). Flip allow_failure -> false once that is green.
repro:
  stage: nix
  tags:
    - bloch-nix-aarch64
  before_script: []
  script:
    # (A) the node/wallet crate — native aarch64, highest-risk, cheapest.
    - nix build .#packages.aarch64-linux.bloch --rebuild --check --keep-failed -L
    # (B) the aarch64-native sealed image — repro-checked without emulation.
    - nix build .#packages.aarch64-linux.attested-image --rebuild --check --keep-failed -L
  after_script:
    - 'command -v diffoscope >/dev/null && diffoscope /tmp/nix-build-*.check* > diffoscope.txt 2>&1 || true'
  artifacts:
    when: on_failure
    paths:
      - diffoscope.txt
  allow_failure: true
  timeout: 120m

# mainnet-guard (PLACEHOLDER — TODO, gated on Dev-A's `mainnet` feature landing).
# Once Dev-A's `cargo test --features mainnet` guard is merged (the test that
# refuses to build/run mainnet while security preconditions are unmet), enable
# this job by removing the `when: never` rule and the guard below. Until then it
# is inert so the pipeline neither runs nor fails on a feature that does not yet
# exist.
mainnet-guard:
  stage: check
  script:
    # TODO(dev-a): replace with `cargo test --features mainnet --workspace` once
    # the `mainnet` feature + guard test exist. Keeping it a no-op until then.
    - 'echo "mainnet-guard: TODO — enable once Dev-A merges the mainnet feature guard"'
  rules:
    - when: never   # TODO: remove this rule when the mainnet feature exists
  allow_failure: true
