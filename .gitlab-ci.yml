# Bloch Protocol — GitLab CI
#
# The chain this pipeline gates is GENESIS-4, PROOF OF STAKE, live since
# 2026-08-13. Genesis-3 (proof of work) stopped at height 39,918 and its node
# is at legacy/genesis3-node/; jobs that still exercise it are marked, and they
# are there for the audit trail of Genesis-4's opening ledger, not because
# anything mines.
#
# Runs on a self-hosted shell runner (tag: bloch-mac) using the host's Rust
# toolchain + clang/cmake (rocksdb bindgen, blst, pqcrypto/PQClean build needs
# a C toolchain). GitLab.com shared runners require identity verification, so
# this project uses its own runner instead.

stages:
  - check
  - test
  - nix

variables:
  CARGO_TERM_COLOR: "always"
  RUST_BACKTRACE: "1"

default:
  # Self-hosted aarch64 Linux runner (Graviton), shell executor running as the
  # `ubuntu` user (has the Rust toolchain + clang/cmake for rocksdb/blst/PQClean).
  # The macOS `bloch-mac` runner is offline; this brings CI online on Linux.
  tags:
    - bloch-linux-aarch64
  before_script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustc --version && cargo --version
    - clang --version | head -1 || true
    - cmake --version | head -1 || true

# Formatting — informational (does not block; the fork is not yet rustfmt-clean).
fmt:
  stage: check
  script:
    - rustup component add rustfmt || true
    - cargo fmt --all -- --check
  allow_failure: true

# Lint — informational.
clippy:
  stage: check
  script:
    - rustup component add clippy || true
    - cargo clippy --all-targets
  allow_failure: true

# Hardened Clippy — BLOCKING, scoped to CONSENSUS-CRITICAL code only.
# Denies panics (unwrap/expect) and unchecked arithmetic in consensus, emission
# and tokenomics paths — a panic reachable from an untrusted block/tx is a DoS,
# and an arithmetic overflow in emission is an inflation bug.
#
# CHANGED 2026-08-13, twice over. Its scope was Genesis-3 only — it had never
# linted bloch-pos-committee, the consensus that is actually producing blocks.
# Adding the live crates also revealed that the job could not have been green
# on the retired ones either (59 findings in `bloch`, 22 in `bloch-crypto`), so
# it was a blocking gate that blocked nothing because it always failed. It is
# now a per-crate RATCHET: recorded baselines, and the build fails when a count
# goes up. See scripts/hardened-clippy.sh for the baselines, why they are not
# zero, and why --no-deps is required.
clippy-hardened:
  stage: check
  script:
    - rustup component add clippy || true
    - bash scripts/hardened-clippy.sh

# Consensus invariants, called out from the workspace run for visibility.
#
# The LIVE chain first: the whole Genesis-4 consensus crate and the node that
# runs it. This job used to name only GhostDAG colouring and V2 emission — the
# invariants of a chain that has stopped — which meant the pipeline had no job
# whose name pointed at the consensus that is actually producing blocks.
consensus-tests:
  stage: test
  script:
    # Genesis-4 — LIVE.
    - cargo test -p bloch-pos-committee
    - cargo test -p bloch-pos-node
    # Genesis-3 — closed. Property-based determinism / parent-order
    # independence of GhostDAG colouring, and V2 emission monotonicity + value
    # conservation. Retained because Genesis-4's opening ledger is the output
    # of these rules.
    - cargo test -p bloch ghostdag_proptest
    - cargo test -p bloch-crypto --lib tokenomics

# Miri — UB / provenance / uninit-read check on the pure-Rust consensus + emission
# unit tests. NOT the whole workspace: the node pulls in C FFI (PQClean, rocksdb,
# blst) that Miri cannot execute, so Miri is scoped to the FFI-free crates/tests.
# `cargo miri setup` needs the rust-src component (network); mark non-blocking.
#
# SCOPE, stated rather than hidden — the job name overstates it. `bloch-crypto`
# IS shared with Genesis-4 (it carries the hybrid ML-DSA-65 ‖ Falcon-1024
# signature path), but the `tokenomics` filter selects only
# `core/tokenomics_v2.rs` — the V2 emission of the chain that stopped at height
# 39,918. Genesis-4's emission is `tokenomics_v4` in bloch-pos-committee, which
# is not run here, so no Genesis-4 consensus code goes under Miri in this job.
# bloch-pos-committee is the better target — pure Rust, no FFI, and it is the
# live consensus — but its suite walks 8,192-step SHAKE-256 reveal chains and
# 256-deep sparse Merkle trees, which under the Miri interpreter is hours, not
# minutes. Adding it without first carving out a bounded subset would give a job
# that always times out, which is worse than an honest gap. It is a gap.
miri-consensus:
  stage: test
  allow_failure: true
  script:
    - rustup toolchain install nightly --component miri --component rust-src || true
    - cargo +nightly miri test -p bloch-crypto --lib tokenomics
    # Local command (documented, may need `cargo +nightly miri setup` first):
    #   cargo +nightly miri test -p bloch-crypto --lib tokenomics
  when: manual

# Trademark + attestation-bleed gate (roadmap risk R1, CRITICAL).
# BLOCKING: fails the pipeline on any occurrence of the Class-9 registered mark
# (ship as Yagabona / Izbushka) OR any affirmative unearned earned-word claim. It
# does NOT flag the bare words attested/audited/reproducible (legitimate Nix attrs
# + the SEV-SNP subsystem) or honest disclaimers. The banned patterns live only in
# scripts/ci-banned-words.sh (which self-excludes from its own scan); this comment
# stays clear of the literal strings so the gate does not flag itself. Pure
# git-grep, no Rust toolchain — override the default before_script.
trademark-gate:
  stage: check
  before_script: []
  script:
    - bash scripts/ci-banned-words.sh

# Falcon constant-time guard (PoS finding F1, BLOCH-FALCON-ONLINE-SIGNING.md
# §3.2). BLOCKING: fails if the workspace's resolved features for
# pqcrypto-falcon include "avx2" or "neon" — those dispatch Falcon SIGNING to
# PQClean's native floating-point variants, forbidden for a validator that
# signs on a public schedule. The declarations pin `default-features = false`
# (clean = integer-only, constant-time), but Cargo features are additive, so a
# single member re-enabling defaults would silently poison every binary; this
# catches it at the graph level, and bloch-crypto's
# `falcon_native_fp_variants_are_not_linked` test (in build-and-test) catches
# it at the linked-binary level. Metadata-only — no build.
falcon-clean-guard:
  stage: check
  script:
    - bash scripts/falcon-clean-guard.sh
  allow_failure: false

# G8 release-integrity gate (BLOCH-POS-SHA3-LATTICE-MIGRATION.md §11).
# BLOCKING: the published Genesis-3 release WAS the broken binary (f819e87f,
# an abandoned branch) while the fixes lived only on the boxes — fresh nodes
# froze at 10802 and nobody noticed the divergence until they did. This job
# proves, on every pipeline: (1) the workspace resolves with --locked and the
# committed lockfile does not drift — see the scope caveat in the script's §1,
# which checks the ROOT lockfile twice rather than two lockfiles, now that both
# PoS crates are root workspace members; (2) two clean builds of bloch-pos at
# the same commit are bit-identical (same-path determinism — the path-scoped
# caveat and the canonical /build rule are deploy/RELEASE-INTEGRITY.md §3);
# (3) `bloch-pos --version` reports the exact commit being built, so a fleet
# binary can always be traced to source. Runbook + measured baseline:
# deploy/RELEASE-INTEGRITY.md. ~1 min: the PoS workspace is small by design.
# The toolchain is pinned by crates/bloch-pos-node/rust-toolchain.toml; the
# install line makes a fresh runner self-provision instead of failing.
pos-release-integrity:
  stage: check
  script:
    - rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/bloch-pos-node/rust-toolchain.toml)" --profile minimal || true
    - bash scripts/pos-release-integrity.sh
  allow_failure: false

# Supply-chain — RUSTSEC advisories, permissive-license + no-git-dep policy.
# BLOCKING: a supply-chain violation must fail the pipeline; see deny.toml.
# S5: flipped from informational to blocking. The old comment's precondition
# ("verified green on the new Linux runner") is a CI-run verification, not an
# external gate: run `cargo deny check advisories bans licenses sources` once
# on the runner before merging this flip. If the first blocking run surfaces a
# pre-existing advisory, fix it or add an `ignore` entry to deny.toml WITH a
# written rationale — do not re-flip to allow_failure.
supply-chain:
  stage: check
  script:
    - cargo install cargo-deny --locked 2>/dev/null || true
    - cargo deny check advisories bans licenses sources
  allow_failure: false

# cargo-audit — narrower RUSTSEC-only backstop to cargo-deny: an independent
# implementation of the advisory check, so a cargo-deny regression or a
# deny.toml misconfiguration cannot silently disable advisory scanning.
# BLOCKING, same posture as supply-chain. `--deny warnings` also fails on
# unmaintained/unsound informational advisories.
cargo-audit:
  stage: check
  script:
    - cargo install cargo-audit --locked 2>/dev/null || true
    - cargo audit --deny warnings
  allow_failure: false

# osv-scanner — supplementary advisory scan against the OSV.dev DB (RustSec +
# GHSA). Catches GHSA-only advisories that cargo-audit's RustSec-only feed does
# NOT carry (e.g. yamux GHSA-vxx9-2994-q338, the plonky3 p3-* crates). Kept
# NON-BLOCKING: it needs network for the OSV DB and its GHSA set overlaps but is
# not identical to the deny.toml/audit.toml ignore policy, so it is an early-
# warning surface, not a hard gate. Findings are triaged in SECURITY_TOOLING.md
# §Advisory-posture. Local run: osv-scanner --lockfile=Cargo.lock
osv-scanner:
  stage: check
  before_script: []
  script:
    - |
      if ! command -v osv-scanner >/dev/null; then
        echo "osv-scanner not installed on this runner — install:"
        echo "  go install github.com/google/osv-scanner/cmd/osv-scanner@latest"
        echo "skipping (informational)."
        exit 0
      fi
    - osv-scanner --lockfile=Cargo.lock
  allow_failure: true

# cargo-geiger — quantifies `unsafe` across the dependency tree (own code +
# transitive), so a dependency bump that pulls in new unsafe is visible in the
# diff. NON-BLOCKING: geiger's cargo-metadata pass fails to match the workspace
# path-dep `bloch-euvm@0.0.1` and emits "Failed to match" noise instead of a
# clean table (a known geiger limitation with path deps), so it is an
# early-warning surface, not a gate. First-party crates are separately held
# `unsafe`-free by the hardened-clippy + internal audit. Local: `cargo geiger`.
cargo-geiger:
  stage: check
  script:
    - cargo install cargo-geiger --locked 2>/dev/null || true
    - cargo geiger --all-features --output-format Ascii || true
  allow_failure: true

# cargo-fuzz smoke — links the fuzz harness against the REAL bloch API and runs
# each scanner-priority target for a few seconds to prove it does not fault on
# shallow input. NON-BLOCKING: a bounded smoke run is a build/link + no-shallow-
# crash check, NOT a coverage-exhausting campaign (that runs continuously in
# OSS-Fuzz — see fuzz/oss-fuzz/). Needs the nightly toolchain + cargo-fuzz +
# libFuzzer; the guard skips soft if nightly is unavailable on the runner.
# Local: `cargo +nightly fuzz run <target> -- -max_total_time=30`.
#
# GENESIS-3 SCOPE. `fuzz/Cargo.toml` depends only on `bloch`, `bloch-sis-pow`
# and `coherence-core`; there is no `bloch-pos-*` dependency and no target for
# the Genesis-4 parser or P2P surfaces in bloch-pos-node. That is a real gap in
# coverage of the live chain, and writing the harness is the work that closes
# it — not relabelling these.
#
# AND IT DOES NOT CURRENTLY RUN AT ALL. `fuzz/Cargo.toml:21` is
# `bloch = { path = ".." }`, but the repo root became a VIRTUAL manifest when
# the PoW node moved to legacy/genesis3-node, so cargo cannot resolve the
# harness: "found a virtual manifest ... instead of a package manifest"
# (reproduce with `cd fuzz && cargo metadata`). The job is allow_failure, so
# this has been failing silently. Fixing it is a one-line path change plus a
# real run — not a comment — and it is left unfixed here rather than claimed.
fuzz-smoke:
  stage: test
  before_script: []
  script:
    - |
      if ! rustup toolchain list | grep -q nightly; then
        echo "nightly toolchain not installed on this runner — skipping fuzz smoke (informational)."
        echo "install: rustup toolchain install nightly && cargo install cargo-fuzz"
        exit 0
      fi
    - cargo install cargo-fuzz --locked 2>/dev/null || true
    - |
      for t in block_parse tx_parse sha256d_pow ghostdag_order sig_verify; do
        echo "== fuzz smoke: $t =="
        cargo +nightly fuzz run "$t" -- -max_total_time=20 -runs=100000
      done
  allow_failure: true
  timeout: 30m

# Secret scanning — catch committed credentials (e.g. a leaked token) before they
# reach history. Best practice given the project's own PAT-rotation lesson.
secret-scan:
  stage: check
  before_script: []
  script:
    - |
      if ! command -v gitleaks >/dev/null; then
        echo "gitleaks not installed on this runner — skipping (informational)."
        exit 0
      fi
    - gitleaks detect --source . --no-banner --redact
  allow_failure: true

# Build + full test suite (the gate).
#
# SCOPE: this is the ROOT workspace, and since Genesis-4 became the trunk that
# workspace INCLUDES the live chain — `crates/bloch-pos-committee` and
# `crates/bloch-pos-node` are ordinary members (root `Cargo.toml:15-16`), so
# `cargo test --workspace` runs the Genesis-4 consensus suites here as well as
# the retired Genesis-3 tree at legacy/genesis3-node.
#
# That is deliberate and it is load-bearing. Both PoS crates used to carry
# their own `[workspace]` table, which made them invisible to a root
# `--workspace` run: the first command a reviewer types silently skipped the
# entire proof-of-stake consensus. The root manifest now says so in a standing
# note and forbids re-adding a private workspace. Do not "scope" this job back
# to the retired tree.
#
# `consensus-tests` above still runs the two live crates FIRST and on their
# own, so a consensus regression fails early and legibly instead of being found
# 40 minutes into a full workspace build.
build-and-test:
  stage: test
  script:
    - cargo build --all-targets
    - cargo test --workspace
  # Memory-hard (Argon2) wallet tests + a Genesis-3 testnet Module-SIS mining
  # test. Nothing on the live chain mines; that part exercises retired code.
  timeout: 60m

# GENESIS-3 SCOPE. Lean mobile-facing build of the retired chain's crate — the
# crypto/address/tx/wallet subset must compile WITHOUT the node's heavy deps
# (rocksdb/libp2p, gated by the `node` feature), so the Android/iOS
# cross-compile stays possible. `bloch` is the Genesis-3 node package at
# legacy/genesis3-node/; the Genesis-4 binary is `bloch-pos` and has no
# equivalent lean-build job.
lean-build:
  stage: test
  script:
    # `-p bloch` is required now that the repo root is a virtual manifest:
    # there is no root package for a bare `--lib` to resolve to. The package
    # is the same one, at legacy/genesis3-node/.
    - cargo build -p bloch --no-default-features --lib
    - "! cargo tree -p bloch --no-default-features -e no-dev -i rocksdb >/dev/null 2>&1 && echo 'ok: no rocksdb in lean graph'"
    - "! cargo tree -p bloch --no-default-features -e no-dev -i libp2p  >/dev/null 2>&1 && echo 'ok: no libp2p in lean graph'"
  allow_failure: true   # informational until verified on the new Linux runner

# Postern Wallet core (separate build root) — golden byte-compat + UniFFI wrapper.
mobile-core:
  stage: test
  script:
    - '[ -d mobile/core ] || { echo "mobile/core lives in bloch-protocol, not here — skipping."; exit 0; }'
    - cd mobile/core && cargo test --lib
  allow_failure: true   # informational until verified on the new Linux runner

# GENESIS-3 ARCHIVE. PoW parameter screen (pure Python, no Sage) — trivial-regime
# + feasibility for the Module-SIS lattice PoW. Nothing on the live chain does
# proof of work; this screens a retired chain's parameters and is kept as part
# of its record.
pow-screen:
  stage: check
  before_script: []
  script:
    - python3 deploy/pow-estimator/screen.py
  allow_failure: true

# GENESIS-3 ARCHIVE. PoW hardness estimate (S1) — manual, heavy: builds the
# SageMath + lattice-estimator container and prints the parameter hardness
# table. See legacy/specs/POW-HARDNESS.md + deploy/pow-estimator/.
pow-estimator:
  stage: check
  before_script: []
  script:
    - docker build -t bloch-pow-estimator -f deploy/pow-estimator/Dockerfile .
    - docker run --rm bloch-pow-estimator
  rules:
    - when: manual
  allow_failure: true
  timeout: 60m

# ── Nix stage (roadmap #2 pin-inputs, #9 determinism) ─────────────────────────
# These jobs need a Linux host with Nix + flakes enabled — NOT the macOS
# `bloch-mac` shell runner. They target a self-hosted aarch64 Linux runner
# (tag: bloch-nix-aarch64) so the node crate is repro-checked NATIVELY, without
# binfmt qemu emulation. Override the default before_script (it exports the Rust
# toolchain and runs rustc/cargo, which is irrelevant here).
#
# NOTE (permissive-license discipline): diffoscope is GPL-3.0 and Nix/CI helpers
# vary. They run only as ephemeral CI/dev tools, are never linked into or shipped
# in the image, and so do NOT touch the permissive image closure. The no-AGPL
# rule bars AGPL anywhere (even as a network service); it does not ban GPL dev
# tooling. See REPRO.md.

# flake.lock drift gate (roadmap #2 — pin all Nix inputs).
# Asserts the lock is COMMITTED and CURRENT: `nix flake lock --no-update-lock-file`
# errors if the lock would need updating, and `git diff --exit-code flake.lock`
# fails on any drift. Needs Nix (aarch64 Linux runner), so it lives in the `nix`
# stage on the same tag as `repro`.
#
# allow_failure: TRUE for now, because flake.lock is not yet committed (it is
# generated by the human on the aarch64 host via scripts/flake-lock.sh — agents do
# not run Nix). The guard step below fails SOFT with an explicit message until the
# lock lands. Once flake.lock is committed, remove the guard block AND flip
# allow_failure -> false to make drift BLOCKING.
flake-lock-drift:
  stage: nix
  tags:
    - bloch-nix-aarch64
  before_script: []
  script:
    # GUARD (remove once flake.lock is committed): keep this job green-by-design
    # until the lock exists, rather than red on a file that is not there yet.
    - |
      if [ ! -f flake.lock ]; then
        echo "flake.lock not committed yet — generate it on the aarch64 host with"
        echo "scripts/flake-lock.sh, commit it, then flip this job to BLOCKING."
        exit 1
      fi
    - nix flake lock --no-update-lock-file
    - git diff --exit-code flake.lock
  allow_failure: true   # TODO: flip to false once flake.lock is committed (remove the guard above).

# Single-host reproducibility self-check: `--rebuild --check` forces a local
# rebuild and fails if the output differs from what is already in the store
# (Nix's native determinism check). Native aarch64 = the cheapest, honest first
# measurement (bundled RocksDB 8.10 C++ is the #1 nondeterminism risk).
#
# INFORMATIONAL for now (allow_failure): a clean single-host check is necessary
# but NOT sufficient for the word "reproducible" — that is earned only by the
# two-builder bit-for-bit compare (repro-manifest.sh + repro-compare.sh across
# two independent hosts). Flip allow_failure -> false once that is green.
#
# GENESIS-3 SCOPE. Both outputs below come from ./os/package.nix, which builds
# `bloch` — the retired proof-of-work node. `bloch-pos`, the binary the live
# fleet runs, is not packaged for Nix at all (see the banner in flake.nix), so
# no reproducibility claim made by this job covers the live chain. The live
# chain's build determinism is measured by `pos-release-integrity` instead.
repro:
  stage: nix
  tags:
    - bloch-nix-aarch64
  before_script: []
  script:
    # (A) the Genesis-3 node/wallet crate — native aarch64, highest-risk, cheapest.
    - nix build .#packages.aarch64-linux.bloch --rebuild --check --keep-failed -L
    # (B) the aarch64-native sealed image — repro-checked without emulation.
    - nix build .#packages.aarch64-linux.attested-image --rebuild --check --keep-failed -L
  after_script:
    - 'command -v diffoscope >/dev/null && diffoscope /tmp/nix-build-*.check* > diffoscope.txt 2>&1 || true'
  artifacts:
    when: on_failure
    paths:
      - diffoscope.txt
  allow_failure: true
  timeout: 120m

# mainnet-guard — STILL A NO-OP. `rules: when: never` and an `echo` for a
# script, so this job has never run and gates nothing.
#
# The TODO below is stale in both directions, so state it plainly:
#
#   * The `mainnet` feature DOES now exist — `crates/bloch-crypto/Cargo.toml:42`
#     (an empty marker feature) — and so does the guard it enables,
#     `mainnet_release_guard::canonical_k_activation_height_is_set_for_mainnet`
#     (`crates/bloch-crypto/src/core/mod.rs:3155-3169`). Nobody re-enabled this
#     job when they landed, so nothing runs it in CI. Run it by hand with:
#       cargo test -p bloch-crypto --features mainnet canonical_k_activation_height_is_set_for_mainnet
#   * What it guards is a GENESIS-3 precondition (CANONICAL_K_ACTIVATION_HEIGHT
#     is not still the placeholder). It has nothing to say about Genesis-4.
#
# Both mainnets shipped without this job ever running: Genesis-3 mainnet ran to
# its halt at height 39,918, and Genesis-4 mainnet has been live under proof of
# stake since 2026-08-13. Do not read a job named `mainnet-guard` as evidence
# that a mainnet build is gated on anything.
mainnet-guard:
  stage: check
  script:
    # TODO(dev-a): replace with `cargo test --features mainnet --workspace` once
    # the `mainnet` feature + guard test exist. Keeping it a no-op until then.
    - 'echo "mainnet-guard: TODO — enable once Dev-A merges the mainnet feature guard"'
  rules:
    - when: never   # TODO: remove this rule when the mainnet feature exists
  allow_failure: true
