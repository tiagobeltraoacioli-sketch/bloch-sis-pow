# ══════════════════════════════════════════════════════════════════════════════
# RETIRED. Fly.io config for a proof-of-work `bloch` node on the Genesis-era
# TESTNET (`--testnet` below), part of the Fly fleet that exercised P2P/IBD for
# the proof-of-work system. That system's mainnet, Genesis-3, stopped
# permanently at height 39,918 on 2026-08-13, and neither it nor this testnet is
# running. The live chain is GENESIS-4, PROOF OF STAKE; it is not deployed from
# Fly or from this repository's Dockerfile — see `deploy/RELEASE-INTEGRITY.md`.
# Kept unchanged as the deployment record; do not read a `--mine` flag below as
# a description of what the network does now.
# ══════════════════════════════════════════════════════════════════════════════

# MINER node (phase 1 = sync as relay, then --mine is enabled once it reaches
# the network tip). Peers to the primary over Fly's PRIVATE 6PN address —
# same-org Fly machines can't reach the primary's PUBLIC ip (hairpin NAT), which
# is why the older followers islanded. HONESTY: Postern-operated on Fly = ONE
# operator; adding miners CONCENTRATES hashrate and does NOT decentralize.
app = "blochv-node-10"
primary_region = "gru"

[processes]
  app = "--rpc-bind 0.0.0.0 --rpc-port 16210 --listen /ip4/0.0.0.0/tcp/16110 --data-dir /bloch-data --testnet --mine --dns-seed blochv-node.internal --peer /ip4/45.32.154.137/tcp/16110 --allow-private-peers"

[mounts]
  source = "bloch_data"
  destination = "/bloch-data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
