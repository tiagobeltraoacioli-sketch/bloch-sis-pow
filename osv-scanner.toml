# osv-scanner — advisory policy for Bloch-SIS.
#
# Run: osv-scanner --config=osv-scanner.toml --lockfile=Cargo.lock
#
# This file is what makes the osv-scanner CI job BLOCKING instead of
# informational. Before it existed the job carried two escapes — a
# `command -v … || exit 0` skip and `allow_failure: true` — so the OSV findings
# below were never a verdict, and the ONE tool in this repository that sees
# GHSA-only advisories could not fail anything. The escapes are gone; the
# accepted residuals are here, named, dated and expiring, exactly the way
# deny.toml and audit.toml carry the RustSec ones.
#
# RULES (same as deny.toml):
#   * an entry needs a written rationale and an `ignoreUntil` review date;
#   * `ignoreUntil` is a RE-REVIEW deadline, not a dismissal — the advisory
#     starts failing CI again on that date, which is the point;
#   * anything NOT listed here fails the pipeline. A new advisory in a bumped
#     dependency is a red build, which is the behaviour the job was named for
#     and did not have.
#
# The authoritative disposition prose is SECURITY_TOOLING.md §Advisory posture.
#
# MEASURED 2026-09-04 on this Cargo.lock (876 packages), osv-scanner v1.9.2:
# with this file the scan reports exactly FOUR advisories — RUSTSEC-2026-0220
# (ruint), -0221 (event-listener), -0253 (lru), -0258 (h2). Those same four, and
# only those, are what `cargo audit --deny warnings` fails on today; the already
# blocking cargo-audit job is red on them right now. They are deliberately NOT
# ignored here: each has a fixed upstream release, so the fix is a dependency
# bump, not an ignore entry, and inventing a rationale to silence them is the
# exact habit this file exists to replace. Making osv-scanner blocking therefore
# adds no new failure to the pipeline — it adds a verdict on the GHSA-only
# surface that nothing else covers.

# ── OPEN, REAL, ACCEPTED: the most exposed residual on the node ──────────────
# Stream-multiplexer DoS in yamux 0.12.1. Surfaced ONLY here: cargo-audit's
# RustSec-only feed does not carry it. libp2p-yamux 0.47.0 (libp2p 0.56.0)
# resolves both yamux 0.12.1 and 0.13.10 in Cargo.lock, and the 0.12 line has no
# patched release, so there is no bump path that does not move off libp2p 0.56.
# Reachability is any connected peer over the yamux muxer — neither noise nor
# /ip4/-only peering mitigates it. Accepted-but-tracked, NOT dismissed: remove
# this entry the moment libp2p repins yamux.
[[IgnoredVulns]]
id = "GHSA-vxx9-2994-q338"
ignoreUntil = 2026-12-01
reason = "yamux 0.12.1 DoS (CVSS 8.7), pinned by libp2p-yamux 0.47.0; no upstream bump path. Tracked in SECURITY_TOOLING.md as an OPEN residual; re-review 2026-12-01."

