# ── crates/coherence-prover/{script,service} ONLY (N-3, Round 3) ─────────────
# Adding these two lockfiles to this job's --lockfile list (they were missing
# entirely — finding N-3) surfaces four advisories, all in the pinned SP1 4.2.1
# / alloy-consensus 0.14 dependency stack, all sharing ONE blocker: every fix
# version needs `serde_core`, and crates/coherence-prover/{script,service}
# pin `serde = "=1.0.219"` (comment: "serde >=1.0.221 removed
# serde::__private, breaking alloy-consensus 0.14 (sp1-sdk dep)") — serde_core
# did not exist as a crate before that serde split. Verified: `cargo update -p
# ruint --precise 1.20.0` / `-p time --precise 0.3.47` / `-p serde_with
