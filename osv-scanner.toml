# osv-scanner — advisory policy for Bloch-SIS.
#
# Run: osv-scanner --config=osv-scanner.toml --lockfile=Cargo.lock
#
# This file is what makes the osv-scanner CI job BLOCKING instead of
# informational. Before it existed the job carried two escapes — a
# `command -v … || exit 0` skip and `allow_failure: true` — so the OSV findings
# below were never a verdict, and the ONE tool in this repository that sees
# GHSA-only advisories could not fail anything. The escapes are gone; the
# accepted residuals are here, named, dated and expiring, exactly the way
# deny.toml and audit.toml carry the RustSec ones.
#
# RULES (same as deny.toml):
#   * an entry needs a written rationale and an `ignoreUntil` review date;
#   * `ignoreUntil` is a RE-REVIEW deadline, not a dismissal — the advisory
#     starts failing CI again on that date, which is the point;
#   * anything NOT listed here fails the pipeline. A new advisory in a bumped
#     dependency is a red build, which is the behaviour the job was named for
#     and did not have.
#
# The authoritative disposition prose is SECURITY_TOOLING.md §Advisory posture.
#
# MEASURED 2026-09-04 on this Cargo.lock (876 packages), osv-scanner v1.9.2:
# the scan then reported exactly FOUR advisories — RUSTSEC-2026-0220 (ruint),
# -0221 (event-listener), -0253 (lru), -0258 (h2), the same four the blocking
# cargo-audit job was red on. RESOLVED 2026-09-05 (finding SC1-advisories):
# three of the four had reachable upstream fixes and were closed by lockfile
# bumps, not ignore entries — h2 0.4.13 -> 0.4.19, ruint 1.19.0 -> 1.20.0,
# event-listener 5.4.1 -> 5.4.2 (the yanked chacha20 0.10.1 was re-pinned to
# 0.10.2 in the same pass). The lru advisory is the ONE residual: its fix
# (lru >= 0.18.2) is unreachable while sp1-prover 4.2.1 pins `lru ^0.12.4`,
# so it gets a dated, expiring exception below — mirrored in audit.toml and
# deny.toml — instead of a silent bump-less green.

# ── CLOSED 2026-09-05 (audit finding SC3-yamux-dedupe): GHSA-vxx9-2994-q338 ──
# yamux 0.12.1 (stream-multiplexer DoS, CVSS 8.7, reachable by any peer) is
# GONE from Cargo.lock: the workspace [patch.crates-io] points libp2p-yamux at
# the vendored crates/libp2p-yamux fork, which removes the 0.12 backend and
# floors yamux at 0.13.10 — the version that fixes the advisory. Worse than
# the audit knew, upstream libp2p-yamux SWITCHED the live muxer onto 0.12.1
# whenever a config setter ran, which bloch-pos-node's p2p bootstrap does.
# The former [[IgnoredVulns]] entry for it is deliberately DELETED so any
# regression (the patch dropped, a second yamux resolving) fails this scan
# again; deny.toml `[bans] multiple-versions = "deny"` and
# crates/libp2p-yamux/tests/lockfile_guard.rs guard the same invariant.

# ── OPEN, ACCEPTED: lru pop() panic-safety unsoundness, SP1-pinned ──────────
# RUSTSEC-2026-0253 (lru 0.12.5, use-after-free if a Drop/Hash impl panics
# inside LruCache::pop). Fixed upstream in lru 0.18.2, but sp1-prover 4.2.1
# pins `lru ^0.12.4` — no bump path without forking the pinned SP1 stack.
# Host-side proving only, never the node consensus/mempool/P2P runtime.
# Added 2026-09-05 (finding SC1-advisories). REMOVE when SP1 repins lru.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0253"
ignoreUntil = 2026-12-01
reason = "lru 0.12.5 unsound pop() (fix >=0.18.2) pinned by sp1-prover 4.2.1 `lru ^0.12.4`; host-side proving only. Mirrors audit.toml/deny.toml; re-review 2026-12-01."

