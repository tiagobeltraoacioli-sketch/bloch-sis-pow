<!-- Bloch Protocol favicon, 16 px. Equator simplified to one weight; the dot
     is oversized relative to the construction grid so the state survives 16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Bloch Protocol">
  <style>
    .s { stroke: #0e6e5a; } .v { stroke: #0d1b17; } .d { fill: #0e6e5a; }
    @media (prefers-color-scheme: dark) {
      .s { stroke: #4fc0a4; } .v { stroke: #eaf2ef; } .d { fill: #4fc0a4; }
    }
  </style>
  <circle class="s" cx="8" cy="8" r="6.4" fill="none" stroke-width="1.5"/>
  <ellipse class="s" cx="8" cy="8" rx="6.4" ry="2.4" fill="none" stroke-width="1.1" opacity="0.55"/>
  <line class="v" x1="8" y1="8" x2="11.8" y2="4.7" stroke-width="1.5" stroke-linecap="round"/>
  <circle class="d" cx="11.8" cy="4.7" r="1.8"/>
</svg>
