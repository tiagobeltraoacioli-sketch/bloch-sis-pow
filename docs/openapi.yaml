openapi: 3.1.0

info:
  title: Entanglement Layer (ENTL) JSON-RPC API
  version: 0.5.9
  summary: Post-quantum BlockDAG Layer 1 — JSON-RPC 2.0 interface
  description: |
    Entanglement Layer exposes a single HTTP endpoint that speaks JSON-RPC 2.0.
    Every method described below is invoked by POSTing a JSON-RPC envelope
    to the root `/` path. For example:

    ```bash
    curl -s -X POST http://node.example:16210/ \
      -H "Content-Type: application/json" \
      -d '{"jsonrpc":"2.0","method":"getblockcount","params":[],"id":1}'
    ```

    ## Transport
    - **Protocol:** HTTP/1.1 with JSON body
    - **Content-Type:** `application/json`
    - **Method:** POST to `/`
    - **Default port:** 16210
    - **Default bind:** `127.0.0.1` (localhost). Production operators use
      `--rpc-public` to bind `0.0.0.0:16210`. Unauthenticated when public —
      operators must firewall or reverse-proxy.

    ## Envelope format
    Every request is a JSON-RPC 2.0 envelope:

    ```json
    { "jsonrpc": "2.0", "method": "<method>", "params": [<args>], "id": 1 }
    ```

    Every response is a JSON-RPC 2.0 envelope:

    ```json
    { "jsonrpc": "2.0", "result": { ... }, "id": 1 }
    ```

    ## Error handling
    Entanglement Layer currently returns errors inside the `result` field rather
    than using JSON-RPC's `error` object. A response with `"error"` as a
    top-level key inside `result` indicates the method failed:

    ```json
    { "jsonrpc": "2.0", "result": { "error": "invalid hash" }, "id": 1 }
    ```

    Clients should treat `result.error` as an error condition.
    (This will be normalized to standard JSON-RPC `error` objects in a
    future release — see `SPRINTS.md`.)

    ## Method categories
    - **Chain state**: `getnetworkinfo`, `getblockcount`, `getdaginfo`,
      `getmempoolinfo`, `getpeerinfo`, `getpeers`
    - **Block queries**: `getblock`, `getblockbyheight`, `getblockhash`,
      `getrecentblocks`, `gettxsbyblock`
    - **Transaction queries**: `gettransaction`, `gettxstatus`,
      `decoderawtransaction`, `getrawmempool`
    - **Address queries**: `getbalance`, `getutxos`, `listtransactions`,
      `getaddressinfo`, `getaddressbalance_at_height`, `validateaddress`,
      `validateaddressverbose`
    - **Broadcast**: `sendrawtransaction`
    - **Fee estimation**: `estimatefee`, `estimatefeeadvanced`
    - **Analytics**: `getchainstats`, `getsupplydistribution`,
      `gethashrate`, `getdifficultyhistory`, `getblocktimepercentiles`,
      `getmempoolstats`
    - **Treasury**: `gettreasury`

    ## Security notes
    - No authentication by default (planned: Sprint M)
    - No rate limiting by default (planned: Sprint M)
    - `sendrawtransaction` is the only mutating method — all others are read-only
    - All RPC output is public chain data; no private state is returned
    - See [docs/THREAT_MODEL.md](THREAT_MODEL.md) section 4 for the RPC
      attack surface analysis

  license:
    name: MIT
    url: https://gitlab.com/Entanglementlayer/entanglement-layer/-/blob/main/LICENSE
  contact:
    name: Entanglement Layer security
    email: security@entanglementlayer.com
    url: https://gitlab.com/Entanglementlayer/entanglement-layer

servers:
  - url: http://127.0.0.1:16210
    description: Local node (default)
  - url: http://{host}:16210
    description: Remote node (operator-configured with --rpc-public)
    variables:
      host:
        default: node.example.com

security:
  - {}                # Most methods accept unauthenticated requests
  - ApiKeyHeader: []  # Writes may require X-API-Key (Sprint M config)
  - BearerToken: []   # Alternative: Authorization: Bearer <key>

tags:
  - name: Chain state
    description: High-level node, DAG, and network status
  - name: Blocks
    description: Block and block-range queries
  - name: Transactions
    description: Transaction lookup, decoding, mempool access
  - name: Addresses
    description: Balance, UTXO, and historical address queries
  - name: Broadcast
    description: Submit transactions to the network
  - name: Fees
    description: Fee estimation for new transactions
  - name: Analytics
    description: Chain metrics, hashrate, distribution, histograms
  - name: Treasury
    description: Treasury state

paths:
  /:
    post:
      summary: JSON-RPC endpoint
      description: |
        All methods are called by POSTing to this single endpoint with the
        appropriate `method` and `params` in the JSON-RPC envelope.
        The sections below describe each method individually via the
        `method` discriminator.
      operationId: rpcCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              getblockcount:
                summary: Simplest call (no params)
                value:
                  jsonrpc: "2.0"
                  method: getblockcount
                  params: []
                  id: 1
              getblock:
                summary: Block by hash (verbose)
                value:
                  jsonrpc: "2.0"
                  method: getblock
                  params: ["000000028f16c3710ba25825ad2cef2afcd30d806ca86b9e6a3d8ef0e95b2f67", true]
                  id: 1
              sendrawtransaction:
                summary: Broadcast a serialized transaction
                value:
                  jsonrpc: "2.0"
                  method: sendrawtransaction
                  params: ["0100000001..."]
                  id: 1
      responses:
        '200':
          description: JSON-RPC response (see per-method schemas below)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        '401':
          description: |
            Unauthorized (Sprint M). Returned when
            `--rpc-require-auth-for-writes` is on and the write method
            was called without a valid key, or when the presented key is
            invalid. Localhost requests never receive this.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'
        '429':
          description: |
            Rate limit exceeded (Sprint M). Retry after ~60s. Localhost
            is never rate-limited. Limits are per-IP; reads and writes
            are tracked in separate buckets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcError'

components:
  # Sprint M — security schemes for optional API key auth
  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Shared-secret API key as configured with `--rpc-api-key` or
        `--rpc-api-key-file` on the node. Only required when the node
        runs with `--rpc-require-auth-for-writes`. Localhost requests
        (127.0.0.1, ::1) bypass authentication.

    BearerToken:
      type: http
      scheme: bearer
      bearerFormat: Opaque
      description: |
        Alternative to `X-API-Key`. Send as `Authorization: Bearer <key>`.
        Same key as ApiKeyHeader.

  schemas:
    # ── Envelopes ─────────────────────────────────────────────────────
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        method:
          type: string
          enum:
            - getnetworkinfo
            - getblockcount
            - getmempoolinfo
            - getblockhash
            - getblock
            - getblockbyheight
            - getrecentblocks
            - gettransaction
            - getbalance
            - getutxos
            - sendrawtransaction
            - validateaddress
            - estimatefee
            - getrawmempool
            - decoderawtransaction
            - getdaginfo
            - listtransactions
            - getpeerinfo
            - getpeers
            - gettreasury
            - getchainstats
            - getsupplydistribution
            - gethashrate
            - getdifficultyhistory
            - getblocktimepercentiles
            - gettxstatus
            - getaddressinfo
            - estimatefeeadvanced
            - getmempoolstats
            - validateaddressverbose
            - gettxsbyblock
            - getaddressbalance_at_height
        params:
          type: array
          description: Positional parameters (method-specific)
          items: {}
        id:
          oneOf:
            - type: integer
            - type: string

    JsonRpcResponse:
      type: object
      required: [jsonrpc, result, id]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        result:
          description: Method-specific result (see per-method schemas)
        id:
          oneOf:
            - type: integer
            - type: string
            - type: "null"


    JsonRpcError:
      type: object
      description: |
        Sprint M: standard JSON-RPC error object for auth/rate-limit
        failures. Per-method internal errors still use the legacy
        `result.error` shape documented in `MethodErrorResult`.
      required: [jsonrpc, id, error]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          oneOf:
            - type: integer
            - type: string
            - type: "null"
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              description: |
                -32001 = unauthorized (HTTP 401)
                -32002 = rate limit exceeded (HTTP 429)
            message:
              type: string

    MethodErrorResult:
      type: object
      description: |
        When a method fails, the `result` field contains an `error` property.
        This is non-standard JSON-RPC; will be normalized in a future release.
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          examples:
            - "invalid hash"
            - "not found"
            - "invalid address"
            - "deserialise failed"

    # ── Domain types ──────────────────────────────────────────────────
    Hex32:
      type: string
      description: 32-byte value encoded as 64 lowercase hex characters
      pattern: "^[0-9a-f]{64}$"
      examples:
        - "000000028f16c3710ba25825ad2cef2afcd30d806ca86b9e6a3d8ef0e95b2f67"

    Hex20:
      type: string
      description: 20-byte value encoded as 40 lowercase hex characters
      pattern: "^[0-9a-f]{40}$"

    Address:
      type: string
      description: |
        Entanglement Layer address in bech32-style format.
        - Mainnet prefix: `ent1q`
        - Testnet prefix: `ent1t`
        - Followed by 40 hex chars (20-byte hash) + 8 hex chars (4-byte checksum)
      pattern: "^ent1[qt][0-9a-f]{48}$"
      examples:
        - "ent1q...placeholder...address..."

    Satoshis:
      type: integer
      format: int64
      minimum: 0
      description: Value in satoshis (1 ENTL = 10^8 satoshis)

    ENTL:
      type: number
      format: double
      description: Value in ENTL (human-readable float)

    Height:
      type: integer
      format: int64
      minimum: 0
      description: Block height (selected chain)

    # ── Block/Transaction ─────────────────────────────────────────────
    BlockSummary:
      type: object
      properties:
        hash: { $ref: '#/components/schemas/Hex32' }
        height: { $ref: '#/components/schemas/Height' }
        tx_count: { type: integer, minimum: 1 }
        timestamp:
          type: integer
          format: int64
          description: Unix epoch seconds
        size:
          type: integer
          description: Block size in bytes
        bits:
          type: integer
          description: Difficulty bits (compact target encoding)

    BlockHeader:
      type: object
      properties:
        hash: { $ref: '#/components/schemas/Hex32' }
        height: { $ref: '#/components/schemas/Height' }
        blue_score:
          type: integer
          format: int64
          description: GhostDAG blue score at this block
        tx_count: { type: integer, minimum: 1 }
        timestamp: { type: integer, format: int64 }
        bits:
          type: string
          description: Difficulty bits as hex (e.g. "0x1d00ffff")
        nonce:
          type: integer
          format: int64
        parents:
          type: array
          items: { $ref: '#/components/schemas/Hex32' }
          description: Hashes of parent blocks (BlockDAG — may be multiple)
        merkle_root: { $ref: '#/components/schemas/Hex32' }
        size: { type: integer }

    TxInput:
      type: object
      properties:
        prev_txid: { $ref: '#/components/schemas/Hex32' }
        prev_index:
          type: integer
          description: Output index in the previous transaction
        sequence:
          type: integer
          format: int64

    TxOutput:
      type: object
      properties:
        index:
          type: integer
          description: Output index within the transaction
        value: { $ref: '#/components/schemas/Satoshis' }
        entl: { $ref: '#/components/schemas/ENTL' }
        script_pubkey:
          type: string
          description: Recipient script as hex

    Transaction:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        version: { type: integer }
        coinbase:
          type: boolean
          description: True if this transaction is a coinbase
        inputs:
          type: array
          items: { $ref: '#/components/schemas/TxInput' }
        outputs:
          type: array
          items: { $ref: '#/components/schemas/TxOutput' }
        locktime:
          type: integer
          format: int64

    # ── Method-specific response schemas ──────────────────────────────
    NetworkInfo:
      type: object
      required: [network, version, protocol, blocks, peers, mempool, syncing, chain]
      properties:
        network:
          type: string
          examples: ["mainnet", "testnet"]
        version: { type: string }
        protocol:
          type: integer
          description: Consensus protocol version
        net_protocol:
          type: integer
          description: Network protocol version
        blue_score:
          type: integer
          format: int64
        blocks:
          type: integer
          format: int64
          description: Block count (selected chain height)
        peers:
          type: integer
          description: Connected peer count
        mempool:
          type: integer
          description: Mempool size (tx count)
        syncing: { type: boolean }
        chain:
          type: string
          examples: ["entl"]
        pruned_height:
          type: integer
          format: int64

    MempoolInfo:
      type: object
      properties:
        size:
          type: integer
          description: Number of transactions in mempool

    DagInfo:
      type: object
      properties:
        tip:
          oneOf:
            - { $ref: '#/components/schemas/Hex32' }
            - { type: "null" }
        tip_blue_score: { type: integer, format: int64 }
        tip_blue_work:
          type: string
          description: u128 cumulative blue work (stringified)
        tip_height: { type: integer, format: int64 }
        block_count: { type: integer, format: int64 }
        tip_count:
          type: integer
          description: Number of DAG tips (virtual block parents)
        tips:
          type: array
          items: { $ref: '#/components/schemas/Hex32' }
        chain_length: { type: integer }
        k:
          type: integer
          description: GhostDAG anticone parameter (10)

    PeerInfo:
      type: object
      properties:
        peer_count: { type: integer }
        syncing: { type: boolean }

    Peer:
      type: object
      properties:
        address:
          type: string
          description: Full libp2p multiaddr
          examples: ["/ip4/1.2.3.4/tcp/16110/p2p/12D3KooW..."]
        ip:
          type: string
          format: ipv4
        peer_id:
          type: string
          description: libp2p PeerId (base58)

    PeersList:
      type: object
      properties:
        peer_count: { type: integer }
        peers:
          type: array
          items: { $ref: '#/components/schemas/Peer' }

    Block:
      allOf:
        - $ref: '#/components/schemas/BlockHeader'
        - type: object
          properties:
            txids:
              type: array
              items: { $ref: '#/components/schemas/Hex32' }
              description: Present when verbose=false
            transactions:
              type: array
              items: { $ref: '#/components/schemas/Transaction' }
              description: Present when verbose=true

    TransactionLookup:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        block_hash: { $ref: '#/components/schemas/Hex32' }
        block_height: { $ref: '#/components/schemas/Height' }
        timestamp: { type: integer, format: int64 }
        confirmations: { type: integer, format: int64 }
        transaction: { $ref: '#/components/schemas/Transaction' }

    Balance:
      type: object
      properties:
        satoshis: { $ref: '#/components/schemas/Satoshis' }
        entl: { $ref: '#/components/schemas/ENTL' }
        utxo_count: { type: integer }
        address: { $ref: '#/components/schemas/Address' }

    Utxo:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        index: { type: integer }
        value: { $ref: '#/components/schemas/Satoshis' }
        script_pubkey: { type: string, description: Hex-encoded script }

    UtxoList:
      type: object
      properties:
        address: { $ref: '#/components/schemas/Address' }
        utxo_count: { type: integer }
        satoshis: { $ref: '#/components/schemas/Satoshis' }
        entl: { $ref: '#/components/schemas/ENTL' }
        utxos:
          type: array
          items: { $ref: '#/components/schemas/Utxo' }

    BroadcastResult:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }

    AddressValidation:
      type: object
      properties:
        address: { type: string }
        isvalid: { type: boolean }
        network:
          type: string
          enum: [mainnet, testnet, unknown]
        checksum:
          type: boolean
          description: Whether the checksum bytes verified correctly

    AddressValidationVerbose:
      type: object
      properties:
        valid: { type: boolean }
        address: { type: string }
        network:
          type: string
          enum: [mainnet, testnet]
        hash_hex: { $ref: '#/components/schemas/Hex20' }
        prefix:
          type: string
          examples: ["ent1q", "ent1t"]
        reason:
          type: string
          description: Present only when valid=false

    FeeEstimate:
      type: object
      properties:
        feerate_sats: { type: integer, format: int64 }
        feerate_entl: { type: number, format: double }
        mempool_size: { type: integer }
        note: { type: string }

    FeeEstimateAdvanced:
      type: object
      properties:
        next_block_sats: { type: integer, format: int64 }
        medium_priority: { type: integer, format: int64 }
        slow_priority: { type: integer, format: int64 }
        mempool_median: { type: integer, format: int64 }
        mempool_size: { type: integer }
        recommended_entl: { type: string }

    MempoolEntry:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        fee: { type: integer, format: int64 }
        fee_entl: { type: number, format: double }
        time:
          type: integer
          format: int64
          description: Unix epoch when the tx was added to mempool

    RawMempool:
      oneOf:
        - type: object
          required: [size, txids]
          properties:
            size: { type: integer }
            txids:
              type: array
              items: { $ref: '#/components/schemas/Hex32' }
        - type: object
          required: [size, transactions]
          properties:
            size: { type: integer }
            transactions:
              type: array
              items: { $ref: '#/components/schemas/MempoolEntry' }

    AddressHistoryEntry:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        block_height: { $ref: '#/components/schemas/Height' }
        timestamp: { type: integer, format: int64 }
        confirmations: { type: integer, format: int64 }
        direction:
          type: string
          enum: [incoming, outgoing, self]
        amount_sats: { $ref: '#/components/schemas/Satoshis' }
        amount_entl: { $ref: '#/components/schemas/ENTL' }

    ListTransactionsResult:
      type: object
      properties:
        address: { $ref: '#/components/schemas/Address' }
        count: { type: integer }
        total_available: { type: integer }
        start_height: { type: integer, format: int64 }
        end_height: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/AddressHistoryEntry' }

    AddressInfo:
      type: object
      properties:
        address: { $ref: '#/components/schemas/Address' }
        balance_sats: { $ref: '#/components/schemas/Satoshis' }
        balance_entl: { $ref: '#/components/schemas/ENTL' }
        utxo_count: { type: integer }
        pending_incoming: { $ref: '#/components/schemas/Satoshis' }
        pending_outgoing: { $ref: '#/components/schemas/Satoshis' }
        is_treasury: { type: boolean }

    Treasury:
      type: object
      properties:
        address: { $ref: '#/components/schemas/Hex20' }
        entl_address: { $ref: '#/components/schemas/Address' }
        balance: { $ref: '#/components/schemas/Satoshis' }
        entl: { $ref: '#/components/schemas/ENTL' }
        utxo_count: { type: integer }
        tax_percent: { type: integer, description: Fraction of block reward to treasury }
        reward_per_block: { type: integer, format: int64 }
        entl_per_block: { type: number, format: double }
        entl_per_day: { type: number, format: double }

    ChainStats:
      type: object
      properties:
        total_blocks: { type: integer, format: int64 }
        total_txs: { type: integer, format: int64 }
        avg_txs_per_block: { type: number, format: double }
        blocks_last_24h: { type: integer }
        txs_last_24h: { type: integer }
        avg_block_time_secs: { type: number, format: double }
        current_difficulty: { type: integer, format: int64 }
        hashrate_hs:
          type: number
          format: double
          description: Estimated hashrate in hashes per second
        hashrate_human:
          type: string
          examples: ["2.26 KH/s", "1.05 MH/s"]

    HashrateInfo:
      type: object
      properties:
        hashrate_hs: { type: number, format: double }
        hashrate_human: { type: string }
        avg_block_time_secs: { type: number, format: double }
        current_difficulty: { type: integer, format: int64 }

    SupplyTier:
      type: object
      properties:
        label:
          type: string
          examples: ["< 1 ENTL", "1-10 ENTL", "10-100 ENTL"]
        address_count: { type: integer }
        total_sats: { $ref: '#/components/schemas/Satoshis' }
        total_entl: { $ref: '#/components/schemas/ENTL' }
        pct_of_supply: { type: number, format: double }

    SupplyDistribution:
      type: object
      properties:
        tiers:
          type: array
          items: { $ref: '#/components/schemas/SupplyTier' }
        total_addresses: { type: integer }
        total_sats: { $ref: '#/components/schemas/Satoshis' }
        total_entl: { $ref: '#/components/schemas/ENTL' }

    DifficultyPoint:
      type: object
      properties:
        height: { $ref: '#/components/schemas/Height' }
        bits: { type: integer, format: int64 }
        bits_hex:
          type: string
          examples: ["0x1d00ffff"]
        timestamp: { type: integer, format: int64 }
        target_hex: { type: string }

    DifficultyHistory:
      type: object
      properties:
        count: { type: integer }
        points:
          type: array
          items: { $ref: '#/components/schemas/DifficultyPoint' }

    BlockTimePercentiles:
      type: object
      properties:
        sample_size: { type: integer }
        window: { type: integer }
        min_secs: { type: number, format: double }
        p50_secs: { type: number, format: double }
        p90_secs: { type: number, format: double }
        p99_secs: { type: number, format: double }
        max_secs: { type: number, format: double }
        avg_secs: { type: number, format: double }
        target_secs:
          type: integer
          description: Target block time constant (10s)

    TxStatus:
      type: object
      properties:
        status:
          type: string
          enum: [unknown, pending, confirmed, final]
          description: |
            - `unknown`: tx not found
            - `pending`: in mempool
            - `confirmed`: in a block, < 100 confirmations
            - `final`: >= 100 confirmations (coinbase-maturity depth)
        in_mempool: { type: boolean }
        confirmations: { type: integer, format: int64 }
        block_height:
          type: integer
          format: int64
          description: Present when status != unknown
        txid: { $ref: '#/components/schemas/Hex32' }

    MempoolBucket:
      type: object
      properties:
        range:
          type: string
          description: Fee-rate bucket label
          examples: ["0-10 sat/byte"]
        tx_count: { type: integer }

    MempoolStats:
      type: object
      properties:
        size: { type: integer }
        total_fees: { type: integer, format: int64 }
        min_fee: { type: integer, format: int64 }
        max_fee: { type: integer, format: int64 }
        median_fee: { type: integer, format: int64 }
        avg_fee: { type: number, format: double }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/MempoolBucket' }

    TxInBlock:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        size_bytes: { type: integer }
        inputs_count: { type: integer }
        outputs_count: { type: integer }
        fee_sats: { type: integer, format: int64 }
        is_coinbase: { type: boolean }

    TxsByBlock:
      type: object
      properties:
        block_hash: { $ref: '#/components/schemas/Hex32' }
        block_height: { $ref: '#/components/schemas/Height' }
        block_timestamp: { type: integer, format: int64 }
        count: { type: integer }
        txs:
          type: array
          items: { $ref: '#/components/schemas/TxInBlock' }

    AddressBalanceAtHeight:
      type: object
      properties:
        address: { $ref: '#/components/schemas/Address' }
        height: { $ref: '#/components/schemas/Height' }
        balance_sats: { $ref: '#/components/schemas/Satoshis' }
        balance_entl: { $ref: '#/components/schemas/ENTL' }
        tx_count_up_to_height: { type: integer }

# ════════════════════════════════════════════════════════════════════
#
#   METHOD CATALOG
#
#   Each RPC method is documented below as a discrete section keyed by
#   `x-entl-method`. Generators that understand JSON-RPC over HTTP
#   (e.g. openapi-rpc-generator) can use these for codegen. Readers use
#   them for reference.
#
# ════════════════════════════════════════════════════════════════════

x-entl-methods:

  # ── Chain state ─────────────────────────────────────────────────────
  getnetworkinfo:
    tags: [Chain state]
    summary: Overall node / network status
    description: Returns version, peer count, sync status, chain metadata.
    params: []
    result: { $ref: '#/components/schemas/NetworkInfo' }
    example_result:
      network: mainnet
      version: "0.5.9"
      protocol: 1
      net_protocol: 1
      blue_score: 9
      blocks: 9
      peers: 19
      mempool: 0
      syncing: false
      chain: entl
      pruned_height: 0

  getblockcount:
    tags: [Chain state]
    summary: Height of the selected chain tip
    params: []
    result:
      type: integer
      format: int64
    example_result: 9

  getmempoolinfo:
    tags: [Chain state]
    summary: Current mempool size
    params: []
    result: { $ref: '#/components/schemas/MempoolInfo' }
    example_result: { size: 0 }

  getdaginfo:
    tags: [Chain state]
    summary: DAG structure (tips, blue score, GhostDAG parameters)
    params: []
    result: { $ref: '#/components/schemas/DagInfo' }

  getpeerinfo:
    tags: [Chain state]
    summary: Compact peer count + sync status
    params: []
    result: { $ref: '#/components/schemas/PeerInfo' }

  getpeers:
    tags: [Chain state]
    summary: Full list of known peers with IP and PeerId
    description: |
      **Known issue (v0.5.9):** includes stale peers that failed to
      complete the Kyber handshake. `peer_count` may overstate the
      number of peers in the transaction gossip mesh. Fix tracked in
      SPRINTS.md.
    params: []
    result: { $ref: '#/components/schemas/PeersList' }

  # ── Block queries ───────────────────────────────────────────────────
  getblockhash:
    tags: [Blocks]
    summary: Get block hash at a given height
    params:
      - name: height
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Height' }
    result:
      oneOf:
        - $ref: '#/components/schemas/Hex32'
        - $ref: '#/components/schemas/MethodErrorResult'

  getblock:
    tags: [Blocks]
    summary: Full block by hash
    params:
      - name: hash
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Hex32' }
      - name: verbose
        in: params
        required: false
        schema:
          type: boolean
          default: false
          description: If true, transactions are fully expanded
    result: { $ref: '#/components/schemas/Block' }

  getblockbyheight:
    tags: [Blocks]
    summary: Full block by height
    params:
      - name: height
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Height' }
      - name: verbose
        in: params
        required: false
        schema:
          type: boolean
          default: false
    result: { $ref: '#/components/schemas/Block' }

  getrecentblocks:
    tags: [Blocks]
    summary: Most recent blocks (newest first)
    params:
      - name: count
        in: params
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
    result:
      type: array
      items: { $ref: '#/components/schemas/BlockSummary' }

  gettxsbyblock:
    tags: [Blocks]
    summary: List transactions in a given block (with size and fees)
    description: |
      Accepts either a 64-hex block hash or a numeric height.
      Returns per-transaction size, input/output counts, fee, coinbase flag.
    params:
      - name: block_identifier
        in: params
        required: true
        schema:
          oneOf:
            - $ref: '#/components/schemas/Hex32'
            - type: integer
              format: int64
    result: { $ref: '#/components/schemas/TxsByBlock' }

  # ── Transaction queries ─────────────────────────────────────────────
  gettransaction:
    tags: [Transactions]
    summary: Look up a transaction by txid (O(1) via tx index)
    params:
      - name: txid
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Hex32' }
    result: { $ref: '#/components/schemas/TransactionLookup' }

  gettxstatus:
    tags: [Transactions]
    summary: Lightweight status for a transaction (mempool vs confirmed vs final)
    params:
      - name: txid
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Hex32' }
    result: { $ref: '#/components/schemas/TxStatus' }

  decoderawtransaction:
    tags: [Transactions]
    summary: Decode a hex-encoded bincode-serialized transaction
    params:
      - name: hex_tx
        in: params
        required: true
        schema:
          type: string
          description: Hex of the bincode-serialized Transaction
    result: { $ref: '#/components/schemas/Transaction' }

  getrawmempool:
    tags: [Transactions]
    summary: Transactions currently in the mempool
    params:
      - name: verbose
        in: params
        required: false
        schema:
          type: boolean
          default: false
    result: { $ref: '#/components/schemas/RawMempool' }

  # ── Address queries ─────────────────────────────────────────────────
  getbalance:
    tags: [Addresses]
    summary: Confirmed balance and UTXO count for an address
    params:
      - name: address
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Address' }
    result: { $ref: '#/components/schemas/Balance' }

  getutxos:
    tags: [Addresses]
    summary: All unspent outputs for an address (wallet input selection)
    params:
      - name: address
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Address' }
    result: { $ref: '#/components/schemas/UtxoList' }

  listtransactions:
    tags: [Addresses]
    summary: Paginated tx history for an address
    description: |
      Returns incoming/outgoing transactions that touch the address,
      ordered by height. Requires the address-history indexer (Sprint F).
      **Known limitation:** the indexer does not currently roll back on
      reorgs; rare in practice given GhostDAG's shallow reorgs but worth
      knowing for auditors.
    params:
      - name: address
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Address' }
      - name: limit
        in: params
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 1000
      - name: start_height
        in: params
        required: false
        schema: { type: integer, format: int64, default: 0 }
      - name: end_height
        in: params
        required: false
        schema: { type: integer, format: int64 }
      - name: offset
        in: params
        required: false
        schema: { type: integer, default: 0 }
    result: { $ref: '#/components/schemas/ListTransactionsResult' }

  getaddressinfo:
    tags: [Addresses]
    summary: Full snapshot of an address (balance, pending, flags)
    params:
      - name: address
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Address' }
    result: { $ref: '#/components/schemas/AddressInfo' }

  getaddressbalance_at_height:
    tags: [Addresses]
    summary: Historical balance of an address at a given height
    description: |
      Useful for snapshots, airdrops, taxation queries. Computes the
      balance deterministically by replaying the address history up to
      the given height.
    params:
      - name: address
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Address' }
      - name: height
        in: params
        required: true
        schema: { $ref: '#/components/schemas/Height' }
    result: { $ref: '#/components/schemas/AddressBalanceAtHeight' }

  validateaddress:
    tags: [Addresses]
    summary: Basic address validation (format + checksum)
    params:
      - name: address
        in: params
        required: true
        schema: { type: string }
    result: { $ref: '#/components/schemas/AddressValidation' }

  validateaddressverbose:
    tags: [Addresses]
    summary: Address validation with parsed hash and network
    params:
      - name: address
        in: params
        required: true
        schema: { type: string }
    result: { $ref: '#/components/schemas/AddressValidationVerbose' }

  # ── Broadcast ───────────────────────────────────────────────────────
  sendrawtransaction:
    tags: [Broadcast]
    summary: Submit a signed, bincode-serialized transaction to the mempool
    x-auth-required: conditional
    x-auth-note: |
      Sprint M: nodes running with `--rpc-require-auth-for-writes`
      return 401 for unauthenticated calls to this method (except from
      localhost). All other methods are read-only and do not require
      auth. Per-IP rate limit: 5 writes/min by default.
    description: |
      The only mutating RPC method. The transaction is deserialized,
      validated for mempool acceptance, and (if valid) gossipped to
      peers via libp2p gossipsub.

      **Validation checks (mempool acceptance, not full consensus):**
      - Not a coinbase
      - Inputs reference existing UTXOs
      - ML-DSA-65 signatures verify for every input
      - No intra-mempool double-spend
      - Fee >= min relay fee
      - Size <= 400 KB

      **Known divergence:** mempool validation is stricter than block
      validation in some edge cases. See SPRINTS.md → Sprint N-full.

      Production security note: this endpoint has no auth or rate
      limiting by default. Operators running with `--rpc-public` should
      reverse-proxy.
    params:
      - name: hex_tx
        in: params
        required: true
        schema:
          type: string
          description: Hex of the bincode-serialized Transaction
    result:
      oneOf:
        - $ref: '#/components/schemas/BroadcastResult'
        - $ref: '#/components/schemas/MethodErrorResult'
    errors:
      - "invalid hex"
      - "deserialise failed"
      - "coinbase not accepted"
      - "signature invalid"
      - "double-spend in mempool"
      - "fee below minimum"
      - "tx too large"

  # ── Fee estimation ──────────────────────────────────────────────────
  estimatefee:
    tags: [Fees]
    summary: Simple fee estimate (median of mempool)
    params: []
    result: { $ref: '#/components/schemas/FeeEstimate' }

  estimatefeeadvanced:
    tags: [Fees]
    summary: Priority-tiered fee estimates (next-block / medium / slow)
    params: []
    result: { $ref: '#/components/schemas/FeeEstimateAdvanced' }

  # ── Analytics ───────────────────────────────────────────────────────
  getchainstats:
    tags: [Analytics]
    summary: Aggregate chain metrics (blocks, txs, hashrate, etc.)
    description: |
      **Known issue (v0.5.9):** `avg_block_time_secs` can return
      spurious large values when blocks have out-of-order timestamps
      in the DAG. Uses height ordering rather than selected-chain
      ordering. Fix tracked in SPRINTS.md.
    params: []
    result: { $ref: '#/components/schemas/ChainStats' }

  gethashrate:
    tags: [Analytics]
    summary: Estimated network hashrate
    params: []
    result: { $ref: '#/components/schemas/HashrateInfo' }

  getsupplydistribution:
    tags: [Analytics]
    summary: Supply breakdown by address tier (for Gini / concentration)
    params: []
    result: { $ref: '#/components/schemas/SupplyDistribution' }

  getdifficultyhistory:
    tags: [Analytics]
    summary: Historical difficulty points at each retarget
    params:
      - name: limit
        in: params
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
    result: { $ref: '#/components/schemas/DifficultyHistory' }

  getblocktimepercentiles:
    tags: [Analytics]
    summary: Percentiles of block times over a recent window
    params:
      - name: window
        in: params
        required: false
        schema:
          type: integer
          default: 100
          minimum: 10
          maximum: 1000
    result: { $ref: '#/components/schemas/BlockTimePercentiles' }

  getmempoolstats:
    tags: [Analytics]
    summary: Fee-rate distribution and stats for the current mempool
    params: []
    result: { $ref: '#/components/schemas/MempoolStats' }

  # ── Treasury ────────────────────────────────────────────────────────
  gettreasury:
    tags: [Treasury]
    summary: Treasury balance + tax schedule
    description: |
      The treasury address is deterministic (derived at genesis) and
      receives `TREASURY_PERCENT` (2%) of each block's coinbase reward in
      addition to the miner's share.
    params: []
    result: { $ref: '#/components/schemas/Treasury' }
