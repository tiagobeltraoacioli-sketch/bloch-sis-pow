openapi: 3.1.0

info:
  title: Bloch (Bloch-SIS) JSON-RPC API
  version: 0.6.0
  summary: Post-quantum-flavoured BlockDAG Layer 1 — JSON-RPC 2.0 interface
  description: |
    Bloch exposes a single HTTP endpoint that speaks JSON-RPC 2.0. Every method
    described below is invoked by POSTing a JSON-RPC 2.0 envelope to the root
    `/` path. The node advertises itself as `chain: "bloch-sis"`, uses
    `bloch1q…` (mainnet) / `bloch1t…` (testnet) addresses, and reports monetary
    values both as integer satoshis and as display-only `bloch` / `*_bloch`
    floats (1 BLCH = 100 000 000 satoshis).

    ```bash
    curl -s -X POST http://127.0.0.1:16210/ \
      -H "Content-Type: application/json" \
      -d '{"jsonrpc":"2.0","method":"getblockcount","params":[],"id":1}'
    ```

    ## HONESTY / SECURITY DISCLOSURES (read before you rely on this)
    - **Unaudited mainnet-beta.** This software has NOT completed an external
      security audit. Run it expecting bugs and consensus surprises.
    - **PoW is structurally weak.** The Module-SIS proof-of-work runs at a small
      structural width (k = 4 below the SF-1 activation height). At k = 4 the
      witness is **trivially forgeable** and the chain is **51%-attackable** —
      the difficulty gate is not lattice bit-security. Do not treat confirmations
      as economically final.
    - **Ownerless base.** The base protocol is ownerless; there is no admin key
      that can reverse transactions or freeze funds. Nothing here is a promise of
      support, uptime, or recovery.
    - **BLCH is not a security.** BLCH is a utility/experimental network token,
      not an investment contract, share, or claim on anyone's revenue. No yield,
      dividend, or profit expectation is offered or implied.
    - This is the community edition of the node software. It is not, and must not
      be described as, any branded/commercial distribution.

    ## Transport
    - **Protocol:** HTTP/1.1 with a JSON body.
    - **Content-Type:** `application/json`.
    - **HTTP method / path:** `POST /` (the ONLY route; there are no REST paths).
    - **Default port:** 16210.
    - **Default bind:** `127.0.0.1` (localhost). Operators exposing the node
      publicly must firewall or reverse-proxy it — reads are unauthenticated.
    - **Max request body:** 1 MiB (`RPC_MAX_BODY_BYTES`). Oversized bodies get
      HTTP 413. JSON-RPC calls are tiny; this simply blocks payload-abuse DoS.
    - **Per-request timeout:** 30 s (HTTP 408 on expiry).
    - **Global concurrency cap:** 256 in-flight handlers across all connections.
    - **CORS:** permissive (any origin) on this endpoint.

    ## JSON-RPC 2.0 envelope
    Request:

    ```json
    { "jsonrpc": "2.0", "method": "<method>", "params": [<args>], "id": 1 }
    ```

    Success response:

    ```json
    { "jsonrpc": "2.0", "result": { ... }, "id": 1 }
    ```

    `params` is a positional array. `id` is echoed back verbatim (defaults to
    `null` if omitted).

    ## Error handling — TWO shapes (important quirk)
    Bloch reports failures in **two different places**, and clients must handle
    both:

    1. **Standard top-level `error`** — used ONLY by the transport/auth layer:
       unauthorized (`code: -32001`, HTTP 401), rate-limited (`code: -32002`,
       HTTP 429). Example:

       ```json
       { "jsonrpc": "2.0", "id": 1,
         "error": { "code": -32001, "message": "unauthorized: valid X-API-Key required" } }
       ```

    2. **NON-STANDARD `result.error`** — used by MOST method-level failures. The
       HTTP status is still 200 and the top-level `error` is absent; the failure
       is a string under `result.error`:

       ```json
       { "jsonrpc": "2.0", "id": 1, "result": { "error": "invalid hash" } }
       ```

       Unknown methods, bad params, not-found lookups, deserialise failures, etc.
       all surface this way. Treat any `result` object containing a string
       `error` key as a failed call. (A future release may normalise this to the
       standard `error` object.)

    ## Authentication & rate limiting
    - **Reads are public.** Every method except the writes below is a read and
      needs no key by default.
    - **Writes** are `sendrawtransaction` and `submitblock`. When the node runs
      with `require_auth_for_writes` enabled, a write from a non-local IP must
      present a valid API key.
    - **API key** is presented via the `X-API-Key` header or
      `Authorization: Bearer <key>`. Comparison is constant-time.
    - **Localhost bypass.** Loopback (`127.0.0.1` / `::1`) bypasses auth AND rate
      limiting entirely. With `trust_private_ranges` enabled, RFC1918 / IPv6-ULA
      source IPs are also treated as trusted-local (for Docker bridge setups);
      link-local and CGNAT never are.
    - **Per-IP rate limits** (separate read / write buckets; localhost exempt).
      Defaults: 60 reads/min, 5 writes/min. Exceeding a bucket → HTTP 429 with
      `error.code -32002`.

    ## Method categories (see `x-json-rpc-methods` for the full per-method contract)
    - **Chain state:** getnetworkinfo, getblockcount, getmempoolinfo, getdaginfo,
      getpeerinfo, getpeers, getchainstats, gethashrate, getsupplydistribution,
      getdifficultyhistory, getblocktimepercentiles, getpools, getattestation
    - **Blocks:** getblockhash, getblock, getblockbyheight, getrecentblocks,
      gettxsbyblock
    - **Transactions:** gettransaction, gettxstatus, decoderawtransaction,
      getrawmempool, getmempoolstats
    - **Addresses / wallet:** getbalance, getutxos, getaddressinfo,
      getaddressbalance_at_height, getaddresscount, listtransactions,
      validateaddress, validateaddressverbose
    - **Fees:** estimatefee, estimatefeeadvanced
    - **Writes:** sendrawtransaction
    - **Mining (B5f pool seam):** getblocktemplate, submitblock

  license:
    name: MIT OR Apache-2.0
  contact:
    name: Bloch community contributors

servers:
  - url: http://127.0.0.1:16210
    description: Default local node (loopback; bypasses auth + rate limits)
  - url: http://{host}:{port}
    description: Custom node endpoint
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "16210"

tags:
  - name: JSON-RPC
    description: The single POST / endpoint carrying all methods.

paths:
  /:
    post:
      tags: [JSON-RPC]
      operationId: jsonRpcCall
      summary: JSON-RPC 2.0 endpoint (all methods)
      description: |
        The single route for the entire API. The `method` field selects the
        operation; `params` is a positional array whose contents depend on the
        method. See the `x-json-rpc-methods` extension on this document (and the
        `components.schemas` result types) for each method's parameters and
        response shape.

        Remember the two error shapes: transport/auth errors use the top-level
        `error` object (401/429); most method errors return HTTP 200 with a
        string under `result.error`.
      security:
        - {}                # reads: no auth
        - ApiKeyAuth: []    # writes when require_auth_for_writes is on
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              getblockcount:
                summary: Read the current block count
                value: { jsonrpc: "2.0", method: "getblockcount", params: [], id: 1 }
              getbalance:
                summary: Balance of an address
                value: { jsonrpc: "2.0", method: "getbalance", params: ["bloch1q…"], id: 2 }
              getblock:
                summary: Block by hash, verbose
                value: { jsonrpc: "2.0", method: "getblock", params: ["<hash-hex>", true], id: 3 }
              sendrawtransaction:
                summary: Broadcast a signed tx (write)
                value: { jsonrpc: "2.0", method: "sendrawtransaction", params: ["<tx-hex>"], id: 4 }
      responses:
        '200':
          description: |
            JSON-RPC response. `result` is present on success. A method-level
            failure is ALSO HTTP 200 but carries a string `result.error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
              examples:
                success:
                  value: { jsonrpc: "2.0", id: 1, result: 12345 }
                methodError:
                  summary: Non-standard result.error quirk
                  value: { jsonrpc: "2.0", id: 1, result: { error: "invalid hash" } }
        '401':
          description: Unauthorized — write requires a valid X-API-Key (code -32001).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcErrorResponse'
              example:
                jsonrpc: "2.0"
                id: 1
                error: { code: -32001, message: "unauthorized: valid X-API-Key required" }
        '408':
          description: Request timed out (exceeded the 30 s per-request limit).
        '413':
          description: Payload too large (body exceeded the 1 MiB cap).
        '429':
          description: Too many requests — per-IP rate limit exceeded (code -32002).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcErrorResponse'
              example:
                jsonrpc: "2.0"
                id: 1
                error: { code: -32002, message: "rate limit exceeded; retry after a minute" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Shared secret for write methods when require_auth_for_writes is enabled. Localhost is exempt.
    BearerAuth:
      type: http
      scheme: bearer
      description: "Alternative to X-API-Key — `Authorization: Bearer <key>`."

  schemas:

    # ── JSON-RPC envelopes ────────────────────────────────────────────────
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        method:
          type: string
          description: One of the supported methods (see x-json-rpc-methods).
          enum:
            - getnetworkinfo
            - getblockcount
            - getmempoolinfo
            - getblockhash
            - getblock
            - getblockbyheight
            - getrecentblocks
            - gettransaction
            - getbalance
            - getaddresscount
            - getutxos
            - sendrawtransaction
            - validateaddress
            - validateaddressverbose
            - estimatefee
            - estimatefeeadvanced
            - getrawmempool
            - getmempoolstats
            - decoderawtransaction
            - getblocktemplate
            - submitblock
            - getdaginfo
            - listtransactions
            - getpeerinfo
            - getpeers
            - getpools
            - getchainstats
            - getsupplydistribution
            - gethashrate
            - getdifficultyhistory
            - getblocktimepercentiles
            - gettxstatus
            - getaddressinfo
            - getaddressbalance_at_height
            - gettxsbyblock
            - getattestation
        params:
          type: array
          description: Positional arguments; contents depend on the method. Omit or use [] for none.
          items: {}
          default: []
        id:
          description: Echoed back verbatim; defaults to null if omitted.
          oneOf:
            - type: integer
            - type: string
            - type: "null"
      example:
        jsonrpc: "2.0"
        method: getblockcount
        params: []
        id: 1

    JsonRpcResponse:
      type: object
      required: [jsonrpc, id, result]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: integer
            - type: string
            - type: "null"
        result:
          description: |
            Method-specific result. On a method-level failure this is instead an
            object of the form `{ "error": "<message>" }` (the non-standard
            quirk) — see ResultError.
      description: Success (or method-level-error) envelope. HTTP status is 200 either way.

    JsonRpcErrorResponse:
      type: object
      required: [jsonrpc, id, error]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: integer
            - type: string
            - type: "null"
        error:
          $ref: '#/components/schemas/JsonRpcError'
      description: Transport/auth error envelope (used ONLY for 401/429).

    JsonRpcError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: "-32001 = unauthorized; -32002 = rate limited."
        message:
          type: string
        data:
          description: Optional extra detail.
      example: { code: -32001, message: "unauthorized: valid X-API-Key required" }

    ResultError:
      type: object
      description: |
        Non-standard method-level error. Delivered inside `result` with HTTP 200
        (NOT via the top-level `error` object). Any `result` carrying a string
        `error` key is a failed call.
      required: [error]
      properties:
        error:
          type: string
          example: "invalid address"

    # ── Shared domain types ───────────────────────────────────────────────
    Hex32:
      type: string
      description: 32-byte value as 64 lowercase hex chars.
      pattern: '^[0-9a-f]{64}$'
    Hex20:
      type: string
      description: 20-byte value as 40 lowercase hex chars.
      pattern: '^[0-9a-f]{40}$'
    Address:
      type: string
      description: Bloch address — `bloch1q…` (mainnet) or `bloch1t…` (testnet), checksummed.
      example: "bloch1q…"
    Satoshis:
      type: integer
      format: int64
      minimum: 0
      description: Integer value in satoshis (1 BLCH = 100_000_000 sat). The authoritative amount.

    TxInput:
      type: object
      properties:
        prev_txid: { $ref: '#/components/schemas/Hex32' }
        prev_index: { type: integer }
        sequence: { type: integer }

    TxOutput:
      type: object
      properties:
        index: { type: integer }
        value: { $ref: '#/components/schemas/Satoshis' }
        bloch: { type: number, description: Display-only float value in BLCH. }
        script_pubkey: { type: string, description: Hex-encoded script pubkey (20-byte pubkey hash). }

    Transaction:
      type: object
      description: Decoded transaction (format_tx). decoderawtransaction adds `size`.
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        version: { type: integer }
        coinbase: { type: boolean }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/TxInput' }
        outputs:
          type: array
          items: { $ref: '#/components/schemas/TxOutput' }
        locktime: { type: integer }
        size:
          type: integer
          description: Present only in decoderawtransaction (byte length of the input hex).

    # ── getnetworkinfo ────────────────────────────────────────────────────
    NetworkInfo:
      type: object
      properties:
        network: { type: string, example: mainnet }
        version: { type: string }
        protocol: { type: integer, description: Consensus protocol version. }
        net_protocol: { type: integer, description: P2P network protocol version. }
        blue_score: { type: integer }
        blocks: { type: integer }
        peers: { type: integer }
        mempool: { type: integer }
        syncing: { type: boolean }
        chain: { type: string, const: "bloch-sis" }
        pruned_height: { type: integer, description: Lowest retained height (0 if unpruned). }

    MempoolInfo:
      type: object
      properties:
        size: { type: integer }

    DagInfo:
      type: object
      properties:
        tip:
          oneOf:
            - $ref: '#/components/schemas/Hex32'
            - type: "null"
        tip_blue_score: { type: integer }
        tip_blue_work: { type: string, description: Big integer as a decimal string. }
        tip_height: { type: integer }
        block_count: { type: integer }
        tip_count: { type: integer }
        tips:
          type: array
          items: { $ref: '#/components/schemas/Hex32' }
        chain_length: { type: integer }
        k: { type: integer, description: 'GhostDAG k parameter (a small value today — see honesty note).' }

    PeerInfo:
      type: object
      properties:
        peer_count: { type: integer }
        syncing: { type: boolean }

    Peer:
      type: object
      properties:
        address: { type: string, description: Full multiaddr. }
        ip: { type: string }
        peer_id: { type: string }

    PeersList:
      type: object
      properties:
        peer_count: { type: integer }
        peers:
          type: array
          items: { $ref: '#/components/schemas/Peer' }

    BlockSummary:
      type: object
      description: getrecentblocks list item.
      properties:
        hash: { $ref: '#/components/schemas/Hex32' }
        height: { type: integer }
        tx_count: { type: integer }
        timestamp: { type: integer }
        size: { type: integer }
        bits: { type: integer }

    Block:
      type: object
      description: Full block (getblock / getblockbyheight). `txids` when verbose=false, `transactions` when verbose=true.
      properties:
        hash: { $ref: '#/components/schemas/Hex32' }
        height: { type: integer }
        blue_score: { type: integer }
        tx_count: { type: integer }
        timestamp: { type: integer }
        bits: { type: string, description: Difficulty bits as 0x-prefixed hex string. }
        nonce: { type: integer }
        parents:
          type: array
          items: { $ref: '#/components/schemas/Hex32' }
        merkle_root: { $ref: '#/components/schemas/Hex32' }
        size: { type: integer }
        txids:
          type: array
          description: Present when verbose=false.
          items: { $ref: '#/components/schemas/Hex32' }
        transactions:
          type: array
          description: Present when verbose=true.
          items: { $ref: '#/components/schemas/Transaction' }

    TransactionLookup:
      type: object
      description: gettransaction result.
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        block_hash: { $ref: '#/components/schemas/Hex32' }
        block_height: { type: integer }
        timestamp: { type: integer }
        confirmations: { type: integer }
        transaction: { $ref: '#/components/schemas/Transaction' }

    Balance:
      type: object
      properties:
        satoshis: { $ref: '#/components/schemas/Satoshis' }
        bloch: { type: number, description: Display-only BLCH float. }
        utxo_count: { type: integer }
        address: { $ref: '#/components/schemas/Address' }

    AddressCount:
      type: object
      description: getaddresscount — distinct on-chain wallets holding >= 1 UTXO.
      properties:
        addresses_with_balance: { type: integer }
        utxo_entries: { type: integer }
        note: { type: string }

    Utxo:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        index: { type: integer }
        value: { $ref: '#/components/schemas/Satoshis' }
        script_pubkey: { type: string }

    UtxoList:
      type: object
      properties:
        address: { $ref: '#/components/schemas/Address' }
        utxo_count: { type: integer }
        satoshis: { $ref: '#/components/schemas/Satoshis' }
        bloch: { type: number }
        utxos:
          type: array
          items: { $ref: '#/components/schemas/Utxo' }

    AddressInfo:
      type: object
      description: getaddressinfo result.
      properties:
        address: { $ref: '#/components/schemas/Address' }
        balance_sats: { $ref: '#/components/schemas/Satoshis' }
        balance_bloch: { type: number }
        utxo_count: { type: integer }
        pending_incoming: { $ref: '#/components/schemas/Satoshis' }
        pending_outgoing: { $ref: '#/components/schemas/Satoshis' }
        pool_role:
          description: Named protocol pool this address is (e.g. validator / oracle / founder), else null.
          oneOf:
            - type: string
            - type: "null"

    AddressBalanceAtHeight:
      type: object
      description: getaddressbalance_at_height result.
      properties:
        address: { $ref: '#/components/schemas/Address' }
        height: { type: integer }
        balance_sats: { $ref: '#/components/schemas/Satoshis' }
        balance_bloch: { type: number }
        tx_count_up_to_height: { type: integer }

    AddressHistoryEntry:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        block_height: { type: integer }
        timestamp: { type: integer }
        confirmations: { type: integer }
        direction: { type: string, enum: [incoming, outgoing, self] }
        amount_sats: { $ref: '#/components/schemas/Satoshis' }
        amount_bloch: { type: number }

    ListTransactionsResult:
      type: object
      description: listtransactions result.
      properties:
        address: { $ref: '#/components/schemas/Address' }
        count: { type: integer }
        total_available: { type: integer }
        start_height: { type: integer }
        end_height: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/AddressHistoryEntry' }

    AddressValidation:
      type: object
      description: validateaddress result.
      properties:
        address: { type: string }
        isvalid: { type: boolean }
        network: { type: string, enum: [mainnet, testnet, unknown] }
        checksum: { type: boolean }

    AddressValidationVerbose:
      description: validateaddressverbose — one of two shapes depending on validity.
      oneOf:
        - type: object
          required: [valid, address, network, hash_hex, prefix]
          properties:
            valid: { const: true }
            address: { type: string }
            network: { type: string, enum: [mainnet, testnet] }
            hash_hex: { $ref: '#/components/schemas/Hex20' }
            prefix: { type: string }
        - type: object
          required: [valid, address, reason]
          properties:
            valid: { const: false }
            address: { type: string }
            reason: { type: string }

    BroadcastResult:
      type: object
      description: sendrawtransaction success.
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }

    FeeEstimate:
      type: object
      description: estimatefee — median fee of current mempool entries.
      properties:
        feerate_sats: { type: integer }
        feerate_bloch: { type: number }
        mempool_size: { type: integer }
        note: { type: string }

    FeeEstimateAdvanced:
      type: object
      description: estimatefeeadvanced result.
      properties:
        next_block_sats: { type: integer }
        medium_priority: { type: integer }
        slow_priority: { type: integer }
        mempool_median: { type: integer }
        mempool_size: { type: integer }
        recommended_bloch: { type: string, description: Formatted BLCH string (8 decimals). }

    MempoolEntry:
      type: object
      description: getrawmempool verbose entry.
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        fee: { type: integer }
        fee_bloch: { type: number }
        time: { type: integer }

    RawMempool:
      description: getrawmempool — compact (txids) or verbose (transactions) shape.
      oneOf:
        - type: object
          properties:
            size: { type: integer }
            txids:
              type: array
              items: { $ref: '#/components/schemas/Hex32' }
        - type: object
          properties:
            size: { type: integer }
            transactions:
              type: array
              items: { $ref: '#/components/schemas/MempoolEntry' }

    MempoolBucket:
      type: object
      properties:
        range: { type: string }
        tx_count: { type: integer }

    MempoolStats:
      type: object
      description: getmempoolstats result.
      properties:
        size: { type: integer }
        total_fees: { type: integer }
        min_fee: { type: integer }
        max_fee: { type: integer }
        median_fee: { type: integer }
        avg_fee: { type: number }
        buckets:
          type: array
          items: { $ref: '#/components/schemas/MempoolBucket' }

    TxStatus:
      type: object
      description: gettxstatus result.
      properties:
        status: { type: string, enum: [unknown, pending, confirmed, final] }
        in_mempool: { type: boolean }
        confirmations: { type: integer }
        block_height: { type: integer, description: Present when confirmed/final. }
        txid: { $ref: '#/components/schemas/Hex32' }

    ChainStats:
      type: object
      description: getchainstats result.
      properties:
        total_blocks: { type: integer }
        total_txs: { type: integer }
        avg_txs_per_block: { type: number }
        blocks_last_24h: { type: integer }
        txs_last_24h: { type: integer }
        avg_block_time_secs: { type: number }
        current_difficulty: { type: number }
        hashrate_hs: { type: number }
        hashrate_human: { type: string }

    HashrateInfo:
      type: object
      description: gethashrate result.
      properties:
        hashrate_hs: { type: number }
        hashrate_human: { type: string }
        avg_block_time_secs: { type: number }
        current_difficulty: { type: number }

    SupplyTier:
      type: object
      properties:
        label: { type: string }
        address_count: { type: integer }
        total_sats: { $ref: '#/components/schemas/Satoshis' }
        total_bloch: { type: number }
        pct_of_supply: { type: number }

    SupplyDistribution:
      type: object
      description: getsupplydistribution result.
      properties:
        tiers:
          type: array
          items: { $ref: '#/components/schemas/SupplyTier' }
        total_addresses: { type: integer }
        total_sats: { $ref: '#/components/schemas/Satoshis' }
        total_bloch: { type: number }

    DifficultyPoint:
      type: object
      properties:
        height: { type: integer }
        bits: { type: integer }
        bits_hex: { type: string }
        timestamp: { type: integer }
        target_hex: { type: string }

    DifficultyHistory:
      type: object
      description: getdifficultyhistory result.
      properties:
        count: { type: integer }
        points:
          type: array
          items: { $ref: '#/components/schemas/DifficultyPoint' }

    BlockTimePercentiles:
      type: object
      description: getblocktimepercentiles result.
      properties:
        sample_size: { type: integer }
        window: { type: integer }
        min_secs: { type: number }
        p50_secs: { type: number }
        p90_secs: { type: number }
        p99_secs: { type: number }
        max_secs: { type: number }
        avg_secs: { type: number }
        target_secs: { type: number }

    TxInBlock:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        size_bytes: { type: integer }
        inputs_count: { type: integer }
        outputs_count: { type: integer }
        fee_sats: { type: integer }
        is_coinbase: { type: boolean }

    TxsByBlock:
      type: object
      description: gettxsbyblock result.
      properties:
        block_hash: { $ref: '#/components/schemas/Hex32' }
        block_height: { type: integer }
        block_timestamp: { type: integer }
        count: { type: integer }
        txs:
          type: array
          items: { $ref: '#/components/schemas/TxInBlock' }

    PoolReportEntry:
      type: object
      description: One protocol pool in getpools. Founder entry adds vesting fields; a pool with no configured address reports status "pending_phase_6".
      properties:
        share_bps:
          oneOf:
            - type: integer
            - type: "null"
        subsidy_per_block_sat: { type: integer }
        address_hash_hex:
          oneOf:
            - $ref: '#/components/schemas/Hex20'
            - type: "null"
        address:
          oneOf:
            - $ref: '#/components/schemas/Address'
            - type: "null"
        balance_sat: { type: integer }
        balance_bloch: { type: number }
        utxo_count: { type: integer }
        status: { type: string, enum: [active, pending_phase_6] }
        vesting_per_month_sat: { type: integer }
        vesting_amount_at_next_sat: { type: integer }
        vesting_active_at_next: { type: boolean }
        vesting_total_sat: { type: integer }
        vesting_months: { type: integer }

    Pools:
      type: object
      description: getpools — next-block subsidy split plus per-pool address/balance.
      properties:
        current_height: { type: integer }
        next_block_height: { type: integer }
        subsidy_per_block_sat: { type: integer }
        subsidy_per_block_bloch: { type: number }
        miner_share_sat: { type: integer }
        pools:
          type: object
          properties:
            validator_pool: { $ref: '#/components/schemas/PoolReportEntry' }
            oracle_pool: { $ref: '#/components/schemas/PoolReportEntry' }
            founder: { $ref: '#/components/schemas/PoolReportEntry' }

    BlockTemplateTx:
      type: object
      properties:
        txid: { $ref: '#/components/schemas/Hex32' }
        fee: { type: integer }
        data: { type: string, description: 'Hex-encoded transaction bytes (Bitcoin wire format, script_sig included).' }

    BlockTemplate:
      type: object
      description: |
        getblocktemplate — everything a SIS-aware pool needs to assemble a
        candidate block. `bits` is computed exactly as accept_block validates
        (ASERT-Lattice anchored at genesis, keyed on the parent timestamp).
      properties:
        parents:
          type: array
          items: { $ref: '#/components/schemas/Hex32' }
        height: { type: integer }
        blue_score: { type: integer }
        bits: { type: integer }
        cur_time: { type: integer }
        parent_time: { type: integer }
        subsidy_sat: { type: integer }
        founder_vesting_sat: { type: integer }
        founder_address_hash: { $ref: '#/components/schemas/Hex20' }
        total_fees: { type: integer }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/BlockTemplateTx' }
        residual_coeffs:
          type: array
          description: |
            Canonical Module-SIS residual coefficients selected by this template's
            height (SF-1 soft fork: k=4 below activation, k=8 at/above). A pool
            that honors this mines witnesses validate_pow will accept.
          items: { type: integer }

    SubmitBlockResult:
      description: submitblock — accepted, or a result.error on rejection / when the pool seam is not wired.
      oneOf:
        - type: object
          properties:
            accepted: { const: true }
            hash: { type: string }
        - $ref: '#/components/schemas/ResultError'

    AttestationReport:
      type: object
      description: |
        getattestation — TEE attestation status. Reports `attested: false` when
        no TEE provider is active (the honest default on a non-confidential
        host). Serialized directly from the node's AttestationReport.
      properties:
        attested: { type: boolean }
        tee: { type: string, description: 'Backend that produced the report (e.g. none / sev-snp / tdx).' }
        nonce:
          description: Echoed freshness challenge (params[0]) if supplied.
          oneOf: [ { type: string }, { type: "null" } ]
        measurement:
          oneOf: [ { type: string }, { type: "null" } ]
        hostdata:
          oneOf: [ { type: string }, { type: "null" } ]
        image_digest:
          oneOf: [ { type: string }, { type: "null" } ]
        quote_b64:
          oneOf: [ { type: string }, { type: "null" } ]
        os_roothash:
          oneOf: [ { type: string }, { type: "null" } ]
        note: { type: string }

# ── Per-method contract (OpenAPI has no native JSON-RPC modelling) ──────────
# This vendor extension documents each method's positional params and the
# result schema returned inside the JSON-RPC `result` field. Any method can
# instead return `{ "error": "<message>" }` (ResultError) on failure.
x-json-rpc-methods:

  getnetworkinfo:
    category: chain-state
    params: []
    result: { $ref: '#/components/schemas/NetworkInfo' }

  getblockcount:
    category: chain-state
    params: []
    result: { type: integer, description: Selected-chain block count. }

  getmempoolinfo:
    category: chain-state
    params: []
    result: { $ref: '#/components/schemas/MempoolInfo' }

  getdaginfo:
    category: chain-state
    params: []
    result: { $ref: '#/components/schemas/DagInfo' }

  getpeerinfo:
    category: chain-state
    params: []
    result: { $ref: '#/components/schemas/PeerInfo' }

  getpeers:
    category: chain-state
    params: []
    result: { $ref: '#/components/schemas/PeersList' }

  getblockhash:
    category: blocks
    params:
      - { name: height, type: integer, required: true }
    result: { $ref: '#/components/schemas/Hex32', description: 'Block hash hex, or result.error if height not found.' }

  getblock:
    category: blocks
    params:
      - { name: hash, type: string, required: true, description: Block hash (64 hex). }
      - { name: verbose, type: boolean, required: false, default: false, description: true expands full transactions; false lists txids. }
    result: { $ref: '#/components/schemas/Block' }

  getblockbyheight:
    category: blocks
    params:
      - { name: height, type: integer, required: true }
      - { name: verbose, type: boolean, required: false, default: false }
    result: { $ref: '#/components/schemas/Block' }

  getrecentblocks:
    category: blocks
    params:
      - { name: count, type: integer, required: false, default: 10, maximum: 50 }
    result:
      type: array
      items: { $ref: '#/components/schemas/BlockSummary' }

  gettxsbyblock:
    category: blocks
    params:
      - { name: block, required: true, description: '64-hex block hash, or a height (number or numeric string).' }
    result: { $ref: '#/components/schemas/TxsByBlock' }

  gettransaction:
    category: transactions
    params:
      - { name: txid, type: string, required: true }
    result: { $ref: '#/components/schemas/TransactionLookup' }

  gettxstatus:
    category: transactions
    params:
      - { name: txid, type: string, required: true }
    result: { $ref: '#/components/schemas/TxStatus' }

  decoderawtransaction:
    category: transactions
    params:
      - { name: hex, type: string, required: true, description: 'Bitcoin-format tx bytes, hex-encoded.' }
    result: { $ref: '#/components/schemas/Transaction' }

  getrawmempool:
    category: transactions
    params:
      - { name: verbose, type: boolean, required: false, default: false }
    result: { $ref: '#/components/schemas/RawMempool' }

  getmempoolstats:
    category: transactions
    params: []
    result: { $ref: '#/components/schemas/MempoolStats' }

  getbalance:
    category: addresses
    params:
      - { name: address, type: string, required: true }
    result: { $ref: '#/components/schemas/Balance' }

  getutxos:
    category: addresses
    params:
      - { name: address, type: string, required: true }
    result: { $ref: '#/components/schemas/UtxoList' }

  getaddressinfo:
    category: addresses
    params:
      - { name: address, type: string, required: true }
    result: { $ref: '#/components/schemas/AddressInfo' }

  getaddressbalance_at_height:
    category: addresses
    params:
      - { name: address, type: string, required: true }
      - { name: height, type: integer, required: true }
    result: { $ref: '#/components/schemas/AddressBalanceAtHeight' }

  getaddresscount:
    category: addresses
    params: []
    result: { $ref: '#/components/schemas/AddressCount' }

  listtransactions:
    category: addresses
    params:
      - { name: address, type: string, required: true }
      - { name: limit, type: integer, required: false, default: 20, maximum: 1000 }
      - { name: start_height, type: integer, required: false, default: 0 }
      - { name: end_height, type: integer, required: false, description: Defaults to current tip height. }
      - { name: offset, type: integer, required: false, default: 0 }
    result: { $ref: '#/components/schemas/ListTransactionsResult' }

  validateaddress:
    category: addresses
    params:
      - { name: address, type: string, required: true }
    result: { $ref: '#/components/schemas/AddressValidation' }

  validateaddressverbose:
    category: addresses
    params:
      - { name: address, type: string, required: true }
    result: { $ref: '#/components/schemas/AddressValidationVerbose' }

  estimatefee:
    category: fees
    params: []
    result: { $ref: '#/components/schemas/FeeEstimate' }

  estimatefeeadvanced:
    category: fees
    params: []
    result: { $ref: '#/components/schemas/FeeEstimateAdvanced' }

  sendrawtransaction:
    category: write
    write: true
    auth: Requires X-API-Key when require_auth_for_writes is on and the caller is non-local; localhost bypasses.
    params:
      - { name: hex, type: string, required: true, description: 'Signed transaction, Bitcoin-format bytes, hex-encoded. Coinbase not accepted.' }
    result: { $ref: '#/components/schemas/BroadcastResult' }

  getchainstats:
    category: chain-state
    params: []
    result: { $ref: '#/components/schemas/ChainStats' }

  gethashrate:
    category: chain-state
    params: []
    result: { $ref: '#/components/schemas/HashrateInfo' }

  getsupplydistribution:
    category: chain-state
    params: []
    result: { $ref: '#/components/schemas/SupplyDistribution' }

  getdifficultyhistory:
    category: chain-state
    params:
      - { name: limit, type: integer, required: false, default: 20, maximum: 100 }
    result: { $ref: '#/components/schemas/DifficultyHistory' }

  getblocktimepercentiles:
    category: chain-state
    params:
      - { name: window, type: integer, required: false, default: 100, minimum: 10, maximum: 1000 }
    result: { $ref: '#/components/schemas/BlockTimePercentiles' }

  getpools:
    category: chain-state
    params: []
    result: { $ref: '#/components/schemas/Pools' }

  getattestation:
    category: chain-state
    params:
      - { name: nonce, type: string, required: false, description: Optional freshness challenge echoed into the report. }
    result: { $ref: '#/components/schemas/AttestationReport' }

  getblocktemplate:
    category: mining
    params: []
    result: { $ref: '#/components/schemas/BlockTemplate' }

  submitblock:
    category: mining
    write: true
    auth: Treated as a write (auth/rate-limit like sendrawtransaction). Returns result.error when the pool seam is not wired.
    params:
      - { name: block, type: string, required: true, description: 'Full block, Bitcoin wire format, hex-encoded.' }
    result: { $ref: '#/components/schemas/SubmitBlockResult' }
