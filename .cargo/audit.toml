# cargo-audit configuration — keeps `cargo audit --deny warnings` (the CI gate
# in .gitlab-ci.yml) in lock-step with cargo-deny's advisory policy in
# ../deny.toml. cargo-audit does NOT read deny.toml, so the unmaintained-crate
# dispositions are mirrored here.
#
# POLICY (kept identical to deny.toml — SECURITY_TOOLING.md §Advisory-posture is
# the authoritative disposition table):
#   * Genuine VULNERABILITY-class advisories are never dismissed lightly. The two
#     open hickory-proto advisories (RUSTSEC-2026-0118 / -0119) are ACCEPTED, not
#     fixed: the fix is hickory 0.26.x but libp2p 0.56.0 pins hickory-proto 0.25.2
#     via libp2p-dns + libp2p-mdns, so there is no bump path until libp2p repins.
#     They are tracked here and in deny.toml as OPEN, with a reachability
#     rationale, and MUST be removed the moment a libp2p release ships hickory
#     >= 0.26.x. This mirrors the intentional risk-acceptance in deny.toml.
#   * All other entries are `unmaintained` / `unsound` notices with no runtime
#     attack surface on the node, each with a written rationale.
#
# NOTE: `cargo audit` (RUSTSEC-only) does NOT flag the GHSA-only advisories that
# osv-scanner surfaces — e.g. the SP1 plonky3 p3-challenger/p3-symmetric crates
# (still open residuals), or yamux 0.12.1 (GHSA-vxx9-2994-q338, CVSS 8.7), which
# was CLOSED 2026-09-05 by the vendored crates/libp2p-yamux fork (finding
# SC3-yamux-dedupe). Residuals live in SECURITY_TOOLING.md; run osv-scanner to see them.
[advisories]
ignore = [
    # ── Post-quantum crypto: vendored, intentionally pinned (PQClean archived) ──
    "RUSTSEC-2026-0165", # pqcrypto-falcon    unmaintained
    "RUSTSEC-2026-0166", # pqcrypto-mldsa     unmaintained
    "RUSTSEC-2026-0162", # pqcrypto-traits    unmaintained
    "RUSTSEC-2026-0163", # pqcrypto-internals unmaintained (vendored crate)
    "RUSTSEC-2024-0381", # pqcrypto-kyber     superseded by pqcrypto-mlkem
    "RUSTSEC-2026-0161", # pqcrypto-mlkem unmaintained — EXCEPTION 2026-11-14
                         # (L1M-06), re-review by 2027-02-14; no patched release.
                         # Hybrid (ML-KEM-768 + X25519) mesh transport only,
                         # never consensus; live on mainnet, whose fleet runs
                         # `--mesh-security offer` (reviewed 2026-11-18, version
                         # and checksum unchanged). Mirrors deny.toml.
    # ── Transitive, no first-party call path ──────────────────────────────────
    "RUSTSEC-2025-0141", # bincode 1.3.3 unmaintained — node-local restart cache.
                         # First-party use now exists; cache is checksummed,
                         # build-bound and validated before restoring state.
                         # This is accepted maintenance risk, not unreachable code.
    "RUSTSEC-2024-0436", # paste unmaintained — compile-time proc-macro helper
    "RUSTSEC-2026-0543", # chrono unmaintained (all versions, no patched release) —
                         # EXCEPTION 2026-11-18 (L1 round 19), re-review by
                         # 2027-02-14. `Utc::now().to_rfc3339()` for wallet-file
                         # `created_at` in bloch-crypto and the frozen Genesis-3
                         # node; never consensus, no untrusted date parsing.
                         # Mirrors deny.toml.
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained — compile-time only
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained — transitive TLS PEM decode
    # ── SP1 prover / zk host-side toolchain (not the node runtime path) ────────
    "RUSTSEC-2025-0012", # backoff unmaintained       — via sp1-sdk
    "RUSTSEC-2024-0384", # instant unmaintained       — via backoff (SP1)
    "RUSTSEC-2021-0139", # ansi_term unmaintained     — via tracing-forest (SP1)
    "RUSTSEC-2024-0388", # derivative unmaintained    — via ark-ff (zk stack)
    "RUSTSEC-2025-0119", # number_prefix unmaintained — via indicatif (SP1 CLI)
    "RUSTSEC-2026-0002", # lru UNSOUND (IterMut aliasing) — sp1-prover host-side
    "RUSTSEC-2026-0253", # lru 0.12.5 UNSOUND (LruCache::pop() panic safety) —
                         # EXCEPTION added 2026-09-05 (finding SC1-advisories),
                         # re-review by 2026-12-01. Fix is lru >= 0.18.2 but
                         # sp1-prover 4.2.1 pins `lru ^0.12.4`, so there is no
                         # bump path without forking the pinned SP1 stack.
                         # Reachability: sp1-prover host-side proving only, never
                         # the node consensus/mempool/P2P runtime; the UB needs a
                         # panicking Drop/Hash impl inside the cache, which the
                         # SP1 usage does not have. REMOVE when SP1 repins
                         # lru >= 0.18.2.
    # ── Accepted vulnerabilities, no upstream bump path (mirrors deny.toml) ─────
    "RUSTSEC-2026-0118", # hickory-proto NSEC3 unbounded loop — libp2p 0.56-pinned
    "RUSTSEC-2026-0119", # hickory-proto O(n^2) name compression — libp2p-pinned
    # ── EXCEPTIONS added 2026-11-15 (L1M-17, node release candidate after
    #    84040ce0), re-review by 2027-02-14. Mirrored in deny.toml and
    #    osv-scanner.toml; SECURITY_TOOLING.md §Advisory posture has the table.
    #    The same pass FIXED, by in-semver Cargo.lock bumps, everything with a
    #    compatible patch that reaches the bloch-pos binary: libp2p-gossipsub
    #    0.49.4 -> 0.49.5 (RUSTSEC-2026-0536), tokio 1.52.1 -> 1.53.3
    #    (RUSTSEC-2026-0386), rustix 1.1.4 -> 1.1.6 (RUSTSEC-2026-0486).
    #
    # (A) Compiled into bloch-pos, NOT reachable on the mainnet configuration.
    #     The libp2p swarm (gossipsub, libp2p-dns/hickory) is built only under
    #     `--transport libp2p|dual` (engine.rs start_libp2p); the default and the
    #     whole fleet + bootnodes run `--transport devnet` (main.rs
    #     decide_transport, deploy/bootnodes/bootnodes.txt). MUST be fixed before
    #     any production unit runs libp2p or dual.
    "RUSTSEC-2026-0534", # libp2p-gossipsub PRUNE for unknown topics -> unbounded
                         # backoff state. Fix only in 0.50.1 (libp2p 0.57 line,
                         # breaking); 0.49.5 caps each entry at 3600 s but not the
                         # topic count. Fix path: vendored backport of
                         # rust-libp2p#6707 (as crates/libp2p-yamux) or libp2p 0.57.
    "RUSTSEC-2026-0487", # hickory-proto SVCB alpn text-parse panic   (no 0.25 fix)
    "RUSTSEC-2026-0489", # hickory-proto SVCB quote text-parse panic  (no 0.25 fix)
    "RUSTSEC-2026-0490", # hickory-proto zone-file lexer panic        (no 0.25 fix)
    "RUSTSEC-2026-0491", # hickory-proto header record-count memory amplification
    "RUSTSEC-2026-0504", # hickory-proto DNSSEC NSEC3 comparison
    "RUSTSEC-2026-0505", # hickory-proto DNSSEC NSEC3 owner names
    "RUSTSEC-2026-0511", # hickory-proto DNSSEC NXDOMAIN for empty non-terminal
    "RUSTSEC-2026-0512", # hickory-proto DNSSEC unrelated signed RRset
    "RUSTSEC-2026-0530", # hickory-proto DNSSEC parent-side NSEC at zone cut
    "RUSTSEC-2026-0531", # hickory-proto DNSSEC child-side NSEC/NSEC3 for DS
    "RUSTSEC-2026-0532", # hickory-proto DNSSEC parent-side NSEC3 at zone cut
    "RUSTSEC-2026-0514", # hickory-resolver lookup() hides DNSSEC failures
    "RUSTSEC-2026-0549", # hickory-proto DNSSEC NSEC3 NODATA at zone apex
    "RUSTSEC-2026-0550", # hickory-proto DNSSEC unsigned NSEC/NSEC3 in a proof
    "RUSTSEC-2026-0551", # hickory-proto DNSSEC records of another DNS class
                         # -0549/-0550/-0551 added 2026-11-18 (L1 round 19),
                         # re-review by 2027-02-14: DNSSEC validator only, which
                         # is not compiled (see below); patched = [].
                         # All hickory: fix is >= 0.26.2, libp2p-dns 0.44 (libp2p
                         # 0.56) pins 0.25. Even in libp2p mode the node resolves
                         # only operator-written /dns* --p2p-peer addresses
                         # (identify addresses are never dialled); hickory is
                         # built without DNSSEC features, so the eight DNSSEC
                         # advisories are not compiled; the text/zone-file parsers
                         # are not on the wire path.
    # (B) NOT in the bloch-pos dependency graph at all (`cargo tree -p
    #     bloch-pos-node --features ws-release-anchor --target
    #     x86_64-unknown-linux-gnu -e normal,build`): legacy Genesis-3 node,
    #     reqwest TLS in tools, the SP1 prover stack, fuzz/pool/coherence-prover
    #     lockfiles. Most have in-semver patches; bumping them is deferred to a
    #     follow-up so the release lockfile delta stays minimal.
    #     UPDATE 2026-11-18 (L1 round 19): the ROOT Cargo.lock now carries the
    #     fixes (quinn-proto 0.11.19, quinn-udp 0.5.16, rustls 0.23.46,
    #     rustls-webpki 0.103.16, webpki-roots 1.0.10, zstd-sys 2.1.2, libz-sys
    #     1.1.33) and deny.toml dropped its copies of these ignores, so
    #     `cargo deny` fails again if the root regresses. The entries stay here
    #     only for the separately locked fuzz, pool and coherence-prover
    #     workspaces this file also governs. crypto-bigint 0.5.5 has no
    #     in-semver fix and stays as it was.
    "RUSTSEC-2026-0338", # quinn-proto zero-length STREAM panic         (>=0.11.18)
    "RUSTSEC-2026-0339", # quinn-proto CID retirement growth            (>=0.11.17)
    "RUSTSEC-2026-0340", # quinn-proto min ACK delay panic              (>=0.11.18)
    "RUSTSEC-2026-0341", # quinn-proto reassembly guard bypass          (>=0.11.17)
    "RUSTSEC-2026-0342", # quinn-proto zero-length DATAGRAM             (>=0.11.17)
    "RUSTSEC-2026-0343", # quinn-proto datagram accounting panic     (>=0.11.18)
    "RUSTSEC-2026-0523", # quinn-proto MAX_STREAM_DATA stream limit     (>=0.11.19)
    "RUSTSEC-2026-0524", # quinn-proto long Retry token (client)        (>=0.11.19)
    "RUSTSEC-2026-0538", # quinn-udp truncated datagram spin            (>=0.5.16)
    "RUSTSEC-2026-0346", # rustls session Debug exposes secrets         (>=0.23.46)
    "RUSTSEC-2026-0347", # rustls ECH rejection buffered data           (>=0.23.46)
    "RUSTSEC-2026-0348", # rustls Brotli cert decompression          (>=0.23.46)
    "RUSTSEC-2026-0349", # rustls unauthenticated ServerHello downgrade (>=0.23.46)
    "RUSTSEC-2026-0382", # rustls-webpki distrusted intermediates       (>=0.103.16)
    "RUSTSEC-2026-0381", # webpki-roots distrusted emSign intermediates (>=1.0.10)
    "RUSTSEC-2026-0387", # crypto-bigint 0.5 timing (fix 0.7.6, breaking; SP1/zk)
    "RUSTSEC-2026-0410", # zstd-sys wasm allocator shim (legacy rocksdb, not wasm)
    "RUSTSEC-2026-0418", # libz-sys build-script env leak (build host only)
    # (C) Fixed in the root Cargo.lock by this pass; still present in the
    #     separately locked pool, pool-proxy, pq-shield-api, coherence-prover and
    #     fuzz workspaces, none of which is the node. No first-party code calls
    #     tokio AsyncFd or rustix xattr functions (git grep).
    "RUSTSEC-2026-0386", # tokio AsyncFd I/O-safety unsoundness (root: 1.53.3)
    "RUSTSEC-2026-0486", # rustix xattr unsoundness             (root: 1.1.6)
    # (D) Harness lockfiles only (audit/pq-conformance, crates/bloch-crypto/fuzz),
    #     first scanned 2026-11-15; not in the root Cargo.lock at all.
    "RUSTSEC-2026-0385", # ctutils 0.4.3 non-constant-time masks (>=0.4.4)
    # ── crates/coherence-prover/{script,service} ONLY (N-3, Round 3) ───────────
    # This config also governs `scripts/audit-all-lockfiles.sh`'s scan of the two
    # coherence-prover lockfiles (added by finding P123-sp1-verifier and, until
    # this fix, missing from that script's LOCKFILES list — see N-3). The root
    # Cargo.lock is NOT affected by any of the three entries below: root already
    # resolves ruint 1.20.0 / time 0.3.47 (verified via `grep -A2 'name =
    # "ruint"|"time"' Cargo.lock`), so these ignores can never mask a root
    # regression — an advisory ID only fires against a version its range
    # actually covers.
    #
    # EXCEPTION added 2026-09-06, re-review by 2026-12-01. Attempted fix: `cargo
    # update -p ruint --precise 1.20.0` / `-p time --precise 0.3.47` inside both
    # crates/coherence-prover/script and crates/coherence-prover/service. Both
    # fail identically:
    #   error: failed to select a version for `serde_derive`.
    #       ... required by package `serde_core v1.0.220`
    #       ... which satisfies dependency `serde_core = "^1.0.211"` of ruint v1.20.0
    #       (or `serde_core = "^1.0.220"` of time v0.3.47)
    #       ... conflicts with `serde = "=1.0.219"` pinned in
    #       crates/coherence-prover/{script,service}/Cargo.toml, whose own comment
    #       explains why: "serde >=1.0.221 removed serde::__private, breaking
    #       alloy-consensus 0.14 (sp1-sdk dep)". serde_core did not exist as a
    #       separate crate before that serde split, so no ruint/time release new
    #       enough to fix these advisories can resolve against serde=1.0.219.
    # Fixing this requires bumping the sp1-sdk 4.2.1 / alloy-consensus 0.14 pin
    # itself (a Cargo.toml change in crates/coherence-prover, owned by the
    # SP1-verifier work, not this CI/supply-chain pass) — tracked as an action
    # item in SECURITY_TOOLING.md. REMOVE these three entries the moment that
    # pin moves and `cargo update -p ruint -p time` resolves cleanly.
    "RUSTSEC-2026-0220", # ruint 1.16.0: Uint shift ops incorrect overflow flags —
                         # coherence-prover/script+service only; fix is >=1.20.0
    "RUSTSEC-2025-0137", # ruint 1.16.0: unsound safe `reciprocal_mg10` —
                         # coherence-prover/script+service only; fix is >=1.17.1
    "RUSTSEC-2026-0009", # time 0.3.44 (script)/0.3.44 (service): DoS via stack
                         # exhaustion — coherence-prover/script+service only;
                         # fix is >=0.3.47. Host-side SP1 tracing dep, not the
                         # node consensus/mempool/P2P runtime.
]
