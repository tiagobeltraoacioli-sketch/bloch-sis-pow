[package]
name = "bloch-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
# cargo-fuzz harness — NOT built by the node's cargo build (not a path-dep of
# bloch). Run with the nightly toolchain: `cargo +nightly fuzz run <target>`.

[package.metadata]
cargo-fuzz = true

# Make the fuzz crate its own workspace root. The node's root manifest already
# lists `fuzz` in `workspace.exclude`, but cargo-fuzz builds the crate with an
# explicit `--manifest-path` and still walks up to the parent workspace unless
# an empty `[workspace]` table anchors it here. This keeps the harness fully
# decoupled from the node build (it is not a path-dep of `bloch`).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# Genesis-3, the CLOSED proof-of-work node. This used to read `path = ".."`,
# from when the repo root WAS the `bloch` package. Genesis-4 made the root a
# virtual manifest and moved the PoW node to legacy/genesis3-node/, and cargo
# answers a path-dep on a virtual manifest with a hard error — so every target
# in this harness failed to resolve, silently, for as long as that lasted.
# `tests/fuzz_harness_resolves.rs` in bloch-pos-node is what now goes red if
# this path stops naming a package.
bloch = { path = "../legacy/genesis3-node" }
bloch-sis-pow = { path = "../crates/bloch-sis-pow" }
coherence-core = { path = "../crates/coherence-core" }
# ── Genesis-4, THE LIVE CHAIN. The `pos_*` targets below. ──
# The frozen consensus math: BlockHeaderV4::canonical_deserialize, Attestation,
# tokenomics_v4::split_g3_sat.
bloch-pos-committee = { path = "../crates/bloch-pos-committee" }
# bloch-pos-node is a [[bin]]-only crate, so its decoders cannot be `use`d.
# The pos_* targets pull src/codec.rs and src/genesis.rs in by `#[path]`, which
# means the fuzzed bytes run the node's own source and not a copy of it — and
# it means this harness needs what those two modules need: sha3, and
# bloch-crypto for the suite check inside the genesis manifest verifier.
bloch-crypto = { path = "../crates/bloch-crypto" }
sha3 = "0.10"
# P1 (roadmap §1b): the netmsg / handshake decode targets mirror the node's
# gossipsub/transport ingest, which decodes with bincode 2 (serde). Match the
# node's version so the wire format under fuzz is identical.
bincode = { version = "2", features = ["serde"] }

# Vendored PQ fork (same as the node) — [patch] applies from the build root.
# libp2p-yamux likewise: `fuzz` is its OWN `[workspace]` root (see above), so
# the ROOT Cargo.toml's `[patch.crates-io] libp2p-yamux = { path =
# "crates/libp2p-yamux" }` does not apply here — this workspace needs its own
# copy of the same patch, or the vulnerable dual-backend yamux 0.12.1
# (GHSA-vxx9-2994-q338, CVSS 8.7) comes back in through `bloch` (legacy
# genesis3-node) -> libp2p 0.56.0, exactly as it did before this fix (N-4,
# Round 3). See crates/libp2p-yamux/Cargo.toml for the fork's rationale.
[patch.crates-io]
pqcrypto-internals = { path = "../crates/pqcrypto-internals" }
libp2p-yamux = { path = "../crates/libp2p-yamux" }

[[bin]]
name = "block_parse"
path = "fuzz_targets/block_parse.rs"
test = false
doc = false

[[bin]]
name = "tx_parse"
path = "fuzz_targets/tx_parse.rs"
test = false
doc = false

[[bin]]
name = "pow_decode"
path = "fuzz_targets/pow_decode.rs"
test = false
doc = false

[[bin]]
name = "pow_verify"
path = "fuzz_targets/pow_verify.rs"
test = false
doc = false

[[bin]]
name = "merkle_path"
path = "fuzz_targets/merkle_path.rs"
test = false
doc = false

# ── P1 (roadmap §1b): no-panic targets on the untrusted P2P ingest paths. ──

[[bin]]
name = "netmsg_decode"
path = "fuzz_targets/netmsg_decode.rs"
test = false
doc = false

[[bin]]
name = "handshake_decode"
path = "fuzz_targets/handshake_decode.rs"
test = false
doc = false

[[bin]]
name = "mempool_ops"
path = "fuzz_targets/mempool_ops.rs"
test = false
doc = false

# ── Scanner priority targets (Part-A #2/#3/#4): live SHA-256d PoW, GhostDAG ──
# ── ordering, and the hybrid ML-DSA-65 ‖ Falcon-1024 signature envelope.    ──

[[bin]]
# Live Genesis-2 SHA-256d PoW verifier (double-SHA256 + endianness hard fork).
# NOTE: distinct from `pow_verify`, which fuzzes the OTHER chain's Module-SIS
# lattice verifier — this covers the PoW that is actually live.
name = "sha256d_pow"
path = "fuzz_targets/sha256d_pow.rs"
test = false
doc = false

[[bin]]
# GhostDAG ordering under adversarial DAG topologies (stateful).
name = "ghostdag_order"
path = "fuzz_targets/ghostdag_order.rs"
test = false
doc = false

[[bin]]
# Hybrid PQ signature verifier + crypto-agility suite envelope parser.
name = "sig_verify"
path = "fuzz_targets/sig_verify.rs"
test = false
doc = false

# ── S-H1: Genesis-4 decoders. Every target above fuzzes a chain that stopped ──
# ── at height 39,918; these four are the untrusted-input surface of the one  ──
# ── that is running. Each asserts a PROPERTY, not merely absence of panic.   ──

[[bin]]
# Whole block frame off gossipsub: codec::decode_envelope.
name = "pos_envelope_decode"
path = "fuzz_targets/pos_envelope_decode.rs"
test = false
doc = false

[[bin]]
# The highest-rate frame on the network: codec::decode_attestation.
name = "pos_attestation_decode"
path = "fuzz_targets/pos_attestation_decode.rs"
test = false
doc = false

[[bin]]
# BlockHeaderV4::canonical_deserialize — the single derivation path BlockId
# rests on.
name = "pos_header_decode"
path = "fuzz_targets/pos_header_decode.rs"
test = false
doc = false

[[bin]]
# genesis::read_carryover_snapshot — the parser that reads the opening ledger.
name = "pos_carryover_snapshot"
path = "fuzz_targets/pos_carryover_snapshot.rs"
test = false
doc = false
