[package]
name = "bloch-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
# cargo-fuzz harness — NOT built by the node's cargo build (not a path-dep of
# bloch). Run with the nightly toolchain: `cargo +nightly fuzz run <target>`.

[package.metadata]
cargo-fuzz = true

# Make the fuzz crate its own workspace root. The node's root manifest already
# lists `fuzz` in `workspace.exclude`, but cargo-fuzz builds the crate with an
# explicit `--manifest-path` and still walks up to the parent workspace unless
# an empty `[workspace]` table anchors it here. This keeps the harness fully
# decoupled from the node build (it is not a path-dep of `bloch`).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# The Genesis-3 proof-of-work node. It was the ROOT package of this repo,
# which is why this line used to read `path = ".."`. Genesis-4 became the
# trunk on 2026-08-13, the root turned into a VIRTUAL manifest, and this
# path stopped resolving — `cargo metadata` on the fuzz crate failed
# outright ("found a virtual manifest ... instead of a package manifest"),
# so every target in this file was unbuildable. `fuzz-smoke` is
# `allow_failure: true`, so CI stayed green and the populated corpus dirs
# kept it looking like a running program. It was not one.
bloch = { path = "../legacy/genesis3-node" }
# The Genesis-4 PoS node — THE LIVE CHAIN's remote surface. Consumed as a
# library (`bloch_pos_node`); the crate is lib+bin since the WP1 split.
bloch-pos-node = { path = "../crates/bloch-pos-node" }
# Consensus types the codec seeds are built from (examples/g4_seedgen.rs).
bloch-pos-committee = { path = "../crates/bloch-pos-committee" }
bloch-sis-pow = { path = "../crates/bloch-sis-pow" }
coherence-core = { path = "../crates/coherence-core" }
# P1 (roadmap §1b): the netmsg / handshake decode targets mirror the node's
# gossipsub/transport ingest, which decodes with bincode 2 (serde). Match the
# node's version so the wire format under fuzz is identical.
bincode = { version = "2", features = ["serde"] }

# Vendored PQ fork (same as the node) — [patch] applies from the build root.
[patch.crates-io]
pqcrypto-internals = { path = "../crates/pqcrypto-internals" }

[[bin]]
name = "block_parse"
path = "fuzz_targets/block_parse.rs"
test = false
doc = false

[[bin]]
name = "tx_parse"
path = "fuzz_targets/tx_parse.rs"
test = false
doc = false

[[bin]]
name = "pow_decode"
path = "fuzz_targets/pow_decode.rs"
test = false
doc = false

[[bin]]
name = "pow_verify"
path = "fuzz_targets/pow_verify.rs"
test = false
doc = false

[[bin]]
name = "merkle_path"
path = "fuzz_targets/merkle_path.rs"
test = false
doc = false

# ── P1 (roadmap §1b): no-panic targets on the untrusted P2P ingest paths. ──

[[bin]]
name = "netmsg_decode"
path = "fuzz_targets/netmsg_decode.rs"
test = false
doc = false

[[bin]]
name = "handshake_decode"
path = "fuzz_targets/handshake_decode.rs"
test = false
doc = false

[[bin]]
name = "mempool_ops"
path = "fuzz_targets/mempool_ops.rs"
test = false
doc = false

# ── Scanner priority targets (Part-A #2/#3/#4): live SHA-256d PoW, GhostDAG ──
# ── ordering, and the hybrid ML-DSA-65 ‖ Falcon-1024 signature envelope.    ──

[[bin]]
# Live Genesis-2 SHA-256d PoW verifier (double-SHA256 + endianness hard fork).
# NOTE: distinct from `pow_verify`, which fuzzes the OTHER chain's Module-SIS
# lattice verifier — this covers the PoW that is actually live.
name = "sha256d_pow"
path = "fuzz_targets/sha256d_pow.rs"
test = false
doc = false

[[bin]]
# GhostDAG ordering under adversarial DAG topologies (stateful).
name = "ghostdag_order"
path = "fuzz_targets/ghostdag_order.rs"
test = false
doc = false

[[bin]]
# Hybrid PQ signature verifier + crypto-agility suite envelope parser.
name = "sig_verify"
path = "fuzz_targets/sig_verify.rs"
test = false
doc = false

# ── Genesis-4 (LIVE CHAIN) remote surface. An external audit found the live ──
# ── chain's untrusted ingest entirely unfuzzed; these three cover it.      ──

[[bin]]
# Block-envelope / attestation wire decoders (src/codec.rs). Reached from both
# gossip and sync ingest. No-panic + encode(decode(x)) == x.
name = "g4_codec"
path = "fuzz_targets/g4_codec.rs"
test = false
doc = false

[[bin]]
# JSON-RPC parse + route (src/rpc.rs). PUBLIC, unauthenticated network surface.
# Parse and dispatch-to-RpcRequest only; the engine backend is stubbed — see
# the honesty note at the top of the target.
name = "g4_rpc"
path = "fuzz_targets/g4_rpc.rs"
test = false
doc = false

[[bin]]
# Directed-sync frame codec (src/p2p.rs) + the nested envelope decode. Frame
# DECODE path only; `read_capped` is WP2's.
name = "g4_p2p_sync"
path = "fuzz_targets/g4_p2p_sync.rs"
test = false
doc = false

# The corpus seeder for the three g4_* targets lives in its own package at
# fuzz/seedgen/ — see the reasoning in its manifest. It is deliberately NOT a
# [[bin]] here (cargo-fuzz would list it as a target) and not an [[example]]
# either (that would drag `bloch` + librocksdb-sys into a 35-minute build for
# what is a two-minute job). Regenerate the seeds with:
#
#     cd fuzz/seedgen && cargo run --release
