# Continuous coverage-guided fuzzing of the Bloch (Genesis-2) node's
# untrusted-input attack surface: P2P wire parsers, the LIVE SHA-256d PoW
# verifier, GhostDAG ordering, and the hybrid ML-DSA-65 ‖ Falcon-1024 signature
# envelope. See fuzz/README.md for the per-target rationale.
fuzzing_engines:
  - libfuzzer
sanitizers:
  - address
  - undefined
architectures:
  - x86_64
