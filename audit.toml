# cargo-audit configuration — keeps `cargo audit --deny warnings` (the CI gate
# in .gitlab-ci.yml) in lock-step with cargo-deny's advisory policy in
# ../deny.toml. cargo-audit does NOT read deny.toml, so the unmaintained-crate
# dispositions are mirrored here.
#
# POLICY (kept identical to deny.toml — SECURITY_TOOLING.md §Advisory-posture is
# the authoritative disposition table):
#   * Genuine VULNERABILITY-class advisories are never dismissed lightly. The two
#     open hickory-proto advisories (RUSTSEC-2026-0118 / -0119) are ACCEPTED, not
#     fixed: the fix is hickory 0.26.x but libp2p 0.56.0 pins hickory-proto 0.25.2
#     via libp2p-dns + libp2p-mdns, so there is no bump path until libp2p repins.
#     They are tracked here and in deny.toml as OPEN, with a reachability
#     rationale, and MUST be removed the moment a libp2p release ships hickory
#     >= 0.26.x. This mirrors the intentional risk-acceptance in deny.toml.
#   * All other entries are `unmaintained` / `unsound` notices with no runtime
#     attack surface on the node, each with a written rationale.
#
# NOTE: `cargo audit` (RUSTSEC-only) does NOT flag the GHSA-only advisories that
# osv-scanner surfaces — e.g. the SP1 plonky3 p3-challenger/p3-symmetric crates
# (still open residuals), or yamux 0.12.1 (GHSA-vxx9-2994-q338, CVSS 8.7), which
# was CLOSED 2026-09-05 by the vendored crates/libp2p-yamux fork (finding
# SC3-yamux-dedupe). Residuals live in SECURITY_TOOLING.md; run osv-scanner to see them.
[advisories]
ignore = [
    # ── Post-quantum crypto: vendored, intentionally pinned (PQClean archived) ──
    "RUSTSEC-2026-0165", # pqcrypto-falcon    unmaintained
    "RUSTSEC-2026-0166", # pqcrypto-mldsa     unmaintained
    "RUSTSEC-2026-0162", # pqcrypto-traits    unmaintained
    "RUSTSEC-2026-0163", # pqcrypto-internals unmaintained (vendored crate)
    "RUSTSEC-2024-0381", # pqcrypto-kyber     superseded by pqcrypto-mlkem
    # ── Transitive, no first-party call path ──────────────────────────────────
    "RUSTSEC-2025-0141", # bincode 1.3.3 unmaintained — wire format uses 2.x
    "RUSTSEC-2024-0436", # paste unmaintained — compile-time proc-macro helper
    "RUSTSEC-2026-0173", # proc-macro-error2 unmaintained — compile-time only
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained — transitive TLS PEM decode
    # ── SP1 prover / zk host-side toolchain (not the node runtime path) ────────
    "RUSTSEC-2025-0012", # backoff unmaintained       — via sp1-sdk
    "RUSTSEC-2024-0384", # instant unmaintained       — via backoff (SP1)
    "RUSTSEC-2021-0139", # ansi_term unmaintained     — via tracing-forest (SP1)
    "RUSTSEC-2024-0388", # derivative unmaintained    — via ark-ff (zk stack)
    "RUSTSEC-2025-0119", # number_prefix unmaintained — via indicatif (SP1 CLI)
    "RUSTSEC-2026-0002", # lru UNSOUND (IterMut aliasing) — sp1-prover host-side
    "RUSTSEC-2026-0253", # lru 0.12.5 UNSOUND (LruCache::pop() panic safety) —
                         # EXCEPTION added 2026-09-05 (finding SC1-advisories),
                         # re-review by 2026-12-01. Fix is lru >= 0.18.2 but
                         # sp1-prover 4.2.1 pins `lru ^0.12.4`, so there is no
                         # bump path without forking the pinned SP1 stack.
                         # Reachability: sp1-prover host-side proving only, never
                         # the node consensus/mempool/P2P runtime; the UB needs a
                         # panicking Drop/Hash impl inside the cache, which the
                         # SP1 usage does not have. REMOVE when SP1 repins
                         # lru >= 0.18.2.
    # ── Accepted vulnerabilities, no upstream bump path (mirrors deny.toml) ─────
    "RUSTSEC-2026-0118", # hickory-proto NSEC3 unbounded loop — libp2p 0.56-pinned
    "RUSTSEC-2026-0119", # hickory-proto O(n^2) name compression — libp2p-pinned
    # ── crates/coherence-prover/{script,service} ONLY (N-3, Round 3) ───────────
    # This config also governs `scripts/audit-all-lockfiles.sh`'s scan of the two
    # coherence-prover lockfiles (added by finding P123-sp1-verifier and, until
    # this fix, missing from that script's LOCKFILES list — see N-3). The root
    # Cargo.lock is NOT affected by any of the three entries below: root already
    # resolves ruint 1.20.0 / time 0.3.47 (verified via `grep -A2 'name =
    # "ruint"|"time"' Cargo.lock`), so these ignores can never mask a root
    # regression — an advisory ID only fires against a version its range
    # actually covers.
    #
    # EXCEPTION added 2026-09-06, re-review by 2026-12-01. Attempted fix: `cargo
    # update -p ruint --precise 1.20.0` / `-p time --precise 0.3.47` inside both
    # crates/coherence-prover/script and crates/coherence-prover/service. Both
    # fail identically:
    #   error: failed to select a version for `serde_derive`.
    #       ... required by package `serde_core v1.0.220`
    #       ... which satisfies dependency `serde_core = "^1.0.211"` of ruint v1.20.0
    #       (or `serde_core = "^1.0.220"` of time v0.3.47)
    #       ... conflicts with `serde = "=1.0.219"` pinned in
    #       crates/coherence-prover/{script,service}/Cargo.toml, whose own comment
    #       explains why: "serde >=1.0.221 removed serde::__private, breaking
    #       alloy-consensus 0.14 (sp1-sdk dep)". serde_core did not exist as a
    #       separate crate before that serde split, so no ruint/time release new
    #       enough to fix these advisories can resolve against serde=1.0.219.
    # Fixing this requires bumping the sp1-sdk 4.2.1 / alloy-consensus 0.14 pin
    # itself (a Cargo.toml change in crates/coherence-prover, owned by the
    # SP1-verifier work, not this CI/supply-chain pass) — tracked as an action
    # item in SECURITY_TOOLING.md. REMOVE these three entries the moment that
    # pin moves and `cargo update -p ruint -p time` resolves cleanly.
    "RUSTSEC-2026-0220", # ruint 1.16.0: Uint shift ops incorrect overflow flags —
                         # coherence-prover/script+service only; fix is >=1.20.0
    "RUSTSEC-2025-0137", # ruint 1.16.0: unsound safe `reciprocal_mg10` —
                         # coherence-prover/script+service only; fix is >=1.17.1
    "RUSTSEC-2026-0009", # time 0.3.44 (script)/0.3.44 (service): DoS via stack
                         # exhaustion — coherence-prover/script+service only;
                         # fix is >=0.3.47. Host-side SP1 tracing dep, not the
                         # node consensus/mempool/P2P runtime.
]
