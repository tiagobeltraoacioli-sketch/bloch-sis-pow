# ══════════════════════════════════════════════════════════════════════════════
# RETIRED. Fly.io deployment for a proof-of-work `bloch` node, running as a
# MINER. The chain it mines stopped at height 39,918 on 2026-08-13; the live
# chain is Genesis-4, proof of stake, and it is not deployed from Fly or from
# this repository's Dockerfile — see `deploy/RELEASE-INTEGRITY.md`.
#
# The same applies to every `blochv-node-*.fly.toml` and `pool.fly.toml` beside
# it at the repo root. They are kept, unchanged, as the deployment record of a
# chain that ran; do not read a `--mine` flag in any of them as a description
# of what the network does now.
# ══════════════════════════════════════════════════════════════════════════════

# Fly.io deployment for a Bloch-SIS node.
#
# Fly builds the repo's Dockerfile and runs it — no manual `docker push`, no
# public registry, no bidding. Deploy from the repo root:
#
#   flyctl launch --copy-config --no-deploy   # first time: creates the app + a volume
#   flyctl deploy                             # build + ship
#
# See deploy/fly/README.md for the full walkthrough.

app = "blochv-node"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"

# Run the node as a miner. ENTRYPOINT is `bloch`; these are its args.
# --max-peers 500: this is the bootstrap/hub node, so it must accept far more
# than the default 50 inbound peers or newcomers get dropped once it fills up
# (the "~50-node wall"). Non-consensus operator knob (feature/peering-ux).
[processes]
  app = "--rpc-bind 0.0.0.0 --rpc-port 16210 --listen /ip4/0.0.0.0/tcp/16110 --data-dir /bloch-data --mine --miner-address bloch1qe986db5149cff7499b282a048272a09aff0af4ff84242073 --max-peers 500 --peer /ip4/45.32.154.137/tcp/16110"

# Persistent chain data. Create the volume once (see README):
#   flyctl volumes create bloch_data --size 30 --region iad
[mounts]
  source = "bloch_data"
  destination = "/bloch-data"

# RPC (JSON-RPC over HTTP). Reachable at https://<app>.fly.dev
[[services]]
  protocol = "tcp"
  internal_port = 16210
  processes = ["app"]
  auto_stop_machines = false   # a miner must stay up
  auto_start_machines = true
  min_machines_running = 1
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [[services.ports]]
    port = 80
    handlers = ["http"]

# P2P (libp2p gossipsub + sync). Raw TCP on the app's public IP.
[[services]]
  protocol = "tcp"
  internal_port = 16110
  processes = ["app"]
  [[services.ports]]
    port = 16110

# VM size. Matches the running machine (shared / 2 CPUs / 2 GB) — cheap, valid,
# and enough: mining (relaxed k=4 regime currently — k=8 reverted, re-activating
# with a difficulty fix) is CPU-bound but the ASERT difficulty self-adjusts, and
# 2 GB fits the node + RocksDB for this chain.
# NOTE: the earlier performance/8 cpus/8gb combo was INVALID — performance CPUs
# require >=2 GB each, so 8 CPUs need >=16 GB; that mismatch was failing every
# deploy. To raise hashrate (better security, higher cost) use e.g.
# cpu_kind="performance", cpus=8, memory="16gb" (or scale out with more machines).
[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "2gb"
