# SPDX-License-Identifier: MIT OR Apache-2.0
#
# bloch-pos — the Genesis-4 node binary. A NEW binary, deliberately:
# the Genesis-3 node (`bloch`, src/main.rs at the repo root) halts at height
# 80,000 and its validation path is never touched by this work
# (BLOCH-POS-NODE-INTEGRATION.md §0). This crate is standalone — its own
# [workspace], exactly like crates/bloch-pos-committee and
# crates/coherence-prover — so nothing here can enter the Genesis-3 build
# graph, its Cargo.lock, or its binary.

[package]
name = "bloch-pos-node"
version = "0.0.1-skeleton"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Bloch Genesis-4 Proof-of-Stake node. SKELETON: boots, self-checks frozen consensus parameters, and exits. No consensus loop, no networking, no storage yet."
publish = false

# Standalone: NOT a member of the node workspace. The Genesis-3 node must not
# gain this crate as a dependency, and this crate must not drag the Genesis-3
# node's lockfile. Integration direction is one-way and by path: this binary
# consumes the pure consensus crate (and later bloch-crypto), never the
# reverse.
#
# LICENSE BLOCKER (BLOCH-POS-NODE-INTEGRATION.md §8.4): bloch-crypto is
# AGPL-3.0-or-later, and AGPL contaminates the whole binary. The `license`
# above is only valid while this crate links nothing AGPL. The founder/PMO
# ruling — ship the node AGPL, or re-extract the PQ verify surface under a
# compatible license — must be recorded BEFORE a bloch-crypto dependency is
# added here, not after.
[workspace]

[[bin]]
name = "bloch-pos"
path = "src/main.rs"

[dependencies]
# The frozen consensus math. The ONLY dependency of the skeleton, on purpose:
# every later dependency (rocksdb, libp2p, bloch-crypto, tokio) lands in the
# milestone that needs it, per BLOCH-POS-NODE-INTEGRATION.md §6, so the
# dependency tree grows in reviewable steps instead of arriving all at once.
bloch-pos-committee = { path = "../bloch-pos-committee" }
