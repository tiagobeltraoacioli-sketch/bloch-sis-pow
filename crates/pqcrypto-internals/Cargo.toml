[package]
name = "pqcrypto-internals"
version = "0.2.11"
edition = "2021"
description = "Vendored fork of pqcrypto-internals 0.2.11 (bindings to PQClean C code) with ONE change: PQCRYPTO_RUST_randombytes consults a thread-local seeded RNG before OS entropy, so ML-DSA-65/Falcon keygen is deterministic from a 32-byte seed. The root workspace patches crates-io to this path; bloch-crypto's Wallet::from_seed depends on it, which puts it under the live Genesis-4 signature path."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Groundstate100/pqcrypto-fork"

links = "pqcrypto_internals"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
getrandom_wasm_js = ["getrandom/wasm_js"]

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }
dunce = "1.0"

[dependencies]
getrandom = "0.3"
# GroundState fork: deps added for thread-local seeded RNG override.
# See src/lib.rs module doc for rationale (BIP39-style wallet recovery,
# audit C-2). Both crates are small and widely audited.
rand_chacha = { version = "0.9", default-features = false }
rand_core  = { version = "0.9", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm32-unknown-unknown-openbsd-libc = "0.2"
