[package]
name = "coherence-spend-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# SP1 guest — built with `cargo prove build`, NOT the node's cargo build.

# Resolve independently, including when built from a restricted Docker context.
[workspace]

[dependencies]
# Match the pinned cargo-prove and service SDK versions.
sp1-zkvm = "=4.2.1"  # EXACT pin: match sp1-sdk in script/service
# Shared statement; see ../AUTHORIZATION-BLOCKER.md before any activation.
coherence-core = { path = "../../coherence-core" }
