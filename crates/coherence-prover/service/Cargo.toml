[package]
name = "coherence-prover-service"
version = "0.1.0"
edition = "2021"
# HTTP DELEGATED prover service — deployed on a server (Fly.io GPU) where the
# SP1 toolchain is installed. NOT built by the node's cargo build (the root
# workspace excludes crates/coherence-prover); member of ../Cargo.toml.
#
# PRIVACY: whoever runs this service SEES THE FULL WITNESS of every /prove
# request — notes, values, nullifier keys. See ../README.md and
# deploy/sp1-prover/README.md before pointing any wallet at a box you do not
# control.

[dependencies]
# =6.5.0 must match the guest toolchain (sp1up v6.5.0). default-features =
# false is load-bearing (alloy-consensus 0.14 vs serde >= 1.0.228 — see
# ../script/Cargo.toml); `blocking` gates the synchronous API.
sp1-sdk = { version = "=6.5.0", default-features = false, features = ["blocking"] }
coherence-core = { path = "../../coherence-core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
bincode = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# GPU proving via SP1's CUDA backend — enable in the GPU Docker build.
# CPU proving is the default (slower; fine for a low-volume testnet).
cuda = ["sp1-sdk/cuda"]
