[package]
name = "bloch-pos-committee"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Bloch Genesis-4 consensus core — the state transition, LMD-GHOST fork choice, FFG finality, epoch committees and proposer schedule, RANDAO, staking, slashing rules that are complete but still UNREACHABLE from the network until an unarmed flag day (since 2026-09-05 evidence decodes, and the transaction is consensus-refused below SLASHING_EVIDENCE_ACTIVATION_EPOCH = u64::MAX), and tokenomics V4. This is the live chain's consensus, running mainnet since 2026-08-13. UNAUDITED by any third party."
publish = false

# Member of the root workspace since Genesis-4 became the trunk. It was
# standalone while PoS could not affect the live PoW validation path; keeping it
# standalone now would mean `cargo test --workspace` silently skips the entire
# consensus layer — the opposite of what an audit needs.

[features]
# Phase timers for the replay benchmark (src/perf.rs). OFF by default and off
# in every release the fleet runs: with the feature absent the span type is
# zero-sized with no Drop and every call site disappears. Never enable it on a
# node that is producing.
perf-timing = []

[dependencies]
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = "0.4"

# SHA3/Keccak dev-profile overrides live in the root Cargo.toml, the only
# location Cargo honors for workspace members.
