[package]
name = "bloch-pos-committee"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Bloch Genesis-4 consensus core — the state transition, LMD-GHOST fork choice, FFG finality, epoch committees and proposer schedule, RANDAO, staking, slashing rules that are complete but UNREACHABLE from the network (evidence is undecodable on every ingress path), and tokenomics V4. This is the live chain's consensus, running mainnet since 2026-08-13. UNAUDITED by any third party."
publish = false

# Member of the root workspace since Genesis-4 became the trunk. It was
# standalone while PoS could not affect the live PoW validation path; keeping it
# standalone now would mean `cargo test --workspace` silently skips the entire
# consensus layer — the opposite of what an audit needs.

[features]
# Phase timers for the replay benchmark (src/perf.rs). OFF by default and off
# in every release the fleet runs: with the feature absent the span type is
# zero-sized with no Drop and every call site disappears. Never enable it on a
# node that is producing.
perf-timing = []

[dependencies]
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = "0.4"

# The suite walks 8,192-step SHAKE-256 reveal chains and 256-deep SMTs, so an
# unoptimized Keccak permutation puts tens of seconds on `cargo test`. Optimize
# only the hash dependencies under dev; this crate's own code keeps full debug.
#
# INERT AS WRITTEN. This was valid while the crate was its own workspace root.
# It is now a member of the root workspace, and cargo ignores `[profile.*]` in
# anything but the workspace root — it warns and moves on. Kept, unchanged and
# labelled, rather than moved: relocating it to the root Cargo.toml changes the
# dev profile for every crate in the tree, which is a build-configuration
# decision, not a documentation fix. `cargo test -p bloch-pos-committee` is
# correspondingly slower than it was.
[profile.dev.package.sha3]
opt-level = 3

[profile.dev.package.keccak]
opt-level = 3
