[package]
name = "bloch-pos-committee"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Bloch Genesis-4 consensus core — the state transition, LMD-GHOST fork choice, FFG finality, epoch committees and proposer schedule, RANDAO, staking and slashing, and tokenomics V4. This is the live chain's consensus, running mainnet since 2026-08-13. UNAUDITED by any third party."
publish = false

# Member of the root workspace since Genesis-4 became the trunk. It was
# standalone while PoS could not affect the live PoW validation path; keeping it
# standalone now would mean `cargo test --workspace` silently skips the entire
# consensus layer — the opposite of what an audit needs.

[features]
# Phase timers for the replay benchmark (src/perf.rs). OFF by default and off
# in every release the fleet runs: with the feature absent the span type is
# zero-sized with no Drop and every call site disappears. Never enable it on a
# node that is producing.
perf-timing = []

[dependencies]
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = "0.4"

# The dev-profile hash optimization these lines used to carry now lives in the
# ROOT Cargo.toml, which is the only manifest cargo reads `[profile.*]` from.
# It was inert here for as long as this crate has been a workspace member; see
# the root manifest for the measurement that justified moving it.
