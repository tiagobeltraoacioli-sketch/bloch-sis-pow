[package]
name = "bloch-pos-committee"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Bloch Genesis-4 consensus core — the state transition, LMD-GHOST fork choice, FFG finality, epoch committees and proposer schedule, RANDAO, staking and slashing, and tokenomics V4. This is the live chain's consensus, running mainnet since 2026-08-13. UNAUDITED by any third party."
publish = false

# Member of the root workspace since Genesis-4 became the trunk. It was
# standalone while PoS could not affect the live PoW validation path; keeping it
# standalone now would mean `cargo test --workspace` silently skips the entire
# consensus layer — the opposite of what an audit needs.

[features]
# Phase timers for the replay benchmark (src/perf.rs). OFF by default and off
# in every release the fleet runs: with the feature absent the span type is
# zero-sized with no Drop and every call site disappears. Never enable it on a
# node that is producing.
perf-timing = []

[dependencies]
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = "0.4"

# The 8,192-step SHAKE-256 reveal chains and 256-deep SMTs in this suite are
# dominated by the Keccak permutation. The `[profile.dev.package.sha3]` and
# `[profile.dev.package.keccak]` overrides that used to sit HERE were inert:
# cargo honours `[profile.*]` only in the workspace root manifest, and this
# crate stopped being its own root. They now live in the root Cargo.toml.
#
# The note they carried claimed moving them "changes the dev profile for every
# crate in the tree". That was wrong, and measurement settled it: a
# `profile.dev.package.<dep>` override changes how those two DEPENDENCIES are
# compiled and nothing else — this crate's own code keeps full debug, and
# `opt-level` does not touch `overflow-checks`, which is the one profile
# setting the root manifest identifies as consensus-critical.
