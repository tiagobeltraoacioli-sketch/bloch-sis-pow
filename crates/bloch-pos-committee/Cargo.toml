[package]
name = "bloch-pos-committee"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Bloch PoS — per-slot fork-choice subcommittee and epoch finality committee: deterministic stake-weighted sampling, attestation types, and LMD-GHOST weight accumulation. UNAUDITED, not wired into the node."
publish = false

# Member of the root workspace since Genesis-4 became the trunk. It was
# standalone while PoS could not affect the live PoW validation path; keeping it
# standalone now would mean `cargo test --workspace` silently skips the entire
# consensus layer — the opposite of what an audit needs.

[dependencies]
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
hex = "0.4"

# The suite walks 8,192-step SHAKE-256 reveal chains and 256-deep SMTs, so an
# unoptimized Keccak permutation puts tens of seconds on `cargo test`. Optimize
# only the hash dependencies under dev; this crate's own code keeps full debug.
# (Valid here because this crate is its own workspace root — see [workspace].)
[profile.dev.package.sha3]
opt-level = 3

[profile.dev.package.keccak]
opt-level = 3
