[package]
name = "bloch-pos-committee"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Bloch Genesis-4 consensus core: state transition, LMD-GHOST fork choice, FFG finality, committees, RANDAO, staking and tokenomics. Candidate lifecycle epoch 2884 is scheduled for 2026-09-14; evidence penalties are gated until that epoch. A source schedule does not establish deployed network readiness. UNAUDITED by any third party."
publish = false

# Member of the root workspace since Genesis-4 became the trunk. It was
# standalone while PoS could not affect the live PoW validation path; keeping it
# standalone now would mean `cargo test --workspace` silently skips the entire
# consensus layer — the opposite of what an audit needs.

[features]
# Opt-in local rehearsal only. No PosTransaction variant, block-root change or
# node activation; default node builds retain their original SHA3-only core.
native-dex-rehearsal = ["dep:bloch-euvm"]
# Phase timers for the replay benchmark (src/perf.rs). OFF by default and off
# in every release the fleet runs: with the feature absent the span type is
# zero-sized with no Drop and every call site disappears. Never enable it on a
# node that is producing.
perf-timing = []
local-state-cache = ["dep:serde", "dep:bincode"]
# DEVELOPMENT NETWORKS ONLY. Arms RANDAO re-commits from genesis (all other
# lifecycle gates unchanged). A node built with it refuses non-BPOSMAN3
# manifests. Never enable it for Genesis-4 or any funded network.
devnet-randao-recommit = []
# DEVELOPMENT NETWORKS ONLY. Native L2 deposits: escrowed BLCH appended to the
# L2 inbox, and settlements must mint exactly the consumed inbox records.
devnet-l2-deposits = []
# DEVELOPMENT NETWORKS ONLY. Admits settlement V3 statements with
# user_tx_count > 0. Without it the native verifier refuses them
# (Reject::UserTransactions) until L1 data availability (M3) exists.
devnet-l2-user-txs = ["devnet-l2-deposits"]
# QUALIFICATION BUILDS ONLY (mixed-fleet rehearsal of the L2 flag day, M9).
# Arms params::L2_SETTLEMENT_ACTIVATION_EPOCH at the compile-time value of
# BLOCH_L2_REHEARSAL_ACTIVATION_EPOCH with a rehearsal policy bound to the
# running network. The node refuses the Genesis-4 mainnet manifest and any
# manifest with a carryover. Never ship it.
l2-activation-rehearsal = []
# QUALIFICATION BUILDS ONLY: the rehearsal above, installing the approved
# mainnet policy values (chain id 700770, async, mainnet limits, attestor set)
# instead of the development ones. Final qualification only. Never ship it.
l2-activation-rehearsal-mainnet-policy = ["l2-activation-rehearsal"]
# QUALIFICATION BUILDS ONLY (HF2 sigdet GO criterion). Sets
# params::MLDSA_PIN_ACTIVATION_EPOCH = 0 so a full-history replay judges every
# ML-DSA half with the pinned FIPS 204 verifier. Replay copies only; never ship.
mldsa-pin-replay-qualification = []

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1.3.3", optional = true }
bloch-euvm = { path = "../bloch-euvm", optional = true }
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
bloch-l2-proof = { path = "../bloch-l2-proof" }
hex = "0.4"
serde_json = "1.0"

# SHA3/Keccak dev-profile overrides live in the root Cargo.toml, the only
# location Cargo honors for workspace members.
