# bloch-euvm — FOUNDATION / step 1 of the native eUTXO contract VM (design §5-quater).
# Workspace library, NOT wired into live Genesis-4 consensus. Legacy Genesis-3
# integration is behind its off-by-default `euvm` feature. bloch-ustav supplies
# the concrete crypto adapter for this crate's separate v3 native-token kernel.
[package]
name = "bloch-euvm"
version = "0.0.1"
edition = "2021"
description = "Minimal deterministic eUTXO validator VM for Bloch (foundation, not consensus-wired)"
license = "AGPL-3.0-or-later"

[dependencies]
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
serde_json = "1.0"
