# bloch-euvm — FOUNDATION / step 1 of the native eUTXO contract VM (design §5-quater).
# STANDALONE and NOT wired into node consensus. The empty [workspace] table keeps it
# A node workspace member, but only an OPTIONAL dep behind the off-by-default
# `euvm` feature — with the feature off it is not compiled into the node binary.
[package]
name = "bloch-euvm"
version = "0.0.1"
edition = "2021"
description = "Minimal deterministic eUTXO validator VM for Bloch (foundation, not consensus-wired)"
license = "MIT"

[dependencies]
sha2 = "0.10"
sha3 = "0.10"
