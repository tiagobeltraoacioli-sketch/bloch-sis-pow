[package]
name = "bloch-ustav"
version = "0.2.0"
edition = "2021"
description = "PQ-only Ustav native-token authorization kernel (not consensus-wired)"
license = "AGPL-3.0-or-later"

[features]
# Explicit local persistence host; never enabled by default or by the live node.
native-dex-host = ["dep:bloch-pos-committee"]

[dependencies]
bloch-euvm = { path = "../bloch-euvm" }
bloch-pos-committee = { path = "../bloch-pos-committee", features = ["native-dex-rehearsal"], optional = true }
bloch-crypto = { path = "../bloch-crypto", default-features = false }

[dev-dependencies]
bloch-pos-committee = { path = "../bloch-pos-committee", features = ["native-dex-rehearsal"] }
serde_json = "1.0"
sha3 = "0.10"
