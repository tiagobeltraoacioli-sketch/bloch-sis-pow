# VENDOR.toml — hash pin for the vendored fips205 0.4.1 sources.
#
# Every file listed here is byte-identical to the crates.io package
# fips205 0.4.1 (.crate sha256 2f5626bf5534df4ebdbd2536465d7eaa8a9dc2cdeb7e036e0ecf291dcc80ffb6,
# upstream git a9b02e92cdf9169db537027f23dbe570ec35f6a4) as extracted by cargo
# after its registry checksum check on 2026-10-20. Only Cargo.toml (see its
# header) and the tests/ directory are local.
#
# `tests/vendor_pin.rs` recomputes these hashes on every `cargo test` and also
# fails if a file appears under src/ without a pin, so the algorithm code
# cannot change without an explicit re-pin in the same commit. Changing a pin
# is a crypto-review event: re-run the FIPS 205 ACVP vectors
# (bloch-crypto tests/acvp_slhdsa.rs) and say why in the commit message.

