[package]
name = "bloch-mldsa-clean"
version = "0.1.0"
edition = "2021"
authors = ["Bloch-SIS Protocol"]
description = "Bloch consensus ML-DSA-65: safe wrappers pinning verify/sign to PQClean's portable `clean` implementation on every platform"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/bloch-protocol/bloch"

[dependencies]
# Same exact pin as bloch-crypto (I-4). `default-features = false`: this crate
# never needs the AVX2/AArch64 backends; it calls `PQCLEAN_MLDSA65_CLEAN_*`
# directly, so the result is the same even if some other crate's features
# unify the SIMD backends back into the build.
pqcrypto-mldsa = { version = "=0.1.2", default-features = false, features = ["std"] }
# Falcon-1024, same exact pin and the same feature set as bloch-crypto: the
# integer-only `clean` implementation alone. This crate hosts the FFI calls
# bloch-crypto forbids itself (`#![forbid(unsafe_code)]`), so key generation
# and signing can run on caller-owned buffers instead of upstream key types
# that are copied and dropped unwiped (review F5).
pqcrypto-falcon = { version = "=0.4.1", default-features = false, features = ["std"] }

[dev-dependencies]
pqcrypto-traits = "0.3"
# The seeded-RNG scope (workspace fork via [patch.crates-io]), so the tests can
# show the wrappers produce the very bytes the pinned crates do.
pqcrypto-internals = "0.2"
