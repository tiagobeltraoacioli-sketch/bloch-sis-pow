[package]
name = "coherence-core"
version = "0.1.0"
edition = "2021"
description = "Bloch Coherence shielded-pool primitives (notes, SHAKE-256 commitments/nullifiers/Merkle, spend statement). Lean + portable, shared by the Genesis-3 node, the SP1 guest prover and the mobile wallet. NOT live on Genesis-4 (proof of stake), which has no shielded pool. Unaudited."
license = "AGPL-3.0-or-later"

[dependencies]
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }

