# Gate constants armed by arm.py in the CANDIDATE copy.
# <constant name> <HF1|HF2|HF3>[+offset]   or   <constant name> =<literal>
# Only declarations whose value is u64::MAX (inert) are rewritten; a gate that
# is already armed with a number is reported and left alone. Aliases
# (`pub const X: u64 = HF2_...;`) follow automatically. Any other
# `HF<n>_*: u64 = u64::MAX` constant is armed at HF<n> as well; numeric HF<n>_*
# constants (e.g. HF1_MAX_GATE_SPACING_EPOCHS) are never touched.
# Names from docs (codex/hf-schedule-20261020 section 0.2) and the branches.

# HF1 — claim finality + frozen finality set (O1: equal), own-target votes (O2: >= FS)
HF1_CLAIM_FINALITY_EPOCH                 HF1
HF1_FROZEN_FINALITY_SET_EPOCH            HF1
NATIVE_CLAIM_FINALITY_ACTIVATION_EPOCH   HF1
NATIVE_FINALITY_SET_ACTIVATION_EPOCH     HF1
HF1_OWN_TARGET_VOTES_EPOCH               HF1+2
NATIVE_OWN_TARGET_ACTIVATION_EPOCH       HF1+2

# HF2 — canonical signatures, slashing evidence pre-admission, growth cap (O5: all equal)
SIG_CANONICAL_ACTIVATION_EPOCH           HF2
HF2_SLASHING_V2_EPOCH                    HF2
NATIVE_SLASHING_ACTIVATION_EPOCH         HF2
HF2_GROWTH_CAP_EPOCH                     HF2
NATIVE_GROWTH_CAP_ACTIVATION_EPOCH       HF2

# HF3 — SLH-DSA suite 0x0003 (O7: crypto and params values equal)
NATIVE_SLHDSA_SUITE_ACTIVATION_EPOCH     HF3
HF3_SLHDSA_SUITE_EPOCH                   HF3
HF3_SLH_SUITE_EPOCH                      HF3

# Rehearsal-only spacing overrides (literal values, rewritten whatever they
# are). The integration line asserts at compile time that HF2 is >= 90 epochs
# after HF1 (schedule O4: a day to ship a replacement release); a 31-epoch
# rehearsal compresses that to the HF1->HF2 gap it uses.
HF2_MIN_EPOCHS_AFTER_HF1                 =4
