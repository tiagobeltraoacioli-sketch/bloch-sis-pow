# KES rehearsal on devnet4 (OWNER-RUN; see devnet4-kes.sh). Use ONLY with
#   arm.py <disposable copy> --no-past --conf kes-devnet4.conf --report r.json
# --no-past: devnet4 has real history; no past flag day may move.
# Fill the two epochs with FUTURE devnet4 epochs (registration >= now + lead
# time for every operator; enforcement >= registration + window) before use.
# No HF1/HF2 gate is armed by this file.
HF3_KES_EPOCH                          =__REGISTRATION_EPOCH__
HF3_KES_ENFORCE_EPOCH                  =__ENFORCE_EPOCH__
KES_MIN_REGISTRATION_WINDOW_EPOCHS     =16
KES_PERIOD_EPOCHS                      =4
!drop-line assert!(KES_PERIOD_EPOCHS * SLOTS_PER_EPOCH * SLOT_DURATION_SECS == 86_400, "a KES period is one day");
KES_MIN_REGISTERED_DEPTH               =4
KES_DEFAULT_DEPTH                      =4
KES_ROTATE_REMAINING_PERIODS           =2
KES_ROTATION_STAGGER_PERIODS           =4
