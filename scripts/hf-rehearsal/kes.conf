# KES rehearsal (test-short parameters) for codex/hf3-kes-20261020, on a
# DISPOSABLE copy only; use with:  arm.py ... --conf gates.conf --conf kes.conf
# Epochs are absolute (the KES rehearsal runs its own schedule).
HF3_KES_EPOCH                          =4
HF3_KES_ENFORCE_EPOCH                  =8
KES_MIN_REGISTRATION_WINDOW_EPOCHS     =4
# One KES period = 2 epochs (mainnet: 90 epochs = 1 day).
KES_PERIOD_EPOCHS                      =2
!drop-line assert!(KES_PERIOD_EPOCHS * SLOTS_PER_EPOCH * SLOT_DURATION_SECS == 86_400, "a KES period is one day");
# Depth 3 = 8 periods = 16 epochs per key lifetime (mainnet min 8, default 12).
KES_MIN_REGISTERED_DEPTH               =3
KES_DEFAULT_DEPTH                      =3
# Rotate when <= 1 + (index % 2) periods remain (staggered); asserted
# KES_ROTATE_REMAINING_PERIODS + KES_ROTATION_STAGGER_PERIODS < 2^depth / 2.
KES_ROTATE_REMAINING_PERIODS           =1
KES_ROTATION_STAGGER_PERIODS           =2

# Rehearsal copy only: one node can be given a forward clock offset (scenario 5).
!clock-offset-env
