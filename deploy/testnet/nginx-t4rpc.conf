# ── t4rpc: public JSON-RPC front for the Genesis-4 testnet ──────────────────
# Install as /etc/nginx/sites-available/t4rpc (symlink into sites-enabled).
# Listens on LOOPBACK only; the public edge is a cloudflared tunnel pointing
# at http://127.0.0.1:8788 — no inbound port is opened on the host.
#
# WHY NGINX AT ALL: the node's RPC emits no CORS headers and has no auth.
# This front adds CORS (so the wallet/browser tooling can call it), answers
# preflights, and multiplexes the four co-located validators.
#
# WHY THE UPSTREAMS ARE SHAPED THIS WAY — the mainnet lesson (2026-08):
# the g4rpc proxy's upstream list named nodes by bare port number; when
# validators moved hosts every entry died SILENTLY and reads served nothing.
# Here (a) every upstream lives on THIS host, on ports written by the same
# script that writes the validators' systemd units, so an upstream cannot
# "move away" without this file being wrong on the same machine — visibly;
# (b) max_fails/fail_timeout + proxy_next_upstream fail over on a dead node
# instead of serving silence; (c) the t4-health timer (bloch-t4-health.*)
# probes each upstream BY PORT every 5 min and writes /health, so a dead
# upstream is a visible fact, never a quiet one.
# ── RATE LIMITING AND CLIENT IDENTITY ───────────────────────────────────────
# The node's own JSON-RPC has NO authentication, NO authorisation and NO rate
# limiting. It must never face the internet directly; this front is the only
# thing between it and the public, so the limiting has to live here.
#
# WHY real_ip IS LOAD-BEARING, NOT COSMETIC: this server listens on loopback
# and the public edge is a cloudflared tunnel, so EVERY request arrives from
# 127.0.0.1. Keying a limit on $binary_remote_addr without the rewrite below
# would put the entire internet in ONE bucket — the first partner polling a
# balance would rate-limit everybody else, and a single abuser would take the
# endpoint down for every integrator. The rewrite makes the key the real
# client.
#
# Trusting a client-supplied header is normally a way to get spoofed. It is
# safe HERE, and only here, for a specific reason: nothing but cloudflared can
# reach 127.0.0.1:8788, and cloudflared overwrites CF-Connecting-IP with the
# connection's real source. If this server is ever moved to a public
# interface, this trust becomes a hole — delete it in the same commit.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# 5 r/s sustained, burst 20 absorbed without delay. Sized against the honest
# client the onboarding doc describes: the chain moves every 30 s and partners
# are asked not to poll faster than ~5 s, so 5 r/s is ~25x an honest polling
# loop and still refuses a scraper. 10m of zone holds ~160k distinct IPs.
limit_req_zone $binary_remote_addr zone=t4rpc_req:10m rate=5r/s;

# Concurrency cap, which the request-rate limit does not give: 16 in-flight
# requests per client. Without it one client can hold every upstream worker
# open on slow reads and starve the others while staying under 5 r/s.
limit_conn_zone $binary_remote_addr zone=t4rpc_conn:10m;

# 429, not 503: a rate limit is the client's problem to back off from, and
# 503 would tell an integrator the CHAIN is down when it is not.
limit_req_status 429;
limit_conn_status 429;

upstream t4_nodes {
    server 127.0.0.1:18500 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:18501 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:18502 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:18503 max_fails=2 fail_timeout=30s;
}

server {
    listen 127.0.0.1:8788;

    # JSON-RPC is small and quick; anything slow means a dead node — move on.
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503;
    client_max_body_size 256k;   # a hybrid-signed TransferV1 is < 10 KB hex

    location = /health {
        default_type application/json;
        alias /home/ubuntu/t4/health.json;   # written by t4-health.sh
        add_header Access-Control-Allow-Origin * always;
    }

    # The genesis manifest + digest, for anyone verifying they are on the
    # same testnet (and for future cohort-seat validator partners).
    location = /genesis.blg {
        alias /home/ubuntu/t4/genesis.blg;
        add_header Access-Control-Allow-Origin * always;
    }
    location = /genesis.blg.sha256 {
        default_type text/plain;
        alias /home/ubuntu/t4/genesis.blg.sha256;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        # Applied to the RPC location only: /health and the genesis manifest
        # are static, cacheable and harmless, and an integrator verifying they
        # are on the right testnet should never be throttled for it.
        limit_req zone=t4rpc_req burst=20 nodelay;
        limit_conn t4rpc_conn 16;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type" always;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://t4_nodes;
        proxy_set_header Host $host;
    }
}
