# ── t4rpc: public JSON-RPC front for the Genesis-4 testnet ──────────────────
# Install as /etc/nginx/sites-available/t4rpc (symlink into sites-enabled).
# Listens on LOOPBACK only; the public edge is a cloudflared tunnel pointing
# at http://127.0.0.1:8788 — no inbound port is opened on the host.
#
# WHY NGINX AT ALL: the node's RPC emits no CORS headers and has no auth.
# This front adds CORS (so the wallet/browser tooling can call it), answers
# preflights, and multiplexes the four co-located validators.
#
# WHY THE UPSTREAMS ARE SHAPED THIS WAY — the mainnet lesson (2026-08):
# the g4rpc proxy's upstream list named nodes by bare port number; when
# validators moved hosts every entry died SILENTLY and reads served nothing.
# Here (a) every upstream lives on THIS host, on ports written by the same
# script that writes the validators' systemd units, so an upstream cannot
# "move away" without this file being wrong on the same machine — visibly;
# (b) max_fails/fail_timeout + proxy_next_upstream fail over on a dead node
# instead of serving silence; (c) the t4-health timer (bloch-t4-health.*)
# probes each upstream BY PORT every 5 min and writes /health, so a dead
# upstream is a visible fact, never a quiet one.
upstream t4_nodes {
    server 127.0.0.1:18500 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:18501 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:18502 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:18503 max_fails=2 fail_timeout=30s;
}

server {
    listen 127.0.0.1:8788;

    # JSON-RPC is small and quick; anything slow means a dead node — move on.
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503;
    client_max_body_size 256k;   # a hybrid-signed TransferV1 is < 10 KB hex

    location = /health {
        default_type application/json;
        alias /home/ubuntu/t4/health.json;   # written by t4-health.sh
        add_header Access-Control-Allow-Origin * always;
    }

    # The genesis manifest + digest, for anyone verifying they are on the
    # same testnet (and for future cohort-seat validator partners).
    location = /genesis.blg {
        alias /home/ubuntu/t4/genesis.blg;
        add_header Access-Control-Allow-Origin * always;
    }
    location = /genesis.blg.sha256 {
        default_type text/plain;
        alias /home/ubuntu/t4/genesis.blg.sha256;
        add_header Access-Control-Allow-Origin * always;
    }

    location / {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type" always;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://t4_nodes;
        proxy_set_header Host $host;
    }
}
