# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Alerting rules for a Bloch validator/archival node. Metric names below are
# read from crates/bloch-pos-node/src/metrics.rs as shipped (verify against
# that file if this rule set and the binary ever drift). Validator-only
# alerts require a role="validator" TARGET label, not an external label.
#
# SLOTS_PER_EPOCH = 32 (crates/bloch-pos-committee/src/params.rs), block time
# target 30s (crates/bloch-crypto/src/core/mod.rs; also
# crates/bloch-pos-committee/src/tokenomics_v4.rs SLOTS_PER_DAY = 2,880) =>
# one epoch ~= 32 * 30s = 960s = 16 min. "3 epochs" below = 2,880s = 48 min;
# "2 epochs" = 1,920s / 64 slots.

groups:
  - name: bloch-pos-node.rules
    rules:
      # ── Finality stall: finalized_epoch not advancing for > 3 epochs ──
      # The finality clock starts after replay/WS checks and is zero before
      # the live loop. Gate that sentinel out: startup has its own heartbeat
      # alert and must not look like an eternal finality stall.
      - alert: BlochFinalityStalled
        expr: >
          (bloch_pos_last_finality_advance_unix > 0)
          and (time() - bloch_pos_last_finality_advance_unix > (3 * 32 * 30))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Finalized epoch has not advanced in over 3 epochs (~48 min) on {{ $labels.host_id }}"
          description: >
            bloch_pos_last_finality_advance_unix has not moved for more than
            3 epochs. Cross-check bloch_pos_finalized_epoch against a second,
            independently-operated node before assuming this is local — a
            fleet-wide stall and a local one look identical from here alone.

      # ── Finality rewinds refused > 0 ──
      - alert: BlochFinalityRewindRefused
        expr: increase(bloch_pos_finality_rewinds_refused_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A finality rewind was refused on {{ $labels.host_id }} (M-1)"
          description: >
            The engine's downward finality ratchet refused a rewind — per
            Round-3 audit M-1, this can mean the node has deleted blocks from
            its own canonical branch and will refuse them again on re-sync, a
            possible persistent partition. Compare finalized roots with an
            independent node before taking recovery action.

      # ── Equivocations observed > 0 ──
      - alert: BlochEquivocationObserved
        expr: increase(bloch_pos_equivocations_observed_total[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "An equivocation was observed on {{ $labels.host_id }}"
          description: >
            A validator produced two conflicting attestations/proposals for
            the same slot — the exact condition slashing exists to punish and
            the 2026-08-21 double-sign incident produced. Investigate the
            validator identity and preserve the evidence.

      # ── Head slot lagging wall slot by > 2 epochs ──
      - alert: BlochHeadLaggingWallClock
        expr: bloch_pos_behind_by_slots > (2 * 32)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host_id }} is more than 2 epochs (64 slots) behind the wall clock"
          description: >
            bloch_pos_behind_by_slots > 64. On a healthy node this gauge is
            0-1 (metrics.rs). Check bloch_pos_is_syncing — if 1, this may be
            an expected catch-up; if 0 and lagging, the slot loop may be
            wedged without having crossed the /health staleness threshold yet.

      # ── Peer count < 2 ──
      - alert: BlochPeerCountLow
        expr: bloch_pos_peer_count < 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host_id }} has fewer than 2 peers"
          description: >
            bloch_pos_peer_count < 2 for 10 minutes. A node with 0-1 peers
            cannot reliably distinguish "the network is fine and I am
            isolated" from "the network has a problem" — treat as urgent if
            it persists alongside BlochHeadLaggingWallClock or a finality
            stall.

      # ── Disk free < 10% ──
      # bloch_pos_data_dir_fs_free_bytes has no matching *_size_bytes series
      # (metrics.rs exports free bytes only), so a percentage cannot be
      # computed from the node's own metric — use node_exporter's filesystem
      # collector for the mountpoint holding the data directory instead. The
      # mountpoint placeholder MUST be set to the data dir's actual mount.
      - alert: BlochDiskFreeBelow10Percent
        expr: >
          (node_filesystem_avail_bytes{mountpoint="REPLACE_ME_DATA_DIR_MOUNTPOINT"}
           / node_filesystem_size_bytes{mountpoint="REPLACE_ME_DATA_DIR_MOUNTPOINT"}) < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk free below 10% on {{ $labels.host_id }} (data dir mountpoint)"
          description: >
            The disk-full incident (metrics.rs module doc: "disk-full") is
            fatal by design — the node exits rather than diverging RAM from
            disk on a failed append. This alert exists to fire well before
            that exit. Also watch bloch_pos_store_append_failures_total > 0
            as the point-of-no-return signal if this alert was missed.
        # Supplementary, node-reported, no percentage available:
        # bloch_pos_data_dir_fs_free_bytes (gauge, bytes only).

      # ── Clock drift (node_exporter NTP metrics) ──
      - alert: BlochClockDrift
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Clock offset on {{ $labels.host_id }} exceeds 500ms"
          description: >
            node_timex_offset_seconds from node_exporter's NTP collector.
            Slot assignment and attestation timing are wall-clock-relative;
            drift here degrades bloch_pos_behind_by_slots readings and can
            cause a validator to miss its slot even while otherwise healthy.

      # ── keystore_sealed == 0 ──
      - alert: BlochKeystoreNotSealed
        expr: >
          (bloch_pos_keystore_sealed{role="validator"} == 0)
          and on(job, instance) (bloch_pos_heartbeat_unix > 0)
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host_id }} is running with an unsealed (plaintext) keystore"
          description: >
            After startup, the node reports an opted-in plaintext validator
            keystore. The heartbeat gate excludes the initial unset gauge.
            Arrange explicit sealing using the keystore runbook; do not
            replace its public identity or restart automatically.

      - alert: BlochMetricsUnavailable
        expr: up{job="bloch-pos-node"} == 0 or absent(up{job="bloch-pos-node"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node metrics scrape is unavailable"
          description: "Check the process and configured metrics port. Other alerts cannot observe an unreachable exporter."

      - alert: BlochHeartbeatMissing
        expr: up{job="bloch-pos-node"} == 1 unless on(job, instance) bloch_pos_heartbeat_unix
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Reachable exporter omits the engine heartbeat"
          description: "Check the running binary and scrape endpoint; missing series are not a healthy zero."

      - alert: BlochHeartbeatStale
        expr: >
          ((bloch_pos_heartbeat_unix > 0) and (time() - bloch_pos_heartbeat_unix > 120))
          or ((bloch_pos_heartbeat_unix == 0) and (time() - bloch_pos_process_start_unix > 1200))
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Engine heartbeat is stale or startup exceeds 20 minutes"
          description: "Inspect replay progress, head lag and health status before intervening. Do not restart automatically from this alert."

      - alert: BlochStoreAppendFailure
        expr: bloch_pos_store_append_failures_total > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Node could not persist canonical chain data"
          description: "Check disk capacity, filesystem errors and process logs. Fatal exit may precede the next scrape, so this counter alert is best-effort. Preserve chain and signing protection files."

      - alert: BlochValidatorInactive
        expr: (bloch_pos_validator_active{role="validator"} == 0) and (time() - bloch_pos_process_start_unix > 1200)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Expected validator remains inactive after startup grace"
          description: "The key is not epoch-eligible or startup/doppelganger gates block participation. Check registry and signing logs. This is not a missed-duty count. Archival nodes must use role=archival."

      - alert: BlochRepeatedRestarts
        expr: changes(bloch_pos_process_start_unix[30m]) >= 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "At least three observed process restarts in 30 minutes"
          description: "Inspect OOM, disk, checkpoint and startup errors. Restarts entirely between scrapes may be missed."
