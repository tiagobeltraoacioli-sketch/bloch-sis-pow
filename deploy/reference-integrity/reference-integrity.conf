# reference-integrity.conf — the ONLY static thing in this directory, and it
# holds only what we own and expect to keep: the hosts we pay for and the key
# that reaches them. Everything else (which validators exist, which ports they
# serve, who should peer with whom) is DERIVED at run time by inventory.sh.
#
# Rule of thumb for editing this file: if an entry could stop being true
# without anybody typing a command, it does not belong here.

KEY=$HOME/.ssh/edgevana_fleet_g4
SSH_USER=ubuntu
SSH_TIMEOUT=15

# Hosts we rent. Validators are NOT listed — they are discovered on these.
FLEET="139.84.201.52 139.84.202.139 139.84.204.46 139.84.205.54 149.28.180.128 67.219.108.230 67.219.108.96"
ARCHIVAL="139.180.166.5 139.180.173.231"

# Port conventions (used only to CLASSIFY what was discovered, never to assume
# something exists).
RPC_BASE=16400
P2P_BASE=19000
OBSERVER_LISTEN=19100

# Public edge. PROXY_JS is the file whose upstream list must agree with the
# fleet; PROXY_URL is the end-to-end check.
PROXY_JS=$HOME/dev/posternlabs-deploy/functions/g4rpc.js
PROXY_URL=https://posternlabs.com/g4rpc

# Detector thresholds.
BEHIND_OK=4              # slots behind the fleet median before a node is "late"
DEAD_PEER_FAIL=1         # >= this many dead dials in a unit == FAILURE, not a note.
                         # It was a "warning" before, and the warning was ignored
                         # for the nine hours it took to notice.
MIN_LIVE_FRACTION=95     # % of derived live endpoints a unit must actually carry
STATE_DIR=$HOME/.bloch-reference-integrity

# Which endpoints a unit SHOULD dial. 'validators' (default) matches what the
# fleet carries today, so a cleanup is a pure deletion and therefore trivially
# reversible. 'all' would also dial the observer/archival tier — an ADDITION,
# and thus a topology decision, not a cleanup. Change it on purpose or not at all.
PEER_SCOPE=validators
