# Fly.io deployment for the Coherence SP1 prover (GPU, scale-to-zero).
#
#   fly launch --config deploy/sp1-prover/fly.toml --no-deploy   # create app
#   fly volumes create sp1_artifacts --size 20 --region ord      # artifact cache
#   fly secrets set PROVER_AUTH_TOKEN=$(openssl rand -hex 32)     # guard /prove
#   fly deploy  --config deploy/sp1-prover/fly.toml --dockerfile deploy/sp1-prover/Dockerfile
#
# GPU machines live in select regions (e.g. ord/iad) — NOT gru. Proving is a
# heavy, bursty job, so the machine scales to ZERO when idle and cold-starts on
# the next /prove (you pay GPU only while proving).

app = "bloch-sp1-prover"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"
  PORT = "8080"
  SP1_HOME = "/data/.sp1"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: stop when idle, auto-start on an incoming request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Proving is one big job per machine — admit one at a time; add machines to
  # scale out concurrency rather than overloading a GPU.
  [http_service.concurrency]
    type = "requests"
    hard_limit = 1
    soft_limit = 1

  # Fly health check hits /health (cheap; does not wake heavy proving).
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

# GPU machine. L40S balances price/VRAM for SP1; step up to a100-40gb/80gb for
# larger circuits. CPU-only fallback: drop this block + build with CUDA_FEATURE="".
[[vm]]
  gpu_kind = "l40s"
  gpus = 1
  cpu_kind = "performance"
  cpus = 8
  memory = "32gb"

# Persist SP1's circuit-artifact / proving-key cache (GBs) so cold starts are
# fast and don't re-download on every wake.
[mounts]
  source = "sp1_artifacts"
  destination = "/data"
