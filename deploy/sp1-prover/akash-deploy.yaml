# Akash SDL — Coherence SP1 prover (GPU) for Bloch shielded transactions (roadmap P1).
# Manual deploy: paste this into the Akash Console (console.akash.network) → Deploy,
# or `provider-services tx deployment create akash-deploy.yaml --from <wallet>`.
#
# PREREQUISITE — Akash pulls a PRE-BUILT image, it does not build the Dockerfile.
# Build + push the prover image to a PUBLIC registry first (from repo root):
#   docker build -f deploy/sp1-prover/Dockerfile -t <registry>/bloch-sp1-prover:latest .
#   docker push <registry>/bloch-sp1-prover:latest
# then set `image:` below. (CPU-only fallback: build with --build-arg CUDA_FEATURE=""
# and drop the `gpu:` block in the profile.)
#
# SECURITY (Round-2 audit P123 P-3) — /prove receives the FULL PRIVATE WITNESS:
#   * The prover is NOT exposed to the internet. Only the `tls` sidecar (Caddy,
#     automatic Let's Encrypt) can reach it; Caddy sets x-forwarded-proto: https,
#     which the service REQUIRES (plaintext requests are rejected with 426).
#   * No PROVER_AUTH_TOKEN placeholder ships in this file. The service REFUSES
#     TO START without a real token (and rejects CHANGE_ME…/short values), so a
#     deploy that forgets the token fails loudly instead of serving open.
#     At deploy time, add under services.prover.env (Console lets you edit):
#         - PROVER_AUTH_TOKEN=<output of: openssl rand -hex 32>
#     and give the same token to the wallet/prover client.
#   * Point DNS for PROVER_DOMAIN at the leased provider's ingress before
#     deploying so Caddy can obtain its certificate.
---
version: "2.0"

services:
  prover:
    # ← replace with your pushed image (Docker Hub / ghcr.io / etc.)
    image: docker.io/YOUR_USER/bloch-sp1-prover:latest
    expose:
      # Internal only: reachable from the TLS sidecar, never `global`.
      - port: 8080
        to:
          - service: tls
    env:
      - RUST_LOG=info
      - PORT=8080
      - SP1_HOME=/data/.sp1
      # PROVER_AUTH_TOKEN: set at deploy time (openssl rand -hex 32) — see the
      # SECURITY note above. INTENTIONALLY absent here: the service fails closed
      # (refuses to start) rather than run unauthenticated with a shipped value.
    params:
      storage:
        artifacts:
          mount: /data          # SP1 proving-key / circuit-artifact cache (GBs)
          readOnly: false

  # TLS termination — Caddy with automatic ACME. The ONLY globally exposed
  # service; forwards to the prover over the deployment-internal network and
  # sets x-forwarded-proto: https (which the prover requires).
  tls:
    image: caddy:2.8-alpine@sha256:af32e97399febea808609119bb21544d0265c58a02836576e32a2d082c262c17
    # ← replace prover.example.com with your domain (DNS → provider ingress).
    command:
      - caddy
      - reverse-proxy
      - --from
      - https://prover.example.com
      - --to
      - http://prover:8080
    expose:
      - port: 443
        as: 443
        to:
          - global: true
        accept:
          - prover.example.com
      - port: 80              # ACME HTTP-01 challenge + https redirect only
        as: 80
        to:
          - global: true
        accept:
          - prover.example.com

profiles:
  compute:
    prover:
      resources:
        cpu:
          units: 8
        memory:
          size: 32Gi
        storage:
          - size: 16Gi          # ephemeral root
          - name: artifacts     # persistent cache → warm cold-starts
            size: 60Gi
            attributes:
              persistent: true
              class: beta3
        gpu:
          units: 1
          attributes:
            vendor:
              nvidia:
                # L40S matches the Fly setup; swap/add models by availability.
                - model: l40s
                - model: a100
                - model: h100
                - model: rtx4090
    tls:
      resources:
        cpu:
          units: 1
        memory:
          size: 512Mi
        storage:
          - size: 1Gi
  placement:
    akash:
      # Optional: restrict to audited providers.
      # attributes:
      #   host: akash
      pricing:
        prover:
          denom: uakt
          amount: 100000        # max uAKT/block bid you'll accept; raise if no bids
        tls:
          denom: uakt
          amount: 1000

deployment:
  prover:
    akash:
      profile: prover
      count: 1
  tls:
    akash:
      profile: tls
      count: 1
