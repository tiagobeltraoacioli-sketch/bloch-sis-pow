# ══════════════════════════════════════════════════════════════════════════════
# GENESIS-3 LOCAL TESTNET — THE PROOF-OF-WORK NODE. NOT THE LIVE CHAIN.
#
# Three `bloch` nodes on a private network, mining against each other. Genesis-3
# stopped at height 39,918 on 2026-08-13; this composes a local proof-of-work
# testnet, not a way to join anything. Kept as part of the Genesis-3 record.
#
# The live chain is Genesis-4, proof of stake, and its binary is `bloch-pos`
# (`cargo build --release -p bloch-pos-node`). There is no compose file for it:
# a validator needs a keystore and a genesis manifest, and handing those to a
# throwaway container is not a pattern this project wants to publish. See
# `docs/GENESIS4-MIGRATION-RUNBOOK.md` and `deploy/RELEASE-INTEGRITY.md`.
# ══════════════════════════════════════════════════════════════════════════════
version: "3.8"

services:
  node1:
    image: bloch:latest  # build locally: docker build -t bloch . — no official registry image is published
    container_name: bloch-node1
    ports:
      - "16210:16210"
      - "16110:16110"
    volumes:
      - node1-data:/bloch-data
    environment:
      - RUST_LOG=info
    command: >
      bloch
      --rpc-bind 0.0.0.0
      --rpc-port 16210
      --listen /ip4/0.0.0.0/tcp/16110
      --data-dir /bloch-data

  node2:
    image: bloch:latest  # build locally: docker build -t bloch . — no official registry image is published
    container_name: bloch-node2
    ports:
      - "16211:16210"
      - "16111:16110"
    volumes:
      - node2-data:/bloch-data
    environment:
      - RUST_LOG=info
    command: >
      bloch
      --rpc-bind 0.0.0.0
      --rpc-port 16210
      --listen /ip4/0.0.0.0/tcp/16110
      --data-dir /bloch-data
      --peer /dns4/node1/tcp/16110
    depends_on:
      - node1

  node3:
    image: bloch:latest  # build locally: docker build -t bloch . — no official registry image is published
    container_name: bloch-node3
    ports:
      - "16212:16210"
      - "16112:16110"
    volumes:
      - node3-data:/bloch-data
    environment:
      - RUST_LOG=info
    command: >
      bloch
      --rpc-bind 0.0.0.0
      --rpc-port 16210
      --listen /ip4/0.0.0.0/tcp/16110
      --data-dir /bloch-data
      --peer /dns4/node1/tcp/16110
    depends_on:
      - node1

volumes:
  node1-data:
  node2-data:
  node3-data:
