---
# Akash SDL — Bloch-SIS mining node, 16-CPU profile.
#
# Smaller-footprint variant of deploy.yaml: many Akash providers cannot
# schedule a single 40-core pod ("Insufficient cpu"), so this asks for 16
# cores, which schedules on far more providers. Drop to 8 if 16 still fails.

version: "2.0"

services:
  bloch-node:
    image: docker.io/blochv/bloch:0.1
    args:
      - "--rpc-bind"
      - "0.0.0.0"
      - "--rpc-port"
      - "16210"
      - "--listen"
      - "/ip4/0.0.0.0/tcp/16110"
      - "--data-dir"
      - "/bloch-data"
      - "--mine"
    env:
      - RUST_LOG=info
    expose:
      - port: 16110
        as: 16110
        proto: tcp
        to:
          - global: true
      - port: 16210
        as: 16210
        proto: tcp
        to:
          - global: true
    params:
      storage:
        chaindata:
          mount: /bloch-data
          readOnly: false

profiles:
  compute:
    bloch-node:
      resources:
        cpu:
          units: 16
        memory:
          size: 8Gi
        storage:
          - size: 8Gi
          - name: chaindata
            size: 30Gi
            attributes:
              persistent: true
              class: beta3
  placement:
    dcloud:
      pricing:
        bloch-node:
          denom: uakt
          amount: 250000

deployment:
  bloch-node:
    dcloud:
      profile: bloch-node
      count: 1
