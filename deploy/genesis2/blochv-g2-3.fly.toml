# ── Genesis-2 MINER (new app, no old-testnet reuse) — peers to node-8 bootstrap ─
# RPC bound to loopback, not 0.0.0.0 (MED-6, Round 1): no [[services]] block
# publishes 16210 here, and no --rpc-api-key is set anywhere in this file, so
# a routable bind was an avoidable write-surface widening for a retired chain.
app = "blochv-g2-3"
primary_region = "gru"

[processes]
  app = "--rpc-bind 127.0.0.1 --rpc-port 16210 --listen /ip6/::/tcp/16110 --data-dir /bloch-data --genesis2 --carryover-snapshot /carryover.tsv --mine --dns-seed blochv-node-8.internal --allow-private-peers"

[mounts]
  source = "bloch_data"
  destination = "/bloch-data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
