# ── Genesis-2 MINER (new app) — peers to node-8 bootstrap over Fly 6PN (IPv6) ──
app = "blochv-g2-7"
primary_region = "gru"

[processes]
  app = "--rpc-bind 127.0.0.1 --rpc-port 16210 --listen /ip6/::/tcp/16110 --data-dir /bloch-data --genesis2 --carryover-snapshot /carryover.tsv --mine --dns-seed blochv-node-8.internal --allow-private-peers --peer /ip4/51.83.249.212/tcp/16110"

[mounts]
  source = "bloch_data"
  destination = "/bloch-data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
