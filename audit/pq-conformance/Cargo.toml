[package]
name = "bloch-pq-conformance"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "P9e audit harness: FIPS 204 / FIPS 205 KAT conformance and cross-implementation checks. NOT part of the node build."

# Own workspace root: this harness is excluded from the node build and must not
# change the workspace Cargo.lock (candidate SLH-DSA crates are NOT adopted by
# being listed here).
[workspace]

[lib]
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
bloch-crypto = { path = "../../crates/bloch-crypto" }
pqcrypto-mldsa = "=0.1.2"
pqcrypto-traits = "0.3"
# Independent FIPS 204 implementation used as an oracle (IntegrityChain).
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
# SLH-DSA candidates under review.
fips205 = { version = "=0.4.1", default-features = false, features = ["slh_dsa_shake_128s"] }
slh-dsa = "=0.2.0-rc.5"
rand_core_06 = { package = "rand_core", version = "0.6" }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"

[patch.crates-io]
pqcrypto-internals = { path = "../../crates/pqcrypto-internals" }
