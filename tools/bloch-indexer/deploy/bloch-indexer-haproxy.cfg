global
    maxconn 128
defaults
    mode http
    timeout connect 2s
    timeout client 15s
    timeout server 8s
frontend rpc
    bind 127.0.0.1:18080
    acl expected_host hdr(host),field(1,:) -i 139.180.166.5.nip.io 139.180.166.5 localhost 127.0.0.1
    http-request deny deny_status 403 unless expected_host
    acl historical_index path_beg /indexer/
    http-request set-header Host 127.0.0.1:17400
    use_backend historical if historical_index
    default_backend archival
backend archival
    server observer 127.0.0.1:17400
backend historical
    http-request replace-path ^/indexer/(.*) /\1
    server indexer 127.0.0.1:8091 maxconn 16
