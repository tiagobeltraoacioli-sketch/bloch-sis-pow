[package]
name = "bloch-native-wallet-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Isolated typed native laboratory signer feasibility; not the production wallet core"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
bloch-pos-committee = { path = "../../crates/bloch-pos-committee", features = ["native-dex-rehearsal"] }
bloch-euvm = { path = "../../crates/bloch-euvm" }
bloch-crypto = { path = "../../crates/bloch-crypto", default-features = false }
sha3 = "0.10"
zeroize = "1"
hex = "0.4"
serde_json = "1"

[dev-dependencies]
bloch-pos-committee = { path = "../../crates/bloch-pos-committee", features = ["native-wallet-fixtures", "native-lab"] }
