[package]
name = "genesis4-ceremony"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Genesis-4 ceremony: assembles the Genesis-4 genesis block from the signed carryover artifact. Offline tool, UNAUDITED."
publish = false

# Member of the root workspace. It used to carry its own `[workspace]`, on the
# argument that "nothing here can affect the live validation path of the
# running chain". That argument was about blast radius, and it was right about
# blast radius — but the effect of a private workspace is that `cargo build
# --workspace` and `cargo test --workspace` SKIP this crate entirely, so the
# tool that assembled the live Genesis-4 genesis block was never built by CI.
# bloch-pos-committee was moved back for the same reason. Blast radius is
# controlled by the dependency direction (one-way, by path, into this crate
# and never out of it), not by hiding the crate from the build.

[dependencies]
# Single source of truth for every tokenomics number. The ceremony does not
# restate a single allocation constant — it imports them, so the genesis it
# assembles cannot drift from the constants the consensus code compiles in.
bloch-pos-committee = { path = "../../crates/bloch-pos-committee" }
# The C1-frozen shielded-pool accumulator (§6.6.1): the ceremony recomputes the
# carried pool's accumulator root by replaying the leaves through the SAME
# SHAKE-256 tree the node and the SP1 guest use — never a reimplementation,
# which for a position-binding tree would be a consensus fork waiting to ship.
coherence-core = { path = "../../crates/coherence-core" }
sha3 = { version = "0.10", default-features = false }
hex = "0.4"
