[package]
name = "genesis4-ceremony"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Genesis-4 ceremony: assembles the Genesis-4 genesis block from the signed carryover artifact. Offline tool, UNAUDITED."
publish = false

# Standalone: NOT a member of the node workspace, the same posture as
# crates/bloch-pos-committee and crates/coherence-prover. Nothing here can
# affect the live validation path of the running chain.
[workspace]

[dependencies]
# Single source of truth for every tokenomics number. The ceremony does not
# restate a single allocation constant — it imports them, so the genesis it
# assembles cannot drift from the constants the consensus code compiles in.
bloch-pos-committee = { path = "../../crates/bloch-pos-committee" }
sha3 = { version = "0.10", default-features = false }
hex = "0.4"
