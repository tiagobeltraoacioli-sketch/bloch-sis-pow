name: ci

on:
  push:
    branches: [main, "euvm/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Genesis-4 build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install C toolchain (PQClean)
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: Build live node
        run: cargo build -p bloch-pos-node
      - name: Test live consensus
        run: cargo test -p bloch-pos-committee
      - name: Test live node
        run: cargo test -p bloch-pos-node
