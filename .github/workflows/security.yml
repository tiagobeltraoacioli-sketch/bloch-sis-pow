# Bloch Protocol — Security scanners (GitHub Actions)
#
# The chain these scanners gate is GENESIS-4, PROOF OF STAKE, live since
# 2026-08-13. Genesis-3 (proof of work) stopped at height 39,918. Where a job
# below is scoped to Genesis-3 code it says so; those exist for the audit trail
# of Genesis-4's opening ledger, not because anything mines.
#
# GitHub mirror of the security stage in .gitlab-ci.yml. GitLab CI runs on a
# self-hosted aarch64 Linux runner; this runs on GitHub-hosted ubuntu-latest,
# which already ships clang + cmake for the C-toolchain deps (rocksdb bindgen,
# blst, pqcrypto/PQClean).
#
# Gating philosophy (identical to GitLab):
#   BLOCKING     — cargo-audit, cargo-deny, clippy-hardened. A known
#                  high-severity advisory, a supply-chain/license violation, or
#                  a panic/overflow in consensus code must fail the pipeline.
#   REPORT-ONLY  — cargo-geiger, miri, cargo-fuzz smoke (early-warning surfaces;
#                  nightly-dependent or known-noisy, triaged in
#                  SECURITY_TOOLING.md, not yet hard gates). These use
#                  `continue-on-error: true` — GitHub's equivalent of GitLab's
#                  `allow_failure: true`.
#
# CHANGED 2026-09-04 (finding I-H4): osv-scanner and gitleaks moved from
# REPORT-ONLY to BLOCKING. osv-scanner is the only tool in this repository that
# sees GHSA-only advisories — yamux GHSA-vxx9-2994-q338 (CVSS 8.7) is invisible
# to cargo-audit's RustSec feed — so leaving it non-blocking meant the one
# uncovered surface had no verdict. Its accepted residuals are now explicit,
# dated and expiring in osv-scanner.toml instead of implicit in
# `continue-on-error`. scripts/check-scanners-blocking.py holds both files to
# that posture, and the same flip is in .gitlab-ci.yml.
#
# What these tools CANNOT catch (consensus logic + cryptographic parameter
# choices) is documented in SECURITY_TOOLING.md and requires human + third-party
# review before any consensus activation.

name: security

on:
  push:
    branches: [main, "euvm/**"]
  pull_request:
  workflow_dispatch:

# LOW-2 (Round 1): no top-level `permissions:` meant GITHUB_TOKEN inherited the
# repo/org default, which on an older repo can be read-WRITE across contents,
# packages and issues — far more than any job here needs. Default to
# read-only; escalate per-job only where a step genuinely writes (none do
# today — verified: zero `permissions:` overrides needed below).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── BLOCKING ────────────────────────────────────────────────────────────────

  # cargo-audit — RUSTSEC-only advisory backstop. `--deny warnings` also fails on
  # unmaintained/unsound informational advisories. The tracked ignore set (with
  # rationale) lives in audit.toml / .cargo/audit.toml.
  #
  # CHANGED 2026-09-05 (finding SC2-sharks-shamir): runs on EVERY workspace
  # lockfile, not just the root one. The standalone workspaces (pool/,
  # pool-proxy/, services/pq-shield-api/, ...) each pin their own Cargo.lock,
  # and a bare `cargo audit` at the root never read them — which is how pool/
  # shipped sharks 0.5.0 (RUSTSEC-2024-0398, biased Shamir coefficients in the
  # seed-recovery tool) through a green pipeline. The script also fails if a
  # committed lockfile is missing from its list, so a NEW standalone workspace
  # cannot silently escape the scanner.
  cargo-audit:
    name: cargo-audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch tip 2026-09; this action has no version tags — LOW-1)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        # PINNED (finding I-M12, Round 1): `--locked` only pins cargo-audit's
        # own transitive deps, never the TOOL's version, so every run took
        # whatever crates.io had today. Mirrors .gitlab-ci.yml's cargo-audit
        # job — bump this version deliberately.
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: cargo audit (all workspace lockfiles)
        run: bash scripts/audit-all-lockfiles.sh

  # cargo-deny — advisories + license policy (permissive only; AGPL allowed for
  # the six first-party crates, copyleft denied for third-party deps) + banned/
  # duplicate crates + untrusted registries. See deny.toml.
  cargo-deny:
    name: cargo-deny (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch tip 2026-09; this action has no version tags — LOW-1)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-deny
        # PINNED (I-M12): see cargo-audit job above; mirrors .gitlab-ci.yml.
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo deny check
        run: cargo deny check advisories bans licenses sources

  # clippy-hardened — BLOCKING, scoped to CONSENSUS-CRITICAL code only. Denies
  # panics (unwrap/expect) and unchecked arithmetic in consensus, emission and
  # tokenomics paths (a panic reachable from an untrusted block/tx is a DoS; an
  # emission overflow is an inflation bug).
  #
  # CHANGED 2026-08-13: its scope was Genesis-3 only and had never linted
  # bloch-pos-committee, the live consensus. Adding the live crates showed the
  # job could not have been green on the retired ones either, so it is now a
  # per-crate RATCHET — recorded baselines, fails when a count goes up. See
  # scripts/hardened-clippy.sh.
  #
  # CHANGED 2026-09-05 (audit finding I-M8): the ratchet counted `^error`
  # lines, but `-W clippy::arithmetic_side_effects` emits at WARNING severity —
  # so the unchecked arithmetic this job claims to deny was requested, emitted,
  # printed and scored as ZERO, 199 of them in live consensus, for as long as
  # the job existed. Counting now goes by LINT NAME through
  # --message-format=json, with a separate baseline for panics, arithmetic and
  # everything else at error severity.
  #
  # The toolchain is PINNED, not `stable`. A lint count is a property of
  # (source, toolchain): rustc and clippy add and reclassify lints every six
  # weeks, so a floating `stable` makes this gate's verdict a function of the
  # calendar rather than of the diff. The pin is read from
  # crates/bloch-pos-node/rust-toolchain.toml by the script itself, which fails
  # closed if that channel is unavailable; naming it here too only saves the
  # script an install.
  clippy-hardened:
    name: clippy-hardened (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Keep in step with crates/bloch-pos-node/rust-toolchain.toml; the script
      # re-reads that file and is the authority.
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (branch tip 2026-09; no version tags — LOW-1)
        with:
          toolchain: "1.94.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # A gate that miscounts goes green, which is exactly how this one hid 199
      # findings. Prove the counting half against hand-written logs before it
      # is allowed to judge the tree. Pure bash + python3, no toolchain.
      - name: hardened clippy — self-test
        run: bash scripts/hardened-clippy.selftest.sh
      - name: Install C toolchain (rocksdb/blst/PQClean)
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: hardened clippy
        run: bash scripts/hardened-clippy.sh

  # osv-scanner — supplementary scan against the OSV.dev DB (RustSec + GHSA).
  # BLOCKING since 2026-09-04 (finding I-H4). It is the ONLY tool here that sees
  # GHSA-only advisories cargo-audit's RustSec-only feed misses (yamux
  # GHSA-vxx9-2994-q338, CVSS 8.7; the plonky3 p3-* crates), so while it was
  # `continue-on-error: true` the one advisory surface nothing else covers could
  # not fail a build. The accepted residuals are now named, dated and expiring in
  # osv-scanner.toml — `fail-on-vuln` is left at its default (true), so anything
  # NOT listed there is a red build.
  osv-scanner:
    name: osv-scanner (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Every workspace lockfile, mirroring scripts/audit-all-lockfiles.sh
      # (finding SC2-sharks-shamir): the standalone workspaces are invisible
      # to a root-only scan.
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=Cargo.lock
            --lockfile=pool/Cargo.lock
            --lockfile=pool-proxy/Cargo.lock
            --lockfile=services/pq-shield-api/Cargo.lock
            --lockfile=euvm-tooling/Cargo.lock
            --lockfile=fuzz/Cargo.lock
            --lockfile=spikes/prover-cost/Cargo.lock
            --lockfile=spikes/prover-cost/rv32/Cargo.lock
            --lockfile=spikes/prover-cost/rv32f/Cargo.lock
            --lockfile=spikes/prover-cost/rv32h/Cargo.lock
            --lockfile=spikes/prover-cost/rv32k/Cargo.lock

  # gitleaks — catch committed credentials before they reach history (the
  # project has its own PAT-rotation lesson). BLOCKING since 2026-09-04 (finding
  # I-H4): a secret scanner whose failure is ignored reports the check without
  # gating it.
  #
  # Runs the SAME command as .gitlab-ci.yml through the same pinned installer,
  # rather than gitleaks-action: this file claims to mirror the GitLab security
  # stage, and two scanners with different scopes and different configs do not
  # mirror each other. `--no-git` scans the working tree — the scope, and the
  # 55-finding history backlog it excludes, are written out in .gitleaks.toml.
  secret-scan:
    name: gitleaks (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install gitleaks (pinned; fails if it cannot)
        run: |
          bash scripts/ci-install-scanner.sh gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: gitleaks detect
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --no-banner --redact

  # scanners-blocking guard — the regression test for finding I-H4 itself. Fails
  # if either CI file re-acquires a scanner escape hatch (`continue-on-error` /
  # `allow_failure: true`, an `exit 0` skip, `when: manual`) or drops a required
  # scanner job entirely. Pure Python 3, no toolchain.
  scanners-blocking-guard:
    name: scanners-blocking guard (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: selftest (the guard must be able to fail)
        run: python3 scripts/check-scanners-blocking.selftest.py
      - name: guard
        run: python3 scripts/check-scanners-blocking.py

  # ── REPORT-ONLY (early-warning; continue-on-error) ──────────────────────────

  # clippy (full, pedantic) — informational; the fork is not yet pedantic-clean.
  clippy:
    name: clippy (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch tip 2026-09; this action has no version tags — LOW-1)
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - run: cargo clippy --all-targets

  # cargo-geiger — quantifies `unsafe` across the dependency tree. Non-blocking:
  # geiger's cargo-metadata pass mismatches the workspace path-dep bloch-euvm and
  # emits "Failed to match" noise instead of a clean table (known geiger path-dep
  # limitation). First-party crates are separately held unsafe-free.
  cargo-geiger:
    name: cargo-geiger (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch tip 2026-09; this action has no version tags — LOW-1)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: Install cargo-geiger
        # PINNED (I-M12): see cargo-audit job above.
        run: cargo install cargo-geiger --version 0.13.0 --locked
      - run: cargo geiger --all-features --output-format Ascii

  # miri — UB / provenance / uninit-read on the pure-Rust consensus + emission
  # unit tests. Scoped to FFI-free crates (the node's C FFI — PQClean, rocksdb,
  # blst — cannot run under Miri). Non-blocking (needs nightly + rust-src).
  #
  # GENESIS-3 SCOPE, stated rather than hidden: this runs the V2 emission tests
  # of a chain that stopped. bloch-pos-committee is the better Miri target —
  # pure Rust, no FFI, and it is the live consensus — but its suite walks
  # 8,192-step SHAKE-256 reveal chains and 256-deep sparse Merkle trees, which
  # under the Miri interpreter is hours, not minutes. Putting it here without
  # first carving out a bounded subset would give a job that always times out,
  # which is worse than an honest gap. It is a gap.
  miri:
    name: miri-consensus (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly (branch tip 2026-09; no version tags — LOW-1)
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo miri test (tokenomics/emission)
        run: cargo +nightly miri test -p bloch-crypto --lib tokenomics

  # cargo-fuzz smoke — links the fuzz harness against the REAL bloch API and runs
  # each scanner-priority target for a bounded time to prove it does not fault on
  # shallow input. NOT a coverage-exhausting campaign (that runs continuously in
  # OSS-Fuzz — see fuzz/oss-fuzz/). Non-blocking.
  #
  # GENESIS-3 SCOPE. Every target below (block_parse, tx_parse, sha256d_pow,
  # ghostdag_order, sig_verify) is a Genesis-3 surface. The Genesis-4 parser and
  # P2P surfaces in bloch-pos-node have NO fuzz targets. That is a real gap in
  # coverage of the live chain, and writing the harness is the work that closes
  # it — not relabelling these.
  fuzz-smoke:
    name: cargo-fuzz smoke (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly (branch tip 2026-09; no version tags — LOW-1)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install C toolchain + cargo-fuzz
        # cargo-fuzz PINNED (I-M12): see cargo-audit job above.
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake
          cargo install cargo-fuzz --version 0.13.2 --locked
      - name: fuzz smoke (priority surfaces)
        run: |
          for t in block_parse tx_parse sha256d_pow ghostdag_order sig_verify; do
            echo "== fuzz smoke: $t =="
            cargo +nightly fuzz run "$t" -- -max_total_time=20 -runs=100000
          done
