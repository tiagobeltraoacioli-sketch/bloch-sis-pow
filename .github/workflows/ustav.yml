name: Ustav and Kirpich

on:
  pull_request:
  push:
    branches: [main, "feat/ustav-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ustav-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pinned toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Existing EUVM suite and Ustav regressions
        run: cargo +1.94.1 test --locked -p bloch-euvm -p bloch-ustav
      - name: Transition and cryptographic regressions in release profile
        run: cargo +1.94.1 test --locked --release -p bloch-euvm -p bloch-ustav --test ustav_kernel --test crypto_kernel
      - name: Concrete adapter lint
        run: cargo +1.94.1 clippy --locked -p bloch-ustav --all-targets --no-deps -- -D warnings
      - name: Executable lifecycle
        run: cargo +1.94.1 run --locked -p bloch-ustav --example lifecycle
