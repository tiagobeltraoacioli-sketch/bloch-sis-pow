# Bloch Protocol — Tests (GitHub Actions)
#
# WHY THIS FILE EXISTS (Round-2 audit finding TEST1-ci-runs-tests): the GitHub
# pipeline ran security scanners and nothing else — not one `cargo test`. On
# the GitLab side, `build-and-test` did run tests but was permanently red, so
# the nix stage behind it never ran. Between the two, no pipeline anywhere had
# a green-able job whose failure meant "a test broke". This one does.
#
# WHAT IS GATED — the LIVE crates: the Genesis-4 consensus and the crates on
# its path, plus the shared protocol crates every era leans on. The list is
# duplicated, on purpose, in scripts/check-tests-blocking.py; the guard fails
# the pipeline if a crate is dropped from here or an escape hatch
# (continue-on-error, exit 0, a removed timeout) is added. Change the list
# there and here together, with a written reason.
#
#   bloch-pos-committee   frozen Genesis-4 consensus math
#   bloch-pos-node        the `bloch-pos` binary the fleet runs
#   bloch-crypto          hybrid ML-DSA-65 ‖ Falcon-1024, on the consensus path
#   coherence-core        pulled by bloch-crypto (consensus path)
#   bloch-sis-pow         pulled by bloch-crypto (consensus path)
#   bloch-pq-vault        PQ-shield vault (commit-delay-reveal + clawback)
#   pqcrypto-internals    vendored PQClean bindings everything signs with
#   genesis4-ceremony     assembled the live genesis block (F21's fixture
#                         re-pin landed 2026-09-06 — 28 passed, 0 failed —
#                         and it joined this list the same day, finding N-6,
#                         Round 3: it had gone green but stayed outside every
#                         blocking gate)
#
# NOT gated here: legacy/genesis3-node and the Genesis-3 crates (closed chain,
# exercised by GitLab's workspace-tests job).
#
# The toolchain is PINNED to crates/bloch-pos-node/rust-toolchain.toml — the
# same reasoning as clippy-hardened in security.yml: a test verdict is a
# property of (source, toolchain), and a floating `stable` makes the gate's
# verdict a function of the calendar. The step fails closed if the pin cannot
# be read.

name: tests

on:
  push:
    branches: [main, "euvm/**"]
  pull_request:
  workflow_dispatch:

# LOW-2 (Round 1, mirrored from security.yml): no top-level `permissions:`
# meant GITHUB_TOKEN inherited the repo/org default. Default read-only; no
# job here writes anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cargo test over the live crates — BLOCKING. One invocation, so a failure
  # in any crate fails the job; --locked so the gate tests the committed
  # dependency graph, not whatever resolves on the runner today.
  cargo-test:
    name: cargo test — live crates (blocking)
    runs-on: ubuntu-latest
    # The committee's 8,192-step SHAKE reveal chains remain intentionally
    # expensive. The former ~19-minute debug SIS suite is now ~2 minutes via
    # the root package profile (LD-03), but 120 minutes preserves headroom for
    # the full eight-crate suite on a 2-core hosted runner.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pinned toolchain (crates/bloch-pos-node/rust-toolchain.toml)
        id: pin
        run: |
          ch="$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' crates/bloch-pos-node/rust-toolchain.toml)"
          if [ -z "$ch" ]; then
            echo "cannot read the toolchain pin — refusing to test on a floating toolchain" >&2
            exit 1
          fi
          rustup toolchain install "$ch" --profile minimal --no-self-update
          echo "toolchain=$ch" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install C toolchain (rocksdb bindgen, blst, PQClean)
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - name: Funded validator admission (isolated epoch-zero rehearsal)
        run: python3 -I scripts/rehearse-validator-admission.py
      - name: Validator withdrawal guard mutations
        run: python3 -I scripts/check-validator-lifecycle-mutations.py
      - name: Public bootnode RPC refusal regression
        run: bash deploy/bootnodes/verify-bootnodes.selftest.sh
      - name: Retired consensus isolation
        run: |
          python3 -I scripts/check-live-node-retired-isolation.py --selftest
          python3 -I scripts/check-live-node-retired-isolation.py
      - name: Finite validator activation boundary and replay
        run: python3 -I scripts/rehearse-validator-activation.py --output "$RUNNER_TEMP/validator-activation"
      - name: Funded validator joining between independent processes
        run: python3 -I scripts/rehearse-validator-joining-network.py --output "$RUNNER_TEMP/validator-joining-network"
      - name: Input-boundary regressions (before the full suite)
        run: cargo +${{ steps.pin.outputs.toolchain }} test --locked -p bloch-pos-node --bin bloch-pos audit_
      - name: Entropy guard regressions and thread-affinity doctests
        run: cargo +${{ steps.pin.outputs.toolchain }} test --locked -p pqcrypto-internals
      - name: cargo test (live crates)
        run: |
          cargo +${{ steps.pin.outputs.toolchain }} test --locked \
            -p bloch-pos-committee \
            -p bloch-pos-node \
            -p bloch-crypto \
            -p coherence-core \
            -p bloch-sis-pow \
            -p bloch-pq-vault \
            -p pqcrypto-internals \
            -p genesis4-ceremony

  # tests-blocking guard — the regression test for finding TEST1 itself. Fails
  # if this workflow or GitLab's build-and-test loses a live crate, loses its
  # timeout, or re-acquires an escape hatch. Pure Python 3, no toolchain.
  tests-blocking-guard:
    name: tests-blocking guard (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: selftest (the guard must be able to fail)
        run: python3 -I scripts/check-tests-blocking.selftest.py
      - name: guard
        run: python3 -I scripts/check-tests-blocking.py
      - name: Partition report rejects missing evidence
        run: python3 -I scripts/devnet-particao-report.test.py
      - name: Activation rehearsal refuses unexpected gate changes
        run: python3 -I scripts/rehearse-validator-activation.test.py
      - name: Attested-image remote-access guard selftest
        run: python3 -I scripts/check-attested-ssh.selftest.py
      - name: Attested-image remote-access guard
        run: python3 -I scripts/check-attested-ssh.py
